<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc">
  <title id="title">Proposed bidirectional actuator dynamometer</title>
  <desc id="desc">An actuator and load motor share an aligned base with flexible couplings and an inline output torque transducer. Output angle, motor angle, bus voltage and current, and temperatures are logged together. DC power passes through a safety disconnect, with regenerative energy management. Gearbox-only efficiency additionally needs an input-shaft torque measurement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#1b2639" stroke-width="1.5"/></marker>
  </defs>
  <g fill="none" stroke="#1b2639" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M55 200H665" stroke-dasharray="8 6" opacity=".35"/>
    <rect x="76" y="143" width="122" height="113" rx="8"/>
    <ellipse cx="76" cy="199" rx="15" ry="56"/>
