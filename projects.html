  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ::selection { background: rgba(200, 180, 155, 0.4); color: #fff; }
    [data-theme="light"] ::selection { background: rgba(170, 150, 120, 0.35); color: #1a202c; }

    :root {
      --font-latex: 'STIX Two Text', 'Latin Modern Roman', 'Computer Modern', 'Times New Roman', serif;
      --bg: #0a0a0a;
      --text: #fff;
      --text-dim: #888;
      --text-muted: #555;
      --border: rgba(255,255,255,0.08);
      --border-light: rgba(255,255,255,0.15);
      --nav-bg: rgba(10, 10, 10, 0.95);
      --nav-link: rgba(255, 255, 255, 0.7);
      --nav-link-hover: #FFFFFF;
      --nav-border-hover: rgba(255, 255, 255, 0.5);
      --glow-center: rgba(255, 255, 255, 0.04);
      --glow-mid: rgba(255, 255, 255, 0.015);
      --card-bg: rgba(10,10,10,0.92);
    }

    [data-theme="light"] {
      --bg: #f5f2ee;
      --text: #0f172a;
      --text-dim: #344054;
      --text-muted: #475467;
      --border: rgba(0,0,0,0.1);
      --border-light: rgba(0,0,0,0.22);
      --nav-bg: rgba(245, 242, 238, 0.95);
      --nav-link: rgba(0, 0, 0, 0.65);
      --nav-link-hover: #0f172a;
      --nav-border-hover: rgba(0, 0, 0, 0.4);
      --glow-center: rgba(0, 0, 0, 0.06);
      --glow-mid: rgba(0, 0, 0, 0.025);
      --card-bg: rgba(245,242,238,0.92);
    }

    /* Smooth theme transition */
    html.theme-transition,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, fill 0.35s ease, box-shadow 0.35s ease !important;
    }

    html {
      scroll-behavior: smooth;
      overflow-y: scroll;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar { display: none; }

    body {
      font-family: var(--font-latex);
      background-color: var(--bg);
      color: var(--text);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.6;
      overflow-y: scroll;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    body::-webkit-scrollbar { display: none; }

    /* Theme Toggle */





    /* Cursor Glow */
    .cursor-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      background: radial-gradient(circle, var(--glow-center) 0%, var(--glow-mid) 40%, transparent 70%);
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease;
      opacity: 0;
    }
    .cursor-glow.visible { opacity: 1; }

    @media (max-width: 768px) {
      .cursor-glow { display: none; }
      body { background-attachment: scroll; }
    }

    /* Nav */
    .nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1001;
      padding: 24px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      height: 80px;
      box-sizing: border-box;
    }

    .nav-link {
      color: var(--nav-link);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-family: var(--font-latex);
      border-bottom: 1px solid transparent;
      padding: 8px 0;
      transition: all 0.3s ease;
      line-height: 1;
    }

    .nav-link:hover {
      color: var(--nav-link-hover);
      border-bottom-color: var(--nav-border-hover);
    }
    .nav-link.active { color: var(--nav-link-hover); border-bottom-color: var(--nav-link-hover); }

    /* Main content */
    main {
      max-width: 1520px;
      margin: 0 auto;
      padding: 140px 40px 100px 40px;
      position: relative;
    }

    .page-header {
      margin-bottom: 32px;
      position: relative;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .filter-row {
      display: flex;
      justify-content: flex-start;
      gap: 32px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .filter-label {
      font-size: 14px;
      letter-spacing: 0.01em;
      color: var(--text-muted);
      font-family: var(--font-latex);
      margin-right: 8px;

    .filter-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      font-family: var(--font-latex);
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--border-light);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--card-bg);
      border-color: var(--border-light);
      color: var(--text);
    }

    .filter-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 8px;
    }

    @media (max-width: 768px) {

      body, .filter-btn, .project-title, .project-subtitle,

        font-family: var(--font-latex) !important;
      }

      .filter-bar {
        display: none;
      }
      .filter-divider {

      }

        font-size: 10px;

    /* Project grid - always 3 columns */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);

    /* Smooth view transitions */
    .projects-grid.view-transitioning .project-card {

      border: 1px solid var(--border);
      border-radius: 0;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 1;
      transform: scale(1);
      grid-column: span 1;
    }

      background: rgba(10,10,10,0.95);
      box-shadow: 0 4px 24px rgba(255,255,255,0.06);

    .project-preview-link {
      color: var(--text);
      font-weight: 600;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: color 0.2s ease, text-decoration-thickness 0.2s ease;
      position: relative;
    }

    .project-preview-link:hover {
      color: var(--text);
      text-decoration-thickness: 2px;
    }

    .project-hover-preview {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      width: 220px;
      height: 140px;
      border-radius: 8px;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      background: #000;
    }

    .project-hover-preview.visible {
      opacity: 1;
      transform: scale(1);
    }

    .project-hover-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    }

      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

  <script>
// Builds one reading row from a container's loose prose and its evidence: bounded prose on the
// left, the primary figure or table on the right, and any further evidence spanning the row below.
// placeNode(node, slots) can route a block itself and return true; otherwise blocks join the prose.
function buildReadingRow(container, { skip = null, evidence: evidenceSelector, placeNode = () => false } = {}) {
  const body = document.createElement('div');
  body.className = 'reading-row';
  const prose = document.createElement('div');
  prose.className = 'reading-prose';
  const evidence = document.createElement('div');
  evidence.className = 'reading-evidence';
  const supplement = document.createElement('div');
  supplement.className = 'reading-supplement';
  const slots = { prose, evidence, supplement };
  const evidenceNodes = new Set(evidenceSelector ? container.querySelectorAll(`:scope > :is(${evidenceSelector})`) : []);
  let paragraph = null;
  const finishParagraph = () => { paragraph = null; };
  // The first figure sits beside the prose; later figures span the row below.
  const appendFigure = figure => {
    (evidence.querySelector(':scope > figure') ? supplement : evidence).append(figure);
  };
  for (const node of [...container.childNodes]) {
    if (node === skip) continue;
    if (node.nodeName === 'BR') { finishParagraph(); node.remove(); continue; }
    if (node.nodeType === Node.TEXT_NODE && !node.textContent.trim()) { node.remove(); continue; }
    if (node.nodeType === Node.ELEMENT_NODE && node.matches('.reading-after')) {
      finishParagraph();
      supplement.append(node);
    } else if (evidenceNodes.has(node)) {
      finishParagraph();
      if (node.matches('figure')) appendFigure(node);
      else if (node.matches('.project-inline-grid')) {
        [...node.children].forEach(appendFigure);
        node.remove();
      } else evidence.append(node);
    } else if (node.nodeType === Node.ELEMENT_NODE && node.matches('details, div, ul, dl, table, figure, p, aside')) {
      finishParagraph();
      if (!placeNode(node, slots)) prose.append(node);
    } else {
      if (!paragraph) { paragraph = document.createElement('p'); prose.append(paragraph); }
      paragraph.append(node);
    }
  }
  body.append(prose);
  if (evidence.childNodes.length) body.append(evidence);
  else body.classList.add('prose-only');
  if (supplement.childNodes.length) body.append(supplement);
  container.append(body);
}

// After equations render, place each row's figures beside or under the prose so the two
// columns end as close together as possible. Desktop only: narrow screens stack the row.
function balanceReadingRows(root) {
  if (!window.matchMedia('(min-width: 901px)').matches) return;
  root.querySelectorAll('.reading-row').forEach(row => {
    const prose = row.querySelector(':scope > .reading-prose');
    const evidence = row.querySelector(':scope > .reading-evidence');
    const supplement = row.querySelector(':scope > .reading-supplement');
    if (row.classList.contains('reading-stacked')) return;
    if (prose && !evidence) {
      // A long run of text with no figure reads as two columns of a paper page.
      row.classList.remove('reading-columns');
      if (prose.getBoundingClientRect().height > 300 && !prose.querySelector('table, figure')) row.classList.add('reading-columns');
      return;
    }
    if (!prose || !evidence) return;
    // Figures keep their reading order, so rerunning after fonts load or a resize is stable.
    let figures = row.querySelectorAll(':scope > * > figure[data-balance-order]');
    if (!figures.length) {
      figures = [...evidence.children, ...(supplement ? supplement.children : [])]
        .filter(node => node.matches('figure') && !node.querySelector('table'));
      figures.forEach((figure, i) => { figure.dataset.balanceOrder = i; });
    }
    figures = [...figures].sort((a, b) => a.dataset.balanceOrder - b.dataset.balanceOrder);
    if (!figures.length || figures.length > 5) return;
    const gap = 24;
    const heights = figures.map(figure => figure.getBoundingClientRect().height + gap);
    figures.forEach(figure => figure.remove());
    const proseBase = prose.getBoundingClientRect().height;
    const evidenceBase = evidence.getBoundingClientRect().height;
    let best = null;
    for (let mask = 0; mask < 1 << figures.length; mask++) {
      if (!evidenceBase && !mask) continue;
      let p = proseBase, e = evidenceBase;
      heights.forEach((h, i) => { if (mask & (1 << i)) e += h; else p += h; });
      const cost = Math.max(p, e) + Math.abs(p - e) * 0.01;
      if (!best || cost < best.cost) best = { cost, mask };
    }
    // Short text beside several figures: set the text in two columns across the row and the
    // figures side by side beneath it, when that leaves less empty space.
    const textOnly = !prose.querySelector('table, figure, .board-layer-viewer');
    let stacked = proseBase / 2;
    for (let i = 0; i < heights.length; i += 2) stacked += Math.max(heights[i], heights[i + 1] || 0);
    if (textOnly && !evidenceBase && figures.length >= 2 && stacked + 40 < best.cost) {
      const below = supplement || row.appendChild(Object.assign(document.createElement('div'), { className: 'reading-supplement' }));
      figures.forEach(figure => below.append(figure));
      evidence.remove();
      row.classList.add('prose-only', 'reading-columns', 'reading-stacked');
      return;
    }
    figures.forEach((figure, i) => (best.mask & (1 << i) ? evidence : prose).append(figure));
    if (supplement && !supplement.children.length) supplement.remove();
  });
}

function scheduleReadingBalance(description) {
  const run = () => requestAnimationFrame(() => { if (description.isConnected) balanceReadingRows(description); });
  (document.fonts?.ready || Promise.resolve()).then(run);
  document.fonts?.addEventListener('loadingdone', run, { once: true });
  setTimeout(run, 1200);
  if (!scheduleReadingBalance.resizeBound) {
    scheduleReadingBalance.resizeBound = true;
    let timer = 0;
    window.addEventListener('resize', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const current = document.querySelector('.detail-content:is([data-project-id="formula-electric"], [data-project-id="ns-us-pulse-generator"]) #detailDescription');
        if (current) balanceReadingRows(current);
      }, 200);
    });
  }
}

  <section class="latex-section" id="wolfrom-first-principles">

    In a Wolfrom gearbox, the power circulating through the two ring-gear meshes reaches 8 to 9 times the output power, which amplifies even a small loss per mesh, so mesh efficiency decides both overall efficiency and whether the joint can be backdriven.

    Here $i_{sc}=5.606$, $i_0=0.889$, $i=50.45$, and $\\eta_s$, $\\eta_a$, and $\\eta_b$ are the sun, fixed-ring, and output-ring mesh efficiencies.

    The selected architecture has no moving parts at the inlet and keeps the fan outside the casing, in line with FSAE rule EV.6.5.4. Module 2 receives strong flow because it sits next to the fan, but module 1 has already warmed that air.<br><br>
    <figure class="flow-path">
      <ol>
        <li><b>Passive inlet</b>The exhaust fan and the car's motion draw ambient air through the louvres and mesh.</li>
        <li><b>Module 1</b>Air enters through a 5 mm perforated hole pattern and crosses the cells perpendicular to their axis.</li>
        <li><b>Perforated divider</b>Air leaving module 1 passes into the second module.</li>
        <li><b>Module 2</b>Receives high flow from its position next to the fan, but the air has already been heated upstream.</li>
        <li><b>Outlet panel</b>A perforated wall panel feeds the fan blades.</li>
        <li><b>Active exhaust</b>The fan pulls air out across a 15 mm air gap to ambient.</li>
      </ol>
      <figcaption>Air path through one cooling branch: one exhaust fan pulls air through two modules in series.</figcaption>
    </figure>
    I built a MATLAB pressure-drop model that represents each fan by its Sanyo Denki pressure-flow curve, with the inlet, module, divider, and outlet losses kept separate to show which restriction dominates. The earlier system-level operating point was <b>425 CFM at 521 Pa</b>, and the cell bank accounted for roughly 79% of the modeled pressure loss.<br><br>
    <details class="project-disclosure">
      <summary>Pack geometry and cooling branch</summary>
      <div class="project-disclosure-content">
        The modeled pack uses 420 cells in ten 14s3p modules. Two 42-cell modules share each cooling branch, and the perforated divider between them sets how much air reaches the downstream bank.<br><br>
        <figure class="project-feature-figure">
          <img src="/assets/formula-cooling-module-stackup.png" alt="Exploded 42-cell module showing cell holders, sensing electronics, and covers" width="888" height="409" loading="lazy" decoding="async">
          <figcaption>Reference module stackup used to communicate the cooling path; the cooling geometry and CFD model are my work.</figcaption>
        </figure>
      </div>
    </details>
    I chose a <b>15 mm exhaust air gap</b>. Gap loss scales roughly as $1/g^2$, so narrowing from 20 mm to 15 mm costs about 30 Pa, around 4% of the fan budget and about 1 K on the hottest cell. Narrowing to 10 mm adds another 70 Pa, at which point the fan hub starts working against the wall. Runs at 20, 15, and 10 mm showed aggressive recirculation in the 10 mm gap, which would also be harder to manufacture. The current model includes the 45° inlet louvres and mesh losses.<br><br>
    <details class="project-disclosure">
      <summary>Rain-inlet geometry and free-area calculations</summary>
      <div class="project-disclosure-content">
        I sized louvre angle, pitch, thickness, and depth to block any direct rain path into the cell bank without sacrificing inlet area. For slat length $L$, angle $\\theta$, pitch $p$, and thickness $t_s$:
        $$\\begin{gathered}
        d=L\\cos\\theta,\\qquad r=L\\sin\\theta\\\\
        f=\\cos\\theta-\\frac{t_s}{p}
        \\end{gathered}$$
        The working geometry uses 45° slats, 20 mm long and 2 mm thick at 12 mm pitch, which gives about 14 mm of depth and rise. The louvre alone has a geometric free-area ratio of roughly 0.55, but the combined mesh/louvre grille in the current CFD uses 0.14, and the divider uses 0.25.<br><br>
        <figure class="project-feature-figure">
          <img src="/assets/formula-cooling-inlet-handcalcs.jpg" alt="Original rain-inlet sketches and derivations for louvre angle, pitch, water shielding, free area, and pressure loss" width="1406" height="1796" loading="lazy" decoding="async">
          <figcaption>Inlet hand calculations connecting rain protection, print geometry, and free area.</figcaption>
        </figure>
        <figure class="project-feature-figure">
          <img src="/assets/formula-cooling-rain-inlet.jpg" alt="Icepak model of one cooling branch with the louvred rain inlet on the intake face and cell temperatures shown in colour" width="1064" height="724" loading="lazy" decoding="async">
          <figcaption>The louvred rain inlet as modelled in Icepak, on the intake face of the branch.</figcaption>
        </figure>
      </div>
    </details>
    <details class="project-disclosure">
      <summary>Fan-spacing pressure-loss trade</summary>
      <div class="project-disclosure-content">
        At fixed flow, narrowing the fan gap raises velocity and dynamic pressure roughly with the inverse square of gap depth:
        $$\\Delta p_{\\mathrm{gap}}\\sim\\frac{\\rho}{2}
        \\left(\\frac{Q}{w g}\\right)^2$$
        The analytical 47 CFM sweep gives about 33 Pa at 20 mm, 60 Pa at 15 mm, and 130 Pa at 10 mm. Choosing 15 mm keeps total depth near 56 mm, including the 38 mm fan and the roughly 3 mm wall, and the 10 mm geometry also showed recirculation during iteration.<br><br>
        <figure class="project-feature-figure">
          <img src="/assets/formula-cooling-airgap-trade.jpg" alt="Analytical exhaust-gap pressure loss versus depth with 10, 15, and 20 millimeter cases" width="1200" height="690" loading="lazy" decoding="async">
          <figcaption>The 15 mm gap balances packaging depth against the rapidly increasing pressure penalty.</figcaption>
        </figure>
        <figure class="project-feature-figure">
          <img src="/assets/formula-cooling-airgap-streamlines.jpg" alt="Icepak side view of streamlines leaving module 2 through the outlet panel, turning through the 15 millimetre air gap, and entering the exhaust fan" width="330" height="883" loading="lazy" decoding="async">
          <figcaption>Streamlines through the 15 mm gap (outlined) into the exhaust fan.</figcaption>
        </figure>
      </div>
    </details>
    <details class="project-disclosure">
      <summary>Conduction to the casing</summary>
      <div class="project-disclosure-content">
        The conduction path runs from cell to temperature-sense PCB to polycarbonate cell holder to thermal foam to casing, the minimum possible number of interfaces. Even with a conductor in place of the polycarbonate, the path remains a multi-layer thermal resistance network, and each interface adds resistance.<br><br>
        Even with best-case assumptions (foam at 50% compression, full contact area, no contact resistance, and the casing held at 35 °C), the path removes about <b>16 W per module</b>. Using the compressed foam thickness raises that to about 17.5 W, still under a fifth of the 99 W each module generates at the 50 A design case. Both figures are optimistic, since contact will be imperfect under tolerance and vibration and the casing will warm up.<br><br>
        The larger concern is measurement. The rules require cell temperature at the negative terminal, so using the PCB or a copper pour as a heat-spreading path would even out temperatures around the sensors and bias the reading. The cathode side is worse, since wire bonds, voltage sensing, and BMS connections all add interfaces.<br><br>
        Conduction is therefore secondary. The foam remains useful for sealing and vibration and for filling the air gaps around the modules, which welding will leave uneven and which would otherwise let air bypass the cells.<br><br>
        <figure class="project-feature-figure cooling-conduction-network">
          $$R_i=\\frac{L_i}{k_iA},\\qquad A=\\frac{\\pi(21.7\\,\\mathrm{mm})^2}{4}=3.7\\times10^{-4}\\,\\mathrm{m^2}$$
          <table class="project-data-table">
            <thead><tr><th>Layer</th><th>Thickness</th><th>k (W/m·K)</th><th>R per cell (K/W)</th></tr></thead>
            <tbody>
              <tr><td>FR-4 temperature-sense PCB</td><td>1.6 mm</td><td>0.3</td><td>14.4</td></tr>
              <tr><td>Polycarbonate cell holder</td><td>3 mm</td><td>0.2</td><td>40.5</td></tr>
              <tr><td>Thermal foam, k at 50% compression</td><td>3.175 mm</td><td>0.86</td><td>10.0</td></tr>
              <tr><td>Total</td><td></td><td></td><td>64.9</td></tr>
            </tbody>
          </table>
          $$\\begin{gathered}\\dot{Q}_{\\mathrm{cell}}=\\frac{\\Delta T}{R_{\\mathrm{tot}}}=\\frac{25\\,\\mathrm{K}}{64.9\\,\\mathrm{K\\,W^{-1}}}=0.385\\,\\mathrm{W}\\\\ \\dot{Q}_{\\mathrm{module}}=42\\,\\dot{Q}_{\\mathrm{cell}}=16.2\\,\\mathrm{W}\\end{gathered}$$
          <figcaption>Best-case series resistance from one cell to a 35 °C casing, with the cell at the 60 °C limit. Halving the foam thickness for compression gives about 17.5 W per module.</figcaption>
        </figure>
      </div>
    </details>

    </section>
    <section class="latex-section" id="sn6-transient">
    <strong>Transient CFD</strong><br><br>
    The <b>50 A design case</b> uses 35 °C inlet air, a 15 mm fan gap, and a 4% busbar heat allowance, and each branch runs near <b>40 CFM at 780 Pa</b>.<br><br>
    At 25 minutes the hottest cell reaches <b>54.6 °C</b>, the mean is 47.6 °C, and the coolest is 40.7 °C, with a 2.4 K standard deviation. That leaves 2.4 K of margin to the target using the conservative CFD heat-transfer coefficient, and about 10 K using the correlation value.<br><br>
    Air heats along the bank, producing a 7 K front-to-back gradient, and the hottest cells sit in the middle of module 2, where most of the already-heated air flows. The max-to-min range of <b>13.9 K</b> is still above the 5 K uniformity goal, so the next geometry priority is redistributing flow through the divider and cell passages.<br><br>
    <figure class="project-feature-figure">
      <img src="/assets/formula-cooling-transient-50a-top.jpg" alt="Top view of the 50 A transient CFD showing warmed downstream cells and streamlines through the divider" width="1414" height="800" loading="lazy" decoding="async">
      <figcaption>Section view: air warms in module 1 before reaching module 2, and the divider openings and bypass paths determine which cells receive that flow.</figcaption>
    </figure>
    <details class="project-disclosure">
      <summary>Model inputs and assumptions</summary>
      <div class="project-disclosure-content">
        <table class="project-data-table">
          <thead><tr><th>Input</th><th>Value</th></tr></thead>
          <tbody>
            <tr><td>Cell</td><td>Ø21.7 × 70.5 mm, 85 J/K; k 25 W/m·K axial and 0.6 W/m·K radial</td></tr>
            <tr><td>Resistance</td><td>R<sub>eff</sub> 8.5 mΩ from Reliance's energy-balance fit (datasheet DCR 7.5 mΩ)</td></tr>
            <tr><td>Heat</td><td>Measured SN5 current waveform scaled to the load case: 198 W per branch at 50 A, plus 4% for the busbar loop</td></tr>
            <tr><td>Fan</td><td>Sanyo Denki 9HV0824 pressure-flow curve, exhaust, 15 mm air gap</td></tr>
            <tr><td>Grilles</td><td>Free-area ratio 0.14 at the inlet (mesh and louvre) and 0.25 at the divider</td></tr>
            <tr><td>Ambient</td><td>35 °C, with inlet air at the same temperature</td></tr>
          </tbody>
        </table>
        <table class="project-data-table">
          <thead><tr><th>Assumption</th><th>Effect</th></tr></thead>
          <tbody>
            <tr><td>Transient, 25 min in 5 s steps</td><td>Curves flatten by about 20 min, with a forced-cooling time constant near 15 min</td></tr>
            <tr><td>Adiabatic outer walls</td><td>Neglects passive loss of about 3%</td></tr>
            <tr><td>Five identical, independent branches</td><td>No interaction between branches</td></tr>
            <tr><td>No boundary-layer mesh</td><td>Under-predicts h by about 2×, so fan-on results are conservative</td></tr>
            <tr><td>Busbar and PCB thermal mass omitted</td><td>About 1 K</td></tr>
          </tbody>
        </table>
        <p class="reading-after">The run reports hottest, mean, and coolest cell temperature and spread over time, time to 60 °C, the fan operating point, the hottest-cell location, and the flow and temperature fields. The 15-minute forced-cooling time constant, against roughly 3.1 hours for the passive case, lets the fan-on design approach steady state during endurance.</p>
      </div>
    </details>

    </section>
    <section class="latex-section" id="sn6-analytical">
    <strong>Analytical and CFD Comparison</strong><br><br>
    Air near the outlet has already absorbed heat from the upstream cells, so even with a reasonable local convection coefficient, those cells see a smaller temperature difference to the cooling air. The analytical model gave the system-level answer, and CFD showed where that assumption broke down.<br><br>
    Early MATLAB sizing predicted <b>425 CFM total at 521 Pa</b> and 234 W fan power, with cell-bank loss dominating. The current CFD includes a more restrictive inlet and plenum.<br><br>
    Earlier tube-bank correlations gave $h\\approx125\\text{–}160\\,\\mathrm{W\\,m^{-2}\\,K^{-1}}$, while representative Icepak geometry gave about $48\\,\\mathrm{W\\,m^{-2}\\,K^{-1}}$. Bypass and uneven flow reduce the effective cooling, and boundary-layer mesh resolution is still a modeling uncertainty.<br><br>
    <details class="project-disclosure">
      <summary>MATLAB fan/system curve and convection model</summary>
      <div class="project-disclosure-content">
        I intersected the Sanyo fan pressure-flow curve with the modeled cell-bank and inlet losses, which put the earlier analytical operating point at about 85 CFM per branch. The pressure split was 412 Pa across the cells, 106 Pa at the inlet, and 3 Pa miscellaneous, so the cell bank accounted for about 79% of the loss.<br><br>
        <figure class="project-feature-figure">
          <img src="/assets/formula-cooling-fan-system-curve.png" alt="Earlier MATLAB fan and cross-flow system curves intersecting near 12 cubic meters per minute and 521 pascals" width="804" height="530" loading="lazy" decoding="async">
          <figcaption>Earlier analytical sizing model. The current detailed branch CFD predicts a different operating point.</figcaption>
        </figure>
        The tube-bank calculation uses gap velocity and Reynolds number to estimate Nusselt number, then $h=Nu\\,k_{\\mathrm{air}}/D$. An NTU-effectiveness model accounts for the air warming along the cells. Since it assumes equal branch flow and idealized cell-bank exposure, the correlation is sensitive to bypass and confinement.<br><br>
        <figure class="project-feature-figure">
          <img src="/assets/formula-cooling-h-vs-flow.png" alt="Analytical aligned tube-bank heat-transfer coefficient versus total pack airflow" width="681" height="450" loading="lazy" decoding="async">
          <figcaption>Idealized convection estimate versus flow; the operating-point estimate exceeds representative CFD heat transfer.</figcaption>
        </figure>
      </div>
    </details>
    <figure class="project-feature-figure">
      <img src="/assets/formula-cooling-endurance-model.jpg" alt="MATLAB plots of temperature versus RMS current, the 60 A transient response, time to the sealed-pack limit, and passive thermal resistance" width="1249" height="866" loading="lazy" decoding="async">
      <figcaption>1D model comparison at 35 °C: the 60 A stress case ends near 64 °C with CFD-derived cooling and 52 °C with the ideal correlation.</figcaption>
    </figure>
    With a <b>12 K model difference</b>, measuring the cooldown conductance is a priority. A passive CFD run with zero imposed flow and buoyancy enabled also checks the no-fan baseline.<br><br>
    <details class="project-disclosure">
      <summary>Heat-budget crossings and cooling limits</summary>
      <div class="project-disclosure-content">
        I compared the quadratic heat-generation curve with the per-cell energy allowance over 25 minutes. With a 35 °C start and 60 °C ceiling, the adiabatic allowance is about 1.42 W per cell, which gives the roughly 39 A no-fan bound, and the plotted CFD-derived fan allowance crosses near 55 A.<br><br>
        <figure class="project-feature-figure">
          <img src="/assets/formula-cooling-heat-budget.jpg" alt="Cell heat versus pack RMS current with passive, CFD-derived fan, and ideal air-side cooling bounds" width="1379" height="1008" loading="lazy" decoding="async">
          <figcaption>Analytical 60 °C-limit comparison. The project uses 50 A as its design case and 60 A as the stress case; these current bounds remain model estimates.</figcaption>
        </figure>
        These limits move with initial temperature, effective cell resistance, airflow, and measured UA, and the ideal air-side line is a theoretical upper bound. Endurance replay and fan-on cooldown tests will check the useful cooling margin.
      </div>
    </details>

    </section>
    <section class="latex-section" id="sn6-design">
    <strong>Design Changes</strong><br><br>
    The next geometry changes follow directly from the CFD and the measured fan curve:
    <ul class="project-result-list">
      <li><b>Open the divider restriction.</b> This should reduce the local pressure penalty between the two module banks and improve the downstream flow split.</li>
      <li><b>Remove bad inlet paths.</b> Block the perforations that feed easy bypass routes, since useful flow through the cells matters more than hole count.</li>
      <li><b>Keep the 15 mm exhaust gap.</b> It balances package depth against the rapidly increasing pressure loss at smaller gaps.</li>
    </ul>
    <details class="project-disclosure">
      <summary>Rejected and future airflow changes</summary>
      <div class="project-disclosure-content">
        Push-pull airflow increased the earlier branch flow, but it requires extra fans, wiring, and packaging. I still plan to evaluate a thin intake fan paired with the existing high-static-pressure exhaust fan, with inlet and outlet flow solved as one operating point.
      </div>
    </details>

    </section>
    <section class="latex-section" id="sn6-validation">
    <strong>Endurance Validation</strong><br><br>
    The next tests isolate heat generation, airflow, and heat transfer:
    <ul class="project-result-list">
      <li><b>Endurance.</b> Replay logged current, cell temperatures, initial/ambient temperatures, and fan state.</li>
      <li><b>Airflow.</b> Check 40–47 CFM using branch pressure taps and an outlet anemometer.</li>
      <li><b>Cooldown.</b> Fit effective UA from fan-on temperature decay after the run.</li>
    </ul>
    The correlation targets are <b>flow within 10%</b> and <b>temperatures within 3 K</b>. SN5 provides the uncooled baseline, and temporary fan/duct tests and the assembled SN6 will verify the active cooling.<br><br>
    Bodywork could also shift inlet/exhaust pressure, so we will compare pressure and flow against vehicle speed with the bodywork installed.
    </section>`;

        excerpt: 'Custom high-voltage pulse-generator PCB for complex-oxide device research, validated through 30 V before a clean-sheet high-speed redesign.',
        description: `
          <section class="latex-section" id="pcb-overview">
          <strong>Overview</strong><br><br>
          <dl class="project-summary">
            <dt>Goal</dt><dd>A pulse generator in Ramesh Lab for fast electrical characterization of BiFeO<sub>3</sub> and related complex-oxide devices. It applies controlled voltage pulses while a source-measure unit sets the bias and an oscilloscope captures both DUT terminals.</dd>
            <dt>Design</dt><dd>This assembled four-layer instrument is <b>V2</b>: RP2040 control, high-speed gate drive, GaN switching, relay-selected routing, external Keithley biasing, and grounded coaxial interfaces. V1 was the earlier microsecond-only pulse-generator prototype, documented under <a href="#pcb-next" data-project-section="pcb-next">Next Revision</a>.</dd>
            <dt>Scope</dt><dd>KiCad schematic and four-layer layout, LTspice checks, assembly and rework, the enclosure, and staged bench bring-up with Python and LabVIEW.</dd>
            <dt>Result</dt><dd>Programmable operation through 30 V, down to pulses of about 100 ns. Testing also showed that the passive return edge depends on device and fixture capacitance, which limits the shortest pulses.</dd>
            <dt>Next</dt><dd>A clean-sheet revision with active control of both edges, fully digital timing, and a 1 ns-class minimum-pulse target.</dd>
          </dl>
          <figure class="project-feature-figure">
            <picture><source srcset="/assets/pulse-v1-board.webp" type="image/webp"><img src="/assets/pulse-v1-board.jpeg" alt="Populated V2 pulse-generator PCB installed inside its enclosure" width="2803" height="2889" loading="lazy" decoding="async"></picture>
            <figcaption>Populated V2 board with RP2040 control, relay routing, GaN switching, and coaxial interfaces.</figcaption>
          </figure>
          </section>

          <section class="latex-section" id="pcb-target">
          <strong>Experiment Target</strong><br><br>
          One board should cover a wide pulse-width range. V2 has demonstrated operation into the approximately 100 ns regime, while the 1 ns endpoint remains a next-revision target.<br><br>
          Oxide ferroelectric capacitors are far from 50 Ω loads. The expected devices behave roughly like <b>tens of pF</b> in parallel with <b>MΩ-scale</b> leakage resistance, so their impedance varies strongly with frequency:
          $$Z_{\\mathrm{DUT}}(\\omega)=\\frac{R}{1+j\\omega RC},\\qquad f_c=\\frac{1}{2\\pi RC}$$
          Film thickness varies, so capacitance and leakage also vary between devices. A representative 10 pF and 1 MΩ (real devices scatter around it) gives $RC=10\\,\\mu\\mathrm{s}$ and $f_c\\approx16\\,\\mathrm{kHz}$, so the resistive path matters during slower biasing and retention measurements, while capacitance and fixture parasitics dominate the fastest edges.<br><br>
          Edges near 1 ns need roughly $f_{\\mathrm{BW}}\\approx0.35/t_r\\approx350\\,\\mathrm{MHz}$ of measurement bandwidth, which sets the oscilloscope floor and requires a short, terminated transmission-line path.<br><br>
          The board is therefore an experiment interface first and a fast switch second. It must preserve delivered voltage, timing, source-measure bias state, and measurement visibility while fragile oxide devices are pulsed repeatedly.<br><br>
          <table class="project-data-table">
            <thead><tr><th>Parameter</th><th>Target</th><th>V2 status</th></tr></thead>
            <tbody>
              <tr><td>DUT voltage</td><td>0–30 V</td><td>Demonstrated through 30 V</td></tr>
              <tr><td>Pulse width</td><td>1 ns to 1 ms</td><td>Microseconds down to about 100 ns</td></tr>
              <tr><td>Device load</td><td>About 10 pF with 1 MΩ leakage, varying with film thickness</td><td>Bring-up on known dummy loads</td></tr>
              <tr><td>Interfaces</td><td>50 Ω coaxial</td><td>Grounded BNC</td></tr>
              <tr><td>Repetition</td><td>Single-shot to 1 kHz on devices; about 100 kHz on dummy loads</td><td>Single-shot and repeated commands</td></tr>
              <tr><td>Scope bandwidth</td><td>At least 500 MHz, 1 GHz preferred, 50 Ω terminated</td><td>Capture at both DUT terminals</td></tr>
            </tbody>
          </table>
          </section>

          <section class="latex-section" id="pcb-measurement">
          <strong>Measurement Problem</strong><br><br>
          In any captured current waveform, the device response arrives mixed with leakage, displacement current, fixture capacitance, and the response of the test setup:
          $$i_{\\mathrm{meas}}(t)=i_{\\mathrm{device}}(t)+\\frac{v(t)}{R_{\\mathrm{leak}}}+\\left(C_{\\mathrm{DUT}}+C_{\\mathrm{fixture}}\\right)\\frac{\\mathrm{d}v}{\\mathrm{d}t}$$
          The board includes grounded BNC interfaces, a dedicated scope-sync output, known dummy loads, relay-selected paths, and direct source-measure compatibility so those contributions can be characterized before a sample is connected.<br><br>
          I also measure both DUT terminals to compare the delivered waveform against the source waveform. That distinction proved critical in V2 testing and directly shaped the next architecture.<br><br>
          </section>

          <section class="latex-section" id="pcb-architecture">
          <strong>V2 Architecture</strong><br><br>
          V2 has separate fast and microsecond signal paths, RP2040-based digital triggering, relay-selected routing, local driver power, a GaN pulldown stage, and dedicated connections for Keithley HI/LO, DUT, external trigger, and oscilloscope synchronization. The Keithley sets the device bias, the fast stage creates the pulse transition, and the scope records the response at the experiment interfaces.<br><br>
          <figure class="flow-path">
            <ol>
              <li><b>Control</b>RP2040 digital triggering, an external trigger input, and relay selection between the fast and microsecond paths.</li>
              <li><b>Drive</b>Local driver power and high-speed gate drive.</li>
              <li><b>Switching</b>The GaN pulldown stage creates the pulse transition.</li>
              <li><b>Device</b>Keithley HI/LO sets the bias across the DUT.</li>
              <li><b>Measurement</b>A dedicated scope-sync output, with both DUT terminals captured.</li>
            </ol>
            <figcaption>V2 signal chain, from digital control to the oscilloscope.</figcaption>
          </figure>
          <div class="project-inline-grid">
            <figure>
              <picture><source srcset="/assets/ns-pulse-schematic-thumbnail.webp" type="image/webp"><img src="/assets/ns-pulse-schematic-thumbnail.png" alt="KiCad schematic for the V2 nanosecond and microsecond pulse-generator board" width="1042" height="713" loading="lazy" decoding="async"></picture>
              <figcaption>V2 schematic covering control, relay routing, gate drive, GaN switching, bias, and measurement interfaces.</figcaption>
            </figure>
            <figure>
              <picture><source srcset="/assets/ns-pulse-board-layout.webp" type="image/webp"><img src="/assets/ns-pulse-board-layout.png" alt="Combined KiCad layout view of the four-layer V2 pulse-generator PCB" width="1002" height="893" loading="lazy" decoding="async"></picture>
              <figcaption>Combined four-layer layout used to review routing, planes, interfaces, and the high-speed path together.</figcaption>
            </figure>
          </div>
          </section>

          <section class="latex-section" id="pcb-design-loop">
          <strong>Design Loop</strong><br><br>
          I used KiCad for schematic capture and the four-layer layout, LTspice to check switching and timing assumptions, and staged oscilloscope bring-up to compare those assumptions against the assembled hardware, with Python and LabVIEW handling trigger control, capture organization, and repeatable bench measurements.<br><br>
          Most of the layout effort went into a compact switching loop, a direct return plane for the fast path, separation between noisy control and relay routing and the measurement path, and grounded coaxial interfaces placed so cables connect without long flying leads. The viewer below shows the board render, combined layout, copper planes, silkscreen, and bottom routing.<br><br>

          </div>

          <section class="latex-section" id="pcb-build">
          <strong>Physical Implementation</strong><br><br>
          I assembled and reworked the PCB, integrated it into a custom enclosure, and wired the power, controls, and external connectors for bench use. The clear lid keeps the board inspectable during bring-up, and the BNC interfaces provide grounded, repeatable connections to the source-measure unit, DUT fixture, trigger, and oscilloscope.<br><br>
          <figure class="project-feature-figure">
            <picture><source srcset="/assets/pulse-v1-enclosure.webp" type="image/webp"><img src="/assets/pulse-v1-enclosure.jpeg" alt="Assembled V2 pulse-generator hardware inside its clear-topped enclosure" width="2706" height="3096" loading="lazy" decoding="async"></picture>
            <figcaption>Assembled V2 instrument before full bench characterization.</figcaption>
          </figure>
          <figure class="project-feature-figure">
            <picture><source srcset="/assets/ns-pulse-board-angle.webp" type="image/webp"><img src="/assets/ns-pulse-board-angle.png" alt="Angled 3D render of the pulse-generator PCB and enclosure" width="1656" height="984" loading="lazy" decoding="async"></picture>
            <figcaption>Mechanical and connector-access review before assembly.</figcaption>
          </figure>
          </section>

          <section class="latex-section" id="pcb-bringup">
          <strong>Bring-up</strong><br><br>
          I designed the board so power, controller logic, trigger conditioning, gate drive, switching, bias routing, and sync could each be brought up on their own in staged passes before any full-chain debugging.<br><br>
          On the scope, I compared the LTspice switching and timing assumptions against the assembled hardware one subsystem at a time, so any fault could be traced to the stage that introduced it.<br><br>
          <figure class="flow-path">
            <ol>
              <li><b>Power</b>Board supplies and local driver power.</li>
              <li><b>Controller</b>RP2040 logic and trigger commands.</li>
              <li><b>Trigger conditioning</b>The external trigger input.</li>
              <li><b>Gate drive</b>The high-speed gate driver.</li>
              <li><b>Switching</b>The GaN pulldown stage.</li>
              <li><b>Bias routing</b>Keithley HI/LO and the relay-selected paths.</li>
              <li><b>Sync</b>The dedicated scope-sync output.</li>
              <li><b>Full chain</b>Complete pulses into known dummy loads, captured at both DUT terminals.</li>
            </ol>
            <figcaption>Staged subsystem passes before full-chain debugging.</figcaption>
          </figure>
          </section>

          <section class="latex-section" id="pcb-testing">
          <strong>Testing + Key Design Lesson</strong><br><br>
          I characterized V2 with a Keithley source-measure unit, known dummy loads, and a Tektronix oscilloscope on both DUT terminals. The board demonstrated programmable operation through <b>30 V</b> from the microsecond range into the hundreds of nanoseconds, and in the current setup the shortest repeatable controller commands reached approximately the <b>100 ns scale</b>.<br><br>
          The key limitation appeared as pulses shortened. The GaN stage actively drives the first transition, but once it turns off, the output node returns passively through the DUT and the surrounding bias network:
          $$v_{\\mathrm{out}}(t)\\approx V_0\\,e^{-t/\\tau},\\qquad \\tau\\approx R_{\\mathrm{return}}\\left(C_{\\mathrm{DUT}}+C_{\\mathrm{fixture}}\\right)$$
          The delivered pulse width and return edge therefore depend on device and fixture capacitance.<br><br>
          That result was more useful than confirming the switch worked, since it exposed a system-level limit that layout optimization alone could not fix. The next revision therefore starts from active control of both pulse edges.<br><br>
          <figure class="project-feature-figure">
            <picture><source srcset="/assets/pulse-v1-bench.webp" type="image/webp"><img src="/assets/pulse-v1-bench.jpeg" alt="Pulse generator connected to Keithley and Tektronix instruments during bench characterization" width="4284" height="5712" loading="lazy" decoding="async"></picture>
            <figcaption>Bench characterization with source-measure biasing and oscilloscope capture at both DUT terminals.</figcaption>
          </figure>
          </section>

          <section class="latex-section" id="pcb-next">
          <strong>Next Revision</strong><br><br>
          The next revision is a clean-sheet high-speed pulser that replaces the relay-selected nanosecond/microsecond paths and the mechanical pulse-width controls with one optimized signal path, fully digital experiment control, and dedicated Keithley HI/LO and DUT interfaces.<br><br>
          The biggest electrical change is active control of <b>both output transitions</b>, which should reduce the effect of DUT capacitance on the delivered pulse width. The switching path will stay on the top layer directly above a continuous ground plane to minimize return-loop area and parasitic inductance.<br><br>
          The design goal is <b>30 V</b> operation with a <b>1 ns-class minimum pulse target</b>, single-shot and repetitive control, and a cleaner automated-experiment interface. The 1 ns-class figure is a next-revision target that V2 has not measured. Reaching it requires dedicated high-speed timing circuitry, so the RP2040 will not handle timing alone.<br><br>
          <table class="project-data-table">
            <thead><tr><th></th><th>V2</th><th>Next revision</th></tr></thead>
            <tbody>
              <tr><td>Signal path</td><td>Relay-selected nanosecond and microsecond paths</td><td>One optimized path</td></tr>
              <tr><td>Timing</td><td>RP2040 commands and mechanical pulse-width controls</td><td>Fully digital, with dedicated high-speed timing circuitry</td></tr>
              <tr><td>Pulse edges</td><td>GaN drives the first edge; passive return</td><td>Active control of both edges</td></tr>
              <tr><td>Shortest pulse</td><td>About 100 ns measured</td><td>1 ns-class target</td></tr>
              <tr><td>Interfaces</td><td>Grounded BNC with relay routing</td><td>Dedicated Keithley HI/LO, DUT, trigger, and sync</td></tr>
              <tr><td>Layout</td><td>Four-layer board</td><td>Switching path on the top layer over a continuous ground plane</td></tr>
            </tbody>
          </table>

          <details class="project-disclosure">
            <summary>Next Revision Architecture and Packaging</summary>

              I am also redesigning the enclosure package around connector access and a direct internal path, independent of the V2 control layout. These CAD views show the intended control-side access and the dedicated coaxial measurement interfaces.

                <figure><picture><source srcset="/assets/pulse-r2-cad-front.webp" type="image/webp"><img src="/assets/pulse-r2-cad-front.png" alt="Next-revision enclosure CAD showing front controls and the populated pulse-generator PCB" width="1251" height="916" loading="lazy" decoding="async"></picture><figcaption>Next-revision package from the control side.</figcaption></figure>
                <figure><picture><source srcset="/assets/pulse-r2-cad-rear.webp" type="image/webp"><img src="/assets/pulse-r2-cad-rear.png" alt="Next-revision enclosure CAD showing five coaxial interfaces and internal board layout" width="1276" height="865" loading="lazy" decoding="async"></picture><figcaption>Dedicated coaxial interfaces and a cleaner internal signal path.</figcaption></figure>
              </div>
            </div>
          </details>

          <details class="project-disclosure">
            <summary>Earlier Microsecond Prototype</summary>
            <div class="project-disclosure-content">
              V1 was the earlier microsecond-only pulse-generator prototype. I built it to make the source-measure workflow concrete, using a one-shot timing stage, gate driver, MOSFET output stage, manual/external triggering, and a Keithley interface. As the experiment moved toward cleaner, faster edges, bench work exposed the limits of terminal-block connections, loose wiring, and microsecond-oriented timing.<br><br>
              It is design history, separate from validation of the current board. I kept its schematic, layout, 3D render, and LTspice work here because they show the iteration that led to grounded coaxial interfaces, a four-layer PCB, digital control, and staged bring-up.
              <figure><picture><source srcset="/assets/pulse-v1-physical.webp" type="image/webp"><img src="/assets/pulse-v1-physical.jpg" alt="Earlier microsecond pulse-generator board under oscilloscope probe during bench testing" width="4032" height="3024" loading="lazy" decoding="async"></picture><figcaption>Earlier microsecond board during bench testing.</figcaption></figure>
              <div class="project-inline-grid">
                <figure><img src="/assets/pulse-v1-us-schematic.png" alt="Schematic for the earlier microsecond pulse-generator prototype" width="1444" height="787" loading="lazy" decoding="async"><figcaption>Prototype one-shot, driver, MOSFET, trigger, and source-measure circuitry.</figcaption></figure>
                <figure><img src="/assets/pulse-v1-us-layout.png" alt="PCB layout for the earlier microsecond pulse-generator prototype" width="1513" height="657" loading="lazy" decoding="async"><figcaption>Earlier two-layer PCB layout.</figcaption></figure>
                <figure><img src="/assets/pulse-v1-us-render.png" alt="3D render of the earlier microsecond pulse-generator prototype" width="1064" height="493" loading="lazy" decoding="async"><figcaption>Prototype board render before fabrication.</figcaption></figure>
                <figure><img src="/assets/pulse-v1-ltspice.png" alt="LTspice transient simulation for the earlier microsecond pulse-generator prototype" width="1913" height="1077" loading="lazy" decoding="async"><figcaption>Transient simulation used to check timing and output behavior before bench testing.</figcaption></figure>

          <section class="latex-section" id="pcb-current">
          <strong>Current Stage</strong><br><br>
          V2 is physically assembled and bench characterized. It validated digital triggering, gate drive, GaN switching, external bias integration, DUT routing, scope synchronization, and programmable operation through <b>30 V</b>, and it revealed the load-dependent recovery behavior that limits very short pulses.<br><br>
          I am now carrying those measurements into the next revision: active two-edge switching, fully digital timing, dedicated measurement interfaces, and a deliberate high-speed stackup. Current work is architecture selection and simulation before the next schematic and layout are finalized.
          </section>`,

        excerpt: 'Custom toolbox assembly taken from CAD to production-style drawings, GD&T callouts, laser/FDM fabrication planning, inspection, and prototype fit-up.',
        description: `<strong>Overview</strong><br><br>Designed and fabricated a custom toolbox prototype from production-style CAD drawings, applying ASME Y14.5-2018-style GD&T, datum selection, tolerance stackup thinking, and DFM principles to control lid, hinge, latch, handle, Gridfinity base, and fastener alignment through fabrication and assembly.<br><br>I treated the project as a compact mechanical manufacturing exercise: define design intent in CAD, break the assembly into fabricated parts, communicate the build through drawings, choose tolerances based on function, fabricate with available shop processes, then inspect and fit the prototype.<br><br><strong>Design Goals</strong><br><br>• Durable toolbox body with clean prototype fit-up.<br>• Lid, hinge, latch, handle, and side-wall alignment that survives fabrication error.<br>• Manufacturable geometry using accessible processes: CO2 laser-cut plywood panels, FDM printed inserts, drilled/fastened joints, and off-the-shelf hardware.<br>• Toleranced hole patterns and fastener interfaces for repeatable assembly.<br>• Drawings clear enough that someone else could understand the build sequence and critical interfaces.<br>• Minimize hand-fitting by thinking through datum strategy, hole positions, and tolerances before cutting parts.<br><br><strong>CAD + Drawing Package</strong><br><br>I modeled the toolbox as a full assembly, then split it into individual fabricated components: top walls, bottom walls, side panels, lid, hardware interfaces, and a Gridfinity-style base insert. The drawing package included assembly views, section views, part drawings, hole callouts, datum references, and notes for the intended manufacturing processes.<br><br><img src="/assets/toolbox-assembly-drawing.png" alt="Toolbox assembly drawing showing isometric, front, side, top, section, and bill of materials views" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Assembly drawing defining the lid, latch, hinge, handle, body, and Gridfinity insert interfaces before fabrication.</em><br><br>I applied GD&T principles based on ASME Y14.5-2018 as design controls, keeping the drawing tied to function and inspection. Functional datums were chosen around how the toolbox body would be assembled and inspected, with critical dimensions called out for lid fit, hinge alignment, latch engagement, handle placement, and repeated fastener patterns.<br><br><strong>GD&T / Tolerancing</strong><br><br>I treated the toolbox like a small mechanical assembly with repeatable interfaces. The body established the primary datums, and the hinge/latch interfaces were dimensioned from those references so the lid would close repeatably after fabrication. Hole patterns were controlled with positional tolerances where alignment mattered, while non-critical dimensions were left with looser general tolerances to keep the design manufacturable.<br><br><img src="/assets/toolbox-bottom-walls-drawing.png" alt="Bottom wall drawing with datum references and positional tolerance callouts for fastener holes" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Bottom wall drawing with datum references, critical dimensions, and positional tolerance callouts for functional hole patterns.</em><br><br>The main tolerance stackup ran through the body panels, lid panels, hinge locations, latch engagement, and fastener clearances. I used position tolerance where hole alignment mattered, and kept flatness, perpendicularity, and parallelism tied to actual assembly function while avoiding over-toleranced edges.<br><br><strong>Manufacturing / DFM</strong><br><br>The prototype was designed around available shop processes and real fabrication limits. The drawing package called out CO2 laser cutting for plywood panels and FDM 3D printing for the Gridfinity base, with sanding/deburring and mechanical fasteners used during assembly. That meant the CAD had to account for edge clearances, kerf/fit-up behavior, fastener access, hardware spacing, and how the parts would be held and aligned during assembly.<br><br><img src="/assets/toolbox-gridfinity-base-drawing.png" alt="Gridfinity base drawing with hole patterns, datum references, and flatness/perpendicularity callouts" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Gridfinity base drawing: an FDM-printed insert controlled with hole patterns, datum references, and fit-related tolerances.</em><br><br>Design decisions were driven by manufacturability: avoid impossible internal corners, leave realistic clearances around fasteners and moving hardware, plan the assembly sequence before cutting, and choose tolerances that matched the actual process capability of laser-cut plywood and printed parts.<br><br><strong>Inspection + Assembly</strong><br><br>After fabrication, I checked fit-up using calipers, fastener fit checks, squares, and physical assembly validation. The key inspections were hole alignment, lid closure, latch engagement, hinge alignment, and whether the Gridfinity base fit inside the body without forcing the assembly out of square.<br><br><img src="/assets/toolbox-prototype-closed.png" alt="Closed prototype toolbox fabricated from laser-cut plywood panels with hinges, latch, handle, and fasteners" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Prototype fit-up after fabrication with the lid, latches, hinges, handle, and fastener interfaces assembled.</em><br><br><img src="/assets/toolbox-prototype-open.png" alt="Open prototype toolbox showing interior storage and fit-up of the fabricated body and lid" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Open prototype showing the internal fit-up and hardware alignment. I do not have photos of the final version, so these prototype photos show the fabrication/assembly validation stage.</em><br><br>The prototype revealed the normal gap between drawing intent and shop reality: fasteners need access, laser-cut edges need finishing, hole patterns need enough clearance to tolerate small shifts, and datums only help if they match how the part is actually assembled and inspected.<br><br><strong>What I Learned</strong><br><br>Drawings are design tools, not paperwork. GD&T only matters when tied to function, and over-tolerancing makes a part harder to build without improving the assembly. Datum selection should match how the part is actually assembled and checked. Even a small toolbox exposes real tolerance stackup problems quickly, especially when hinges, latches, handles, printed inserts, and repeated fastener patterns all have to line up at once.<br><br><strong>Technical Work</strong><br><br>• Modeled the full toolbox assembly and generated part/assembly drawings for fabrication.<br>• Applied GD&T principles using ASME Y14.5-2018-style conventions for datums, hole patterns, and critical interfaces.<br>• Designed for manufacturability with realistic shop tolerances, fastener clearances, hardware spacing, and laser/FDM process constraints.<br>• Planned fabrication and assembly sequence to reduce hand-fitting and improve alignment.<br>• Inspected prototype parts with calipers, fastener fit checks, squareness checks, and physical assembly validation.`,

        excerpt: 'Interactive tool for evaluating nuclear reactor site feasibility + research paper.',
        description: `<strong>The Research</strong><br><br>My AP Research capstone, turned interactive tool. Rural America pays ~25% more for electricity than urban areas and relies on aging infrastructure. I investigated whether hybrid Small Modular Reactor + solar systems could address this inequity. Solar costs dropped 89% since 2010 but cannot generate at night; SMRs provide 24/7 low-carbon baseload. Together they balance each other out. Almost all existing SMR research focuses on urban implementation, which left a clear gap for rural applications.<br><br><strong>The Tool</strong><br><br>Atlas SMR is an interactive web platform pulling data from the NRC, EIA, and USGS seismic databases. It displays 89 operating reactors, 13 shutdown facilities, and 119 candidate sites scored by a weighted algorithm. The scoring model weighs population inside the NRC emergency planning zone, seismic-fault proximity, cooling-water access, and grid interconnection capacity. Users can change the weights and immediately compare candidate rankings under different assumptions.<br><br><strong>Scenario Builder</strong><br><br>Users configure 50-300 MWe per module, 1-12 modules per site, and deployment year. For hybrid systems, the tool compares SMR baseload against solar capacity factor and curtailment assumptions. In solar-rich regions like Navajo Nation, larger solar arrays reduce SMR daytime load. In cloudier areas like Nome, Alaska, the system leans on SMR output. My analysis showed a properly configured hybrid could meet ~24% of rural energy needs, with clear scalability beyond that.<br><br><strong>Limitations</strong><br><br>SMR cost estimates still lack large-scale U.S. operational data. Nuclear stigma is real. This tool is a prototype visualization, not a policy instrument -- actual site selection requires Environmental Impact Statements and full NRC licensing far beyond what a scoring algorithm captures.`,

        excerpt: 'YC x DeepMind hackathon winner. Real-time generative music for the visually impaired.',
        description: `<strong>YC x DeepMind Hackathon Winner</strong><br><br>Built at the YC x Google DeepMind hackathon in San Francisco. Leitmotif generates adaptive, real-time background music for visually impaired users. A webcam watches the scene, and every person who enters gets assigned a unique musical motif -- a short melodic signature that weaves into an evolving soundtrack reflecting the room's mood. When someone leaves, their motif plays back inverted as a farewell cue. The whole system is designed to give spatial awareness through sound alone, no screen needed.<br><br><strong>The Pipeline</strong><br><br>Everything runs in a continuous loop. A webcam frame gets captured and base64-encoded, then sent to Gemini 2.5 Flash for vision analysis: who is visible, what the room feels like, and what changed since the last frame. That scene data goes to the Music Engine, which pulls each person's stored motif from Supabase/PostgreSQL. A prompt builder turns the scene state into a Lyria-compatible music prompt, Gemini refines the tempo/key/instrumentation choices, and the Google Lyria RealTime API streams PCM audio directly to speakers.<br><br>Crossfading between emotional states uses a 4-6 second blend window. Without smooth transitions, mood shifts sounded jarring -- like someone changing the radio station mid-song. The crossfade duration is a tradeoff: too short and the transitions feel abrupt, too long and the system feels unresponsive to actual scene changes.<br><br><strong>The Motif System</strong><br><br>Each person's musical signature is stored as structured JSON: note count, interval patterns, rhythm sequences, melodic contours, and character descriptors. On entry, the motif plays once as a bright solo phrase over a ducked background. On exit, the motif plays descending and inverted. That gives users a learnable association between people and sounds, with a clearer cue than a generic notification beep.<br><br>Motif management enforces musical rules in code. If two people enter within a short window, the system queues motifs because simultaneous melodic lines become indistinguishable. The prompt builder also keeps motifs compatible with the current background key and mood so the accessibility cue stays clear.<br><br><strong>Architecture</strong><br><br>Two servers. The Music Engine (port 3001) handles real-time scene orchestration, adaptive prompt generation, entry/exit transitions, and crossfading. The Camera Server (port 3002) runs Gemini vision analysis on webcam frames and auto-forwards results. We split them because vision analysis and music generation have very different latency profiles, and decoupling lets each run at its own pace without blocking the other.<br><br>Backend is Node.js with TypeScript, native HTTP server, Gemini 2.5 Flash for vision + orchestration, Lyria RealTime for generative music, Supabase for persistence. The React Native companion app has Monitor, Contacts, Visualizer, and Settings screens for real-time entity tracking and motif management. The web mockup was built with React, Vite, and Tailwind so we could demo the interaction quickly during the hackathon.`,

        excerpt: 'Hardware Lead for FTC #13216. Designed robot with 500+ custom parts.',
        description: `<strong>The Robot</strong><br><br>INTO THE DEEP (2024-25 FTC game): collect samples from a submersible, score them in baskets and specimen chambers, and hang from a bar for endgame points. As Hardware Lead for Team Deja Vu #13216, I owned the mechanical design, CAD management, and manufacturing coordination. The robot CAD model has over 500 unique parts across mecanum drivetrain, active intake, transfer pathway, arm/lift, end effector, and hang mechanism.<br><br><strong>The Intake</strong><br><br>Our most iterated subsystem, four revisions total. V1 (passive funnel with compliant wheels) was too slow. V2 (active roller with surgical tubing) had inconsistent grip. V3 (dual-stage roller with speed differential) jammed at odd angles. V4 landed on a single high-speed roller with optimized geometry, and that became our competition design. Each version taught us something about the trade-offs between speed, reliability, and complexity with these specific game pieces.<br><br><strong>Manufacturing and FEA</strong><br><br>We used Markforged printers for structural nylon, Prusa for prototypes, laser-cut polycarbonate and Delrin plates, CNC-machined aluminum for high-stress parts, and standard manual tools for modifications. For the arm pivot and hang brackets, I ran FEA in SolidWorks, checking stress vs. yield (safety factor > 2.0) and deflection under load to ensure nothing interfered with mechanism travel.<br><br><strong>Software</strong><br><br>I also wrote the TeleOp code in Java: mecanum drive with field-centric control using IMU heading, arm and lift position control with encoder-based PID loops, intake/transfer sequencing, and driver feedback through gamepad rumble. Writing both the hardware and driver code let me optimize how the mechanisms actually feel to operate, which fed directly back into design decisions.<br><br>The reliability-focused approach paid off: minimal mechanical failures during matches, and we advanced through qualifications into elimination rounds.<br><br><em style="opacity: 0.7; font-size: 0.9em;">Note: Team Deja Vu #13216 has since become a legacy team, with a new group of students carrying the name forward.</em>`,

        excerpt: 'Hardware Lead for FTC #13216. Designed pixel-scoring mechanisms.',
        description: `<strong>The Game</strong><br><br>CENTERSTAGE (2023-24 FTC): robots collected hexagonal "pixels" and placed them on a vertical backdrop to create mosaic patterns, with bonus points for specific arrangements and launching paper airplane drones during endgame. I joined Deja Vu #13216 as Hardware Lead after Zenith dissolved when its founder graduated.<br><br><strong>The Claw</strong><br><br>The hardest mechanism to get right. Hexagonal pixels interlock in weird ways, and the claw had to grip them reliably without blocking the vision system. The final design used compliant TPU fingers that conform to pixel geometry, spring-loaded hinges for passive grip, and servo-actuated release. Dual-pixel capacity was critical -- grabbing two per trip to the backdrop doubled our scoring potential.<br><br><strong>Vision and Software</strong><br><br>The robot used AprilTags on the backdrop for autonomous alignment and a camera for detecting pixel positions. I wrote the TeleOp code in Java: mecanum drive with configurable speed curves, arm position presets for different backdrop heights, claw control with pixel detection feedback, drone launcher arming sequence, and intake/transfer coordination. Writing both hardware and driver code meant I could tune the controls specifically for our drivers' preferences.<br><br><strong>Results</strong><br><br>We qualified for the NorCal regional championship with minimal mechanical failures during matches. The reliability-first philosophy I brought from Zenith paid off here.<br><br><em style="opacity: 0.7; font-size: 0.9em;">Note: Team Deja Vu #13216 has since become a legacy team, with a new group of students carrying the name forward.</em>`,

        excerpt: 'Team Lead for FTC #20424. Built cone-stacking robot with custom lift.',
        description: `<strong>The Lift</strong><br><br>POWERPLAY (2022-23 FTC): stack cones on junctions of varying heights. My second year in FTC, first as Team Lead for Zenith #20424. The core mechanism was a linear lift needing 30+ inches of travel, full extension under 1.5 seconds, and enough stiffness to place cones without the whole robot feeling delayed.<br><br>We used continuous rigging with dyneema string and a high-RPM motor. The design work centered on iterating the actual spool diameter, gear ratio, string path, carriage weight, and acceleration until the lift was fast without stalling. Onshape was where I worked through the packaging and travel, then the robot itself became the test: if the lift could not hit junction height repeatably under driver timing, the ratio was wrong no matter how good it sounded.<br><br><strong>Cone Manipulation</strong><br><br>The claw went through three versions. V1 was a simple pinch claw and dropped cones during fast lift moves. V2 added spring-loaded compliance but still cared too much about cone orientation. The breakthrough was V3: internal centering guides that funnel the cone into position before gripping. The claw needed to actively center the cone before gripping.<br><br><strong>Software</strong><br><br>I wrote both TeleOp and autonomous in Java using the FTC SDK. TeleOp had mecanum kinematics, lift PID control, and speed scaling modes. Autonomous used OpenCV color thresholding for signal sleeve detection, dead-wheel odometry, and IMU heading correction to fight encoder drift over the 30-second period.<br><br><strong>ZenLender</strong><br><br>I noticed teams scrambling for parts before competitions with $50+ overnight shipping on $15 parts. I built ZenLender, a basic spreadsheet system for lending parts between teams. Primitive, but the concept eventually evolved into Inventry. During one match, our lift string snapped mid-cycle because we had not inspected it for wear. Preventive maintenance matters as much as good design.<br><br><em style="opacity: 0.7; font-size: 0.9em;">Note: Team Zenith #20424 has since dissolved.</em>`,

        active: false,
        featured: false,
        excerpt: 'AI-powered robotics parts inventory and marketplace.',
        description: `<strong>The Problem</strong><br><br>If you have been on an FTC team, you know the panic: a motor burns out two nights before competition, and overnight shipping on a $15 part is $150+. My team scrambled through group chats and outdated spreadsheets to find nearby teams with spares. I first built ZenLender on Zenith -- a basic spreadsheet lending system -- but manual data entry killed adoption. Inventry is the real version.<br><br><strong>What It Does</strong><br><br>Three components: inventory management (track parts, quantities, conditions), a part lending network (find nearby teams with what you need), and a marketplace (in development). The stack is React/TypeScript with Tailwind on the frontend, Node.js/Express/PostgreSQL on the backend, OAuth 2.0 with team verification through FIRST's public data, hosted on Vercel and Railway.<br><br><strong>AI Invoice Parsing</strong><br><br>The biggest friction with inventory tools is data entry. Nobody wants to type in 200 parts from a GoBilda order. Users upload invoice PDFs or photos and the system extracts part numbers, quantities, prices, and dates using Tesseract OCR + GPT-4 for structured parsing. Accuracy is ~94% on clean invoices, ~85% on photographed receipts. I also built weekly scrapers for GoBilda, REV, ServoCity, and AndyMark -- 3,000+ unique SKUs feeding the search system with current pricing and availability.<br><br><strong>The Lending System</strong><br><br>The hard part: getting teams to lend parts to strangers. The solution is a reputation system where lender points unlock priority borrowing access, distance matching prioritizes teams within driving range (default 30 miles), and requests get flagged as urgent if a competition is within 7 days. Privacy was non-negotiable -- exact addresses are never shown, communication stays on-platform, and all data is encrypted and GDPR-deletable.<br><br>FTC teams already spend too much money. If this saves one team from paying $200 in emergency shipping, it is worth more than whatever I could charge.`,

        excerpt: 'Platform connecting 2000+ students with volunteer opportunities.',
        description: `<strong>The Problem</strong><br><br>Finding volunteer opportunities as a high school student was frustrating -- word of mouth, missed deadlines, full events. Organizers coordinating through email chains and Google Forms had no way to verify students or track participation. Pear connected both sides: 2000+ registered student volunteers, 20+ event organizers (nonprofits, school clubs, community orgs), and school administrators who needed verified hour logs.<br><br><strong>How It Works</strong><br><br>Three user types: students browse and sign up for events, organizers create listings and manage volunteers, administrators verify hours for school records. Built on Wix with custom Velo code for business logic and webhook integrations. When a student signs up, the system validates their student ID, checks for schedule conflicts, notifies the organizer, and updates capacity. For high-volume events (some filled 50+ spots in under an hour), I built an async webhook queue:<br><br><code>Event Signup → Wix Backend → Webhook Queue → Email Service → Database Update</code><br><br>This prevents timeouts during traffic spikes and handles ~10 requests per second.<br><br><strong>Hour Tracking</strong><br><br>The biggest pain point for students was proving volunteer hours for college applications. Organizers check in volunteers via QR code scan, hours auto-log with event details, and students can request official verification letters auto-generated as PDFs with school letterhead. This saved counselors significant paperwork. All communication flows through Pear -- student contact info is never shown to organizers, data is encrypted, and parents can request deletion at any time.<br><br>I handed off Pear when I left for college in 2025.`,

        excerpt: 'Low-cost probe alternative to save $118M in city spending.',
        description: `<strong>The Problem</strong><br><br>Palo Alto projected $118 million over the next decade on construction acclimation probes -- devices that track temperature and humidity during concrete curing. These commercial units cost $500-2,000 each, and regulations require multiple per site. That seemed absurd for what is essentially temperature and humidity logging. Concrete curing still needs continuous documentation, though, because temperature history affects strength gain and inspectors need recorded evidence.<br><br><strong>The Prototype</strong><br><br>I built a $47 probe: Arduino Nano, DHT22 (±0.5°C temp, ±2-5% humidity), DS18B20 for redundancy, MicroSD logging every 5 minutes, RTC for accurate timestamps, and a 3.7V LiPo battery. The PETG enclosure used two 30 mm fans for airflow so the sensor could sample moving air inside the enclosure. I tested it alongside a calibrated Humboldt H-4210 ($1,200 commercial unit) for 14 days: temperature deviation ±0.8°C, humidity ±3.2%, 4,028 of 4,032 readings captured (99.7% reliability).<br><br><code>Arduino Nano clone............$8<br>DHT22 sensor...................$6<br>DS18B20 sensor.................$4<br>MicroSD module.................$5<br>RTC module.....................$3<br>LiPo battery...................$12<br>3D printed enclosure...........$5<br>Fans and misc wiring...........$4<br>---------------------------------<br>Total: $47</code><br><br><strong>Dashboard and Presentation</strong><br><br>I built a client-side web dashboard with vanilla JS and Chart.js for uploading SD card CSVs, graphing curing conditions over time, flagging out-of-range periods, and generating PDF reports for inspectors. In April 2023, I presented to City of Palo Alto construction officials. They were interested in the cost savings but raised valid concerns about calibration certification, liability, and durability. One official mentioned they would consider a pilot if the probe could be formally certified.<br><br>This was a proof of concept -- no wireless transmission, no weatherproofing, 10-day battery life. But an 85-96% cost reduction over commercial alternatives suggests the approach has legs.`,
