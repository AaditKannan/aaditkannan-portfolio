  <style>
    @view-transition { navigation: auto; }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 320ms;
      animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ::selection { background: rgba(200, 180, 155, 0.4); color: #fff; }
    [data-theme="light"] ::selection { background: rgba(170, 150, 120, 0.35); color: #1a202c; }

    :root {
      --bg: #0a0a0a;
      --text: #fff;
      --text-dim: #888;
      --text-muted: #555;
      --border: rgba(255,255,255,0.08);
      --border-light: rgba(255,255,255,0.15);
      --nav-bg: rgba(10, 10, 10, 0.95);
      --nav-link: rgba(255, 255, 255, 0.7);
      --nav-link-hover: #FFFFFF;
      --nav-border-hover: rgba(255, 255, 255, 0.5);
      --glow-center: rgba(255, 255, 255, 0.04);
      --glow-mid: rgba(255, 255, 255, 0.015);
      --card-bg: rgba(10,10,10,0.92);
    }

    [data-theme="light"] {
      --bg: #f5f2ee;
      --text: #0f172a;
      --text-dim: #4a5568;
      --text-muted: #64748b;
      --border: rgba(0,0,0,0.1);
      --border-light: rgba(0,0,0,0.22);
      --nav-bg: rgba(245, 242, 238, 0.95);
      --nav-link: rgba(0, 0, 0, 0.65);
      --nav-link-hover: #0f172a;
      --nav-border-hover: rgba(0, 0, 0, 0.4);
      --glow-center: rgba(0, 0, 0, 0.06);
      --glow-mid: rgba(0, 0, 0, 0.025);
      --card-bg: rgba(245,242,238,0.92);
    }

    /* Smooth theme transition */
    html.theme-transition,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, fill 0.35s ease, box-shadow 0.35s ease !important;
    }

    html {
      scroll-behavior: smooth;
      overflow-y: scroll;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar { display: none; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.6;
      overflow-y: scroll;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    body::-webkit-scrollbar { display: none; }

    /* Theme Toggle */
    .theme-toggle {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1002;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.25s ease;
    }

    .theme-toggle:hover { color: var(--text); }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }

    [data-theme="light"] .theme-toggle .icon-sun { display: block; }
    [data-theme="light"] .theme-toggle .icon-moon { display: none; }

    /* Cursor Glow */
    .cursor-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      background: radial-gradient(circle, var(--glow-center) 0%, var(--glow-mid) 40%, transparent 70%);
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease;
      opacity: 0;
    }
    .cursor-glow.visible { opacity: 1; }

    @media (max-width: 768px) {
      .cursor-glow { display: none; }
      body { background-attachment: scroll; }
    }

    /* Nav */
    .nav-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1001;
      padding: 24px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      background: transparent;
      height: 80px;
      box-sizing: border-box;
    }

    .nav-link {
      color: var(--nav-link);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      border-bottom: 1px solid transparent;
      padding: 8px 0;
      transition: all 0.3s ease;
      line-height: 1;
    }

    .nav-link:hover {
      color: var(--nav-link-hover);
      border-bottom-color: var(--nav-border-hover);
    }
    .nav-link.active { color: var(--nav-link-hover); border-bottom-color: var(--nav-link-hover); }

    /* Main content */
    main {

      margin: 0 auto;
      padding: 140px 40px 100px 40px;

    }

    .page-header {
      margin-bottom: 32px;
      position: relative;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .filter-row {
      display: flex;
      justify-content: flex-start;
      gap: 32px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .filter-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-right: 8px;
    }

    .filter-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--border-light);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--card-bg);
      border-color: var(--border-light);
      color: var(--text);
    }

    .filter-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 8px;
    }

        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      }

      .filter-bar {
        display: none;

      .filter-divider {

      .filter-btn {

    .page-title {

      letter-spacing: -0.02em;

    /* Project grid - always 3 columns */
    .projects-grid {

    .projects-grid.view-transitioning .project-card {

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0;
      cursor: pointer;
      overflow: hidden;

      opacity: 1;
      transform: scale(1);
      grid-column: span 1;

    .project-card:hover {
      border-color: var(--border-light);
      background: rgba(10,10,10,0.95);
      box-shadow: 0 4px 24px rgba(255,255,255,0.06);

    [data-theme="light"] .project-card:hover {

      box-shadow: 0 4px 20px rgba(0,0,0,0.08);

    .project-image {

    .project-preview-link {
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .project-preview-link:hover {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    .project-hover-preview {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      width: 220px;
      height: 140px;
      border-radius: 8px;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      background: #000;
    }

    .project-hover-preview.visible {
      opacity: 1;
      transform: scale(1);
    }

    .project-hover-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    [data-theme="light"] .project-hover-preview {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .project-image-placeholder {
      color: var(--text-muted);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .project-content {
      padding: 24px;
    }

      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .project-date {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .project-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .project-excerpt {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .project-card.featured .project-title {
      font-size: 20px;
    }

    /* Status dot */
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ========== DETAIL VIEW ========== */
    
    /* When detail view is active */
    body.detail-active {
      overflow: hidden;
    }

    body.detail-active,
    body.detail-active html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    body.detail-active::-webkit-scrollbar,
    body.detail-active html::-webkit-scrollbar {
      display: none;
    }

    body.detail-active .projects-grid {
      pointer-events: none;
    }

    /* Hide other cards when detail view is active */
    body.detail-active .project-card:not(.active-card) {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    /* The active card transforms */
    .project-card.active-card {
      position: relative;
      z-index: 100;
      grid-column: span 2 !important;
      border-color: var(--border-light);
    }

    .project-card.active-card .project-image {
      aspect-ratio: 2/1;
    }

    .project-card.active-card .project-content {
      display: none;
    }

    /* Detail content - same layout as main page */
    .detail-content {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      color: var(--text);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .detail-content::-webkit-scrollbar {
      display: none;
    }

    .detail-content.visible {
      opacity: 1;
      visibility: visible;
    }

    .detail-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 140px 40px 100px;
      min-width: 0;
    }

    .detail-header {
      margin-bottom: 48px;
    }

    .detail-category {
      display: none;
    }

    /* Match the project index heading so title transitions happen in place */
    .detail-title {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(42px, 7vw, 56px);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0 0 12px 0;
    }

    .detail-date {
      font-size: 14px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease 0.15s;
    }

    .detail-content.visible .detail-date {
      opacity: 1;
      transform: translateY(0);
    }

    .detail-content[data-project-id="ns-us-pulse-generator"] .detail-title {
      font-size: clamp(34px, 5.4vw, 46px);
      max-width: 980px;
    }

    /* Top row: gallery + sidebar side by side */
    .detail-top-row {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 40px;
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    }

    .detail-content.visible .detail-top-row {
      opacity: 1;
      transform: translateY(0);
    }

    /* Gallery */
    .detail-gallery {
      width: 100%;
      min-width: 0;
    }

    .gallery-main {
      width: 100%;
      aspect-ratio: 4/3;
      background: #000;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
    }

    #galleryMediaContainer {
      width: 100%;
      height: 100%;
      min-width: 0;
    }

    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
      opacity: 0;
    }

    .gallery-main:hover .gallery-nav {
      opacity: 1;
    }

    .gallery-nav:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.5);
    }

    .gallery-nav-prev { left: 12px; }
    .gallery-nav-next { right: 12px; }

    .gallery-nav svg {
      width: 18px;
      height: 18px;
      stroke: rgba(255,255,255,0.8);
      stroke-width: 2;
      fill: none;
    }

    .gallery-nav:hover svg { stroke: #fff; }

    .gallery-main img,
    .gallery-main picture,
    #galleryMediaContainer img,
    #galleryMediaContainer picture,
    #galleryMediaContainer video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #000;
    }

    .gallery-main-placeholder {
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .gallery-thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
    }

    .gallery-thumb {
      width: 70px;
      height: 44px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.03);
      border: 2px solid transparent;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s;
      opacity: 0.5;
    }

    .gallery-thumb:hover {
      opacity: 0.8;
    }
    .gallery-thumb.active { border-color: #fff; opacity: 1; }

    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Detail body - full width description below */
    .detail-body {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
    }

    .detail-content.visible .detail-body {
      opacity: 1;
      transform: translateY(0);
    }

    /* Interactive 3D viewer */
    .detail-model {
      margin-top: 8px;
      margin-bottom: 28px;
    }

    .detail-model-heading {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0 0 14px;
    }

    /* Click-to-load poster */
    .model-poster {
      display: block;
      width: 100%;
      height: 520px;
      padding: 0;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background-color: #0d0d0f;
      background-size: cover;
      background-position: center;
    }

    [data-theme="light"] .model-poster {
      border-color: rgba(0,0,0,0.1);
      background-color: #f0f0f2;
    }

    .model-poster::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.15), rgba(0,0,0,0.55));
      transition: background 0.3s ease;
    }

    .model-poster:hover::after {
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.05), rgba(0,0,0,0.4));
    }

    .model-poster-cta {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(20,20,22,0.72);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      backdrop-filter: blur(6px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .model-poster:hover .model-poster-cta {
      transform: translate(-50%, -50%) scale(1.04);
      background: rgba(20,20,22,0.88);
    }

    .model-poster-cta svg { fill: currentColor; }

    .model-progress {
      background: rgba(255,255,255,0.85);
      height: 3px;
      border-radius: 2px;
    }

    @media (max-width: 768px) {
      .model-poster { height: 340px; }
    }

    .detail-model model-viewer {
      width: 100%;
      height: 520px;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,0.06), rgba(0,0,0,0) 70%), #0d0d0f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      --poster-color: transparent;
    }

    [data-theme="light"] .detail-model model-viewer {
      background: radial-gradient(circle at 50% 35%, rgba(0,0,0,0.04), rgba(0,0,0,0) 70%), #f0f0f2;
      border-color: rgba(0,0,0,0.1);
    }

    .detail-model-frame {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 62%;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
      background: #0d0d0f;
    }

    [data-theme="light"] .detail-model-frame {
      border-color: rgba(0,0,0,0.1);
      background: #f0f0f2;
    }

    .detail-model-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .detail-model-hint {
      display: block;
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-dim);
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .detail-model model-viewer { height: 340px; }
      .detail-model-frame { padding-bottom: 75%; }
    }

    .detail-description {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
      margin-bottom: 32px;
      columns: 2;
      column-gap: 40px;
      opacity: 0.85;
    }

    .detail-description code {
      display: block;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px;
      margin: 12px 0;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 14px;
      color: #7dd3fc;
      border-radius: 4px;
      overflow-x: auto;
    }

    [data-theme="light"] .detail-description code {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.1);
      color: #0369a1;
    }

    /* KaTeX display math blocks */
    .detail-description .katex-display {
      margin: 12px 0;
      padding: 14px 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .detail-description .katex {
      font-size: 1.05em;
    }

    [data-theme="light"] .detail-description .katex {
      color: #1a202c;
    }

    .detail-description strong {
      color: var(--text);
      font-weight: 600;
      display: block;
      margin-top: 14px;
      margin-bottom: 2px;
      break-after: avoid;
      -webkit-column-break-after: avoid;
    }

    .detail-description strong:first-child {
      margin-top: 0;
    }

    .board-layer-viewer {
      column-span: all;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      margin: 24px 0 30px;
      padding: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.025);
    }

    [data-theme="light"] .board-layer-viewer {
      background: rgba(0,0,0,0.025);
    }

    .board-layer-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .board-layer-viewer input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .board-layer-controls label {
      padding: 7px 11px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .board-layer-controls label:hover {
      border-color: var(--border-light);
      color: var(--text);
    }

    .board-layer-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 11;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #101116;
    }

    .board-layer-stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100% !important;
      max-width: none !important;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .board-layer-caption {
      display: block;
      margin-top: 10px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }

    #ns-layer-render:checked ~ .board-layer-controls label[for="ns-layer-render"],
    #ns-layer-layout:checked ~ .board-layer-controls label[for="ns-layer-layout"],
    #ns-layer-top:checked ~ .board-layer-controls label[for="ns-layer-top"],
    #ns-layer-copper:checked ~ .board-layer-controls label[for="ns-layer-copper"],
    #ns-layer-silk:checked ~ .board-layer-controls label[for="ns-layer-silk"],
    #ns-layer-bottom:checked ~ .board-layer-controls label[for="ns-layer-bottom"] {
      border-color: var(--border-light);
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }

    #ns-layer-render:checked ~ .board-layer-stage .layer-render,
    #ns-layer-layout:checked ~ .board-layer-stage .layer-layout,
    #ns-layer-top:checked ~ .board-layer-stage .layer-top,
    #ns-layer-copper:checked ~ .board-layer-stage .layer-copper,
    #ns-layer-silk:checked ~ .board-layer-stage .layer-silk,
    #ns-layer-bottom:checked ~ .board-layer-stage .layer-bottom {
      opacity: 1;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .detail-tag {
      padding: 8px 16px;
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
    }

    .detail-tag:hover {
      border-color: var(--border-light);
      color: #fff;
    }

    .detail-sidebar h3 {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 16px;
    }

    .detail-sidebar {
      min-width: 0;
    }

    .detail-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 40px;
    }

    .detail-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .detail-link:hover {
      border-color: var(--border-light);
      color: #fff;
      background: rgba(255,255,255,0.02);
    }

    .detail-link svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex: 0 0 16px;
    }

    .detail-link.unavailable-link {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .detail-link.unavailable-link:hover {
      border-color: #ff4444;
      color: #ff4444;
      background: rgba(255, 68, 68, 0.1);
    }

    .detail-link.unavailable-link:hover svg {
      fill: #ff4444;
    }

    /* Navigation - removed left/right buttons */
    .detail-nav {
      display: none;
    }

    /* Close button */
    .detail-close {
      position: fixed;
      top: 120px;
      right: 40px;
      width: 50px;
      height: 50px;
      background: rgba(0,0,0,0.8);
      border: 1px solid var(--border);
      cursor: pointer;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0;
      transform: scale(0.8);
    }

    [data-theme="light"] .detail-close {
      background: rgba(255,255,255,0.9);
      border-color: rgba(0,0,0,0.15);
    }

    [data-theme="light"] .detail-close::before,
    [data-theme="light"] .detail-close::after {
      background: #111;
    }

    [data-theme="light"] .detail-close:hover {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.25);
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    [data-theme="light"] .gallery-nav {
      background: rgba(255,255,255,0.8);
      border-color: rgba(0,0,0,0.15);
    }

    [data-theme="light"] .gallery-nav svg {
      stroke: rgba(0,0,0,0.7);
    }

    [data-theme="light"] .gallery-nav:hover {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.3);
    }

    [data-theme="light"] .gallery-nav:hover svg {
      stroke: #111;
    }

    [data-theme="light"] .detail-link:hover {
      border-color: rgba(0,0,0,0.25);
      color: #111;
      background: rgba(0,0,0,0.03);
    }

    [data-theme="light"] .detail-tag:hover {
      border-color: rgba(0,0,0,0.25);
      color: #111;
    }

    [data-theme="light"] .detail-fab {
      background: rgba(255,255,255,0.9);
      border-color: rgba(0,0,0,0.15);
      color: #111;
    }

    [data-theme="light"] .detail-fab svg {
      fill: #111;
    }

    [data-theme="light"] .detail-fab:hover {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.25);
    }

    [data-theme="light"] .esc-hint {
      color: rgba(0,0,0,0.4);
    }

    [data-theme="light"] .gallery-main {
      background: #f0ede9;
    }

    [data-theme="light"] .gallery-main img {
      background: #f0ede9;
    }

    .detail-content.visible .detail-close {
      opacity: 1;
      transform: scale(1);
    }

    .detail-close:hover {
      background: rgba(255,255,255,0.1);
      border-color: var(--border-light);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,255,255,0.2), 0 0 40px rgba(255,255,255,0.1);
    }

    .detail-close::before,
    .detail-close::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 2px;
      background: #fff;
      transition: all 0.2s;
    }
    .detail-close::before { transform: rotate(45deg); }
    .detail-close::after { transform: rotate(-45deg); }

    /* ESC hint animation */
    .esc-hint {
      position: fixed;
      top: 132px;
      right: 100px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
      opacity: 0;
      transform: translateX(20px);
      pointer-events: none;
    }

    .detail-content.visible .esc-hint {
      animation: escHintCycle 3s ease-out forwards;
      animation-delay: 0.5s;
    }

    @keyframes escHintCycle {
      0% {
        opacity: 0;
        transform: translateX(20px);
      }
      15% {
        opacity: 1;
        transform: translateX(0);
      }
      70% {
        opacity: 1;
        transform: translateX(0);
      }
      100% {
        opacity: 0;
        transform: translateX(-10px);
      }
    }

    /* Back to top button - styled like close button */
    .detail-fab-container {
      position: fixed;
      bottom: 40px;
      right: 40px;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .detail-fab-container.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #fabReturnProjects {
      display: none;
    }

    .detail-fab {
      width: 50px;
      height: 50px;
      background: rgba(0,0,0,0.8);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      padding: 0;
      color: #fff;
    }

    .detail-fab:hover {
      background: rgba(255,255,255,0.1);
      border-color: var(--border-light);
      transform: scale(1.05);
    }

    .detail-fab svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    .detail-fab .fab-text {
      display: none;
    }

    @media (max-width: 768px) {
      .detail-fab-container {
        bottom: 24px;
        right: 24px;
      }

      .detail-fab {
        width: 44px;
        height: 44px;
      }
    }

    /* Detail close mirrors the entry fade without the title feeling detached */
    .detail-content.closing {
      animation: detailCloseFade 0.28s cubic-bezier(0.55, 0, 1, 0.45) forwards;
    }

    @keyframes detailCloseFade {
      0% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform: scale(0.985);
        filter: blur(2px);
      }
    }

    /* Responsive */
    @media (max-width: 900px) {
      .projects-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .detail-top-row {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .detail-description {
        columns: 1;
      }
    }

    @media (max-width: 600px) {
      .projects-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .project-card {
        border-radius: 0;
      }

      .project-card:hover {
        box-shadow: none;
      }

      .project-image {
        aspect-ratio: 16/8;
      }

      .project-content {
        padding: 12px 16px;
      }

      .project-meta {
        margin-bottom: 2px;
      }

      .project-category { font-size: 9px; }
      .project-date { font-size: 10px; }
      .project-title { font-size: 15px; margin-bottom: 2px; }
      .project-excerpt {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 12px;
        line-height: 1.4;
      }
    }

    @media (max-width: 768px) {
      /* Standardized mobile nav */
      .nav-bar {
        position: absolute;
        padding: 16px 16px;
        gap: 24px;
        justify-content: center;
        height: auto;
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      .nav-link {
        font-size: 11px;
        padding: 6px 0;
        letter-spacing: 0.1em;
      }

      .theme-toggle {
        position: fixed;
        bottom: 20px;
        right: 20px;
        top: auto;
        transform: none;
        z-index: 1002;
        opacity: 1;
        transition: opacity 0.3s ease;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        width: 36px;
        height: 36px;
      }
      [data-theme="light"] .theme-toggle {
        background: rgba(0, 0, 0, 0.08);
      }
      .theme-toggle svg { width: 14px; height: 14px; }

      main { padding: 120px 24px 80px; }
      .detail-inner { padding: 120px 24px 80px; }

      .page-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
        font-size: clamp(32px, 8vw, 42px);
      }

      .detail-title {
        font-size: clamp(32px, 8vw, 42px);
      }

      .detail-close {
        top: 90px;
        right: 24px;
        width: 44px;
        height: 44px;
      }

      .esc-hint {
        display: none;
      }

      .gallery-main {
        aspect-ratio: 4/3;
        width: 100%;
        max-width: 100%;
      }

      .detail-inner {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
      }

      .detail-top-row {
        gap: 24px;
        min-width: 0;
      }

      .detail-gallery,
      .detail-sidebar,
      .detail-body,
      .detail-description {
        min-width: 0;
        max-width: 100%;
      }

      .detail-link {
        width: 100%;
        box-sizing: border-box;
        font-size: 12px;
        padding: 10px 14px;
        white-space: normal;
      }

      .detail-link .link-text {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .detail-tags {
        gap: 6px;
        max-width: 100%;
      }

      .detail-tag {
        padding: 6px 12px;

      {
        id: 'wolfrom-actuator',
        title: 'Wolfrom Compound Planetary Actuator',

        displayOrder: 1,
        excerpt: 'Wolfrom compound planetary actuator for humanoid joints, targeting about 50:1 reduction with custom geartrain geometry, bearing stackups, output ring design, and prototype validation.',
        description: `A high-ratio Wolfrom compound planetary actuator for humanoid-scale joints. I'm building it around the three things gearboxes this small are usually bad at: backdrivability, low reflected inertia, and real efficiency at high reduction.<br><br><strong>Overview</strong><br><br>Humanoid robots need joints that are small, put out a lot of torque, and can still feel what they touch. That last part is the hard one. Most small high-ratio gearboxes are basically one way: you can drive the output from the motor, but you can't easily push the motor backward from the output, so the joint feels dead and can't do force control. I'm designing a Wolfrom compound planetary actuator that targets about 50:1 reduction in a compact package while staying efficient enough to actually backdrive.<br><br>The layout: the motor drives a sun gear, and each compound planet carries two gears, one meshing a fixed inner ring and the other driving the output ring. The small difference between those two ring meshes is where the big reduction comes from.<br><br><strong>Gear Ratio</strong><br><br>The reduction is the product of a sun-to-carrier stage and a carrier-to-output-ring stage:<br><br>$$i = i_0 \\cdot i_W = \\left(1 + \\frac{Z_{Ps}}{Z_{S}}\\cdot\\frac{Z_{Ra}}{Z_{Pa}}\\right)\\!\\cdot\\frac{S_3}{S_3 - S_2}$$<br>With my tooth counts (S=33, Ps=57, Pa=27, Pb=25, Ra=72, Rb=75) it comes out exactly to<br><br>$$i = \\frac{555}{11} \\approx 50.45 : 1$$<br>so one stage does what would normally take two stacked planetary gearboxes.<br><br><img src="/assets/wolfrom-render-face.jpg" alt="CAD front view of the Wolfrom gearbox showing the sun gear, three compound planets, and the ring gears" style="display:block; max-width: 56%; margin: 18px auto; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">CAD front view: the sun in the center driving three compound planets, with the fixed and output ring gears around them.</em><br><br><strong>Reflected Inertia</strong><br><br>A gearbox multiplies torque by the ratio N, but it also multiplies the rotor inertia the output feels by N squared:<br><br>$$J_{\\text{out}} = N^2 \\, J_{\\text{motor}}, \\qquad N \\approx 50 \\;\\Rightarrow\\; N^2 \\approx 2500$$<br>At 50:1 the joint feels about 2500 times the motor's rotor inertia. You can't design that away, it comes with the ratio. So the only way to keep the joint quick and backdrivable is to attack the part you can control, which is friction. Low friction is what stops all that reflected mass from turning into a joint that feels locked.<br><br><strong>Efficiency, and Why It Matters Most</strong><br><br>Wolfrom gearboxes are famous for being small and famous for being inefficient. The reason is circulating power. The high ratio comes from the small difference between two almost equal ring meshes, so far more power spins around inside the gearbox than ever comes out the other side, and that extra power turns into friction. I track it with the latent power ratio:<br><br>$$\\text{LPR} = \\left(1 - \\frac{2}{i_0}\\right) + (2\\,i_W - 1) \\approx 17.6$$<br>An LPR around 17.6 means roughly 0.1% of friction in one ring mesh costs about 1.7 points of overall efficiency. My target is about 80%, which would put a single-stage 50:1 actuator in a useful range for torque-dense, backdrivable joints.<br><br><strong>Why This One Is Different</strong><br><br>The important design move is how I split the ratio. A textbook Wolfrom dumps almost all of its reduction into the high-loss ring differential, which is exactly why circulating power blows up. I re-split it so more of the reduction happens in the first sun stage and less in the ring differential. Lower circulating power is the biggest lever on both efficiency and backdrivability, so the whole design is built around that constraint.<br><br><strong>Primary Problems to Solve</strong><br><br>• <b>Ring-mesh efficiency:</b> the two internal ring meshes carry almost all the load and cause almost all the friction, so their tooth shape and surface finish matter far more than the sun gear.<br>• <b>Planet-bearing drag:</b> the compound planets spin at about 2.67x carrier speed, so their bearings are a big loss path. The metal version moves from printed bushings to needle bearings on hardened, ground pins.<br>• <b>Load sharing:</b> three planets are over-constrained, so I float the sun and the carrier and time the planets at assembly so all three actually share the load.<br>• <b>Backdrivability:</b> rough printed teeth make the joint feel dead, so I use profile-shifted, low-friction gears and low-drag bearings to keep it transparent.<br>• <b>Manufacturing:</b> internal ring teeth can't be cleanly milled, so the production rings are planned as wire-EDM hardened steel pressed into an aluminum housing.<br><br><strong>What I Built</strong><br><br>• Designed the full Wolfrom compound planetary gearbox targeting about 50:1 reduction.<br>• Modeled the whole actuator stack: sun, compound planets, fixed ring, output ring, carrier, bearings, shafts, and output hub.<br>• Iterated on splitting the output ring, bolt access, bearing support, and axial spacing so it actually goes together.<br>• Designed around real manufacturing: FDM and SLA prototypes now, CNC and waterjet later, press-fit bearings, dowel alignment, low-profile fasteners.<br>• Built printed prototypes to check gear meshing, packaging, the assembly sequence, and fit.<br><br><strong>Technical Details</strong><br><br>The motor drives the sun, one planet gear meshes the fixed inner ring, and the other planet gear drives the output ring, both on the same compound planet. All three meshes share one planet-axis center distance, which forces the module ratio across the stages into roughly 1 : 2 : 1.8, so every stage is sized to its own teeth on the same circle. The output-ring mesh is both the highest loaded and the finest pitch, so it gets the widest face and, in the metal build, the hardest steel.<br><br><img src="/assets/wolfrom-render-section.jpg" alt="CAD cutaway section of the Wolfrom actuator showing the sun gear, compound planet stacks, fixed inner ring, and output ring" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">CAD cutaway: the sun drives the compound planets, which mesh the fixed inner ring with one gear and the output ring with the other, all in one axial package.</em><br><br>The current prototype runs on a goBILDA gearmotor for bench testing, with the whole gearbox built as a stack of plates (motor mount, carrier cheeks, fixed ring, output ring) tied together by standoffs and dowels for repeated teardown, gear timing, and stackup validation.<br><br><img src="/assets/wolfrom-render-side.jpg" alt="Side view of the Wolfrom actuator as a stack of plates mounted on the goBILDA motor" style="display:block; max-width: 88%; margin: 18px auto; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">The actuator as a stack of plates on the goBILDA motor: motor mount, carrier, and the fixed and output rings, set by standoffs and dowels.</em><br><br><strong>Skills Used</strong><br><br>CAD, gearbox design, actuator design, Wolfrom geartrains, KISSsoft gear optimization, tolerance stackups, bearing selection, fastener packaging, FDM and SLA prototyping, CNC and DFM planning, robotic hardware integration, mechanical testing.<br><br><strong>Status</strong><br><br>Right now I'm iterating on printed prototypes for the kinematics, packaging, and assembly while optimizing the design for a metal build. That means running the gear macro-geometry in KISSsoft (profile shifts and tip relief on the high-load ring meshes), and preparing a CNC aluminum version with wire-EDM hardened-steel rings, needle bearings on hardened pins, and a floating sun and carrier. Bench testing follows a one-variable-at-a-time plan: contact patterns to confirm all three planets share load, breakaway and backdrive measurements to see how transparent the joint feels, and a planned efficiency sweep against the 80% target.`,
        tags: ['Onshape', 'KISSsoft', 'Planetary Gear Design', 'Tolerance Stackups', 'Bearing Selection', 'FDM/SLA Prototyping', 'DFM'],

        excerpt: 'High-voltage battery system for Berkeley\'s Formula Electric racing team.',
        description: `<strong>The Accumulator</strong><br><br>I work on the Accumulator subteam at Formula Electric at Berkeley, designing and manufacturing the attic casing for our 588V lithium-ion battery pack. The pack's energy is governed by:<br><br>$$E_{\\text{pack}} = N_{\\text{parallel}} \\times \\int_0^Q V(q)\\,dq$$<br>where V(q) is cell voltage as a function of charge depleted. At 588V, a mistake means serious injury. I once accidentally shorted two segment busbars together and watched the cells heat up alarmingly fast. Nobody was hurt, but it changed how I approach every decision on this system.<br><br><strong>My Role: The Attic</strong><br><br>The casing must withstand FSAE crash loads (40g lateral, 40g longitudinal, 20g vertical), maintain dielectric strength at 588V, pass a rain test, and dissipate cell heat. I run FEA checking Von Mises stress everywhere:<br><br>$$\\sigma_{\\text{vm}} = \\sqrt{\\sigma_1^2 - \\sigma_1 \\sigma_2 + \\sigma_2^2}$$<br>Everything must stay below yield with a 1.5x safety factor. I reduced attic mass by 18% while meeting all structural and dielectric requirements. I chose 6061-T6 aluminum because after TIG welding and post-weld heat treatment (530°C solutionize, quench, age at 175°C for 8 hours), it recovers ~70% of base yield strength. 7075 does not recover from welding, steel is too heavy, and carbon fiber has conductivity concerns near HV components.<br><br><strong>Floor and Sealing</strong><br><br>The floor uses 6mm polycarbonate for electrical isolation:<br><br>$$V_{\\text{breakdown}} = 15\\,\\text{kV/mm} \\times 6\\,\\text{mm} = 90\\,\\text{kV}$$<br>That gives enormous margin over 588V, plus it is transparent for visual inspection without disassembly. Waterproofing uses a 3mm neoprene gasket (50A durometer) at 20-30% compression, with aluminum standoffs preventing over-compression. I chose neoprene over silicone for petroleum resistance near the powertrain.<br><br><img src="/assets/gas.png" alt="Gasket compression equation" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><br><strong>Insulation and Thermal</strong><br><br>All internal surfaces near HV components are lined with Nomex 410 (18 kV/mm dielectric, rated to 220°C, UL 94 V-0 fire resistance). For thermal management, the wall conductive resistance is low at 3mm 6061 (k ≈ 167 W/m·K), so the real bottleneck is convection off the outer surface, which is why we focused on optimizing airflow around the casing.<br><br><strong>Manufacturing</strong><br><br>Panels are laser-cut on a FabLight fiber laser, TIG welded, then heat-treated. The polycarbonate floor and neoprene gasket are waterjet cut. Before approval, the casing passes a 1500V AC dielectric test, IP65 water ingress test, 40g structural simulation, and perimeter gasket compression checks. Looking forward to competing in Michigan.`,
        tags: ['SolidWorks', 'SolidWorks PDM', 'FEA', 'GD&T', 'High-Voltage Packaging', 'Laser Cutting', 'Waterjet', 'TIG Welding'],
        links: [{ url: 'https://ev.berkeley.edu/', label: 'Team Website' }],

        id: 'ramesh-lab',
        title: 'Ramesh Lab: Complex-Oxide Thin Films',

        active: true,
        featured: false,
        excerpt: 'Researching complex-oxide thin films for faster, lower-power memory and logic beyond DRAM and CMOS, with supervised PLD growth work and linked instrumentation/software projects.',
        description: `<strong>Research Context</strong><br><br>I work in Ramesh Lab researching complex-oxide thin films for faster, lower-power memory and logic beyond DRAM and CMOS. These materials store and switch state through polarization rather than charge, enabling non-volatile memory and ferroelectric logic far more efficient than today's silicon-based hardware. The core question is how atomic-level fabrication choices -- stacking order, strain, interface chemistry, oxygen vacancy concentration -- reshape the electronic behavior of the final device.<br><br><strong>Physics and Materials Learning</strong><br><br>A major part of this work is building the physics foundation behind the experiments. I am reading <em>Principles and Applications of Ferroelectric and Related Materials</em> by Lines and Glass while learning how polarization, domains, coercive fields, hysteresis, dielectric response, strain, and defects show up in real oxide films. The goal is to understand not just how to run a tool, but what the measurements mean physically.<br><br><strong>Growth and Deposition Work</strong><br><br>I am learning the full thin-film workflow through supervised growth and characterization work: substrate prep, solvent cleaning, annealing, step-terrace control for atomically flat surfaces, PLD growth, laser fluence tuning, oxygen partial pressure control, substrate temperature stabilization, RHEED monitoring, and post-growth characterization with AFM, XRD, PFM, and electrical measurements.<br><br>I am also practicing thin-film deposition workflows with Donald's guidance. That means learning how small process choices -- oxygen pressure, plume shape, target/substrate geometry, temperature drift, and interface preparation -- can change domain structures, mobility, coercive fields, leakage behavior, or whether the film is useful at all.<br><br><strong>Connected Technical Projects</strong><br><br>This Ramesh Lab page is the hub for two technical projects I built around that workflow. <a href="#pldtracker" class="project-preview-link" data-preview="/assets/Screenshot 2026-03-13 000052.png">PLDTracker (Ramesh Lab)</a> supports growth documentation and deposition-data organization. <a href="#ns-us-pulse-generator" class="project-preview-link" data-preview="/assets/ns-pulse-schematic-thumbnail.png">Nanosecond Spin Transport Pulse Generator Board</a> supports fast electrical characterization after films and devices are fabricated.<br><br>Together, the projects cover both sides of the lab process: making and tracking the thin films, then building the instrumentation needed to measure how they switch.<br><br><strong>Why It Matters</strong><br><br>Strain, interfaces, and atomic stacking order create emergent behaviors you cannot get in any single material alone: switchable polarization for ultra-low-energy memory, interfacial conduction for novel logic, and coupled ferroic states that can enable electrical control of magnetism. My long-term goal is to take more ownership of growth and characterization experiments while building tools that make the research workflow more repeatable, measurable, and technically grounded.`,
        tags: ['PLD Growth', 'RHEED', 'AFM', 'XRD', 'PFM', 'Ferroelectric Characterization', 'BiFeO3 Thin Films'],
        links: [
          { label: 'Nanosecond Spin Transport Pulse Generator Board', url: '#ns-us-pulse-generator' },

      {
        id: 'ns-us-pulse-generator',
        title: 'Nanosecond Spin Transport Pulse Generator Board',
        category: 'Research Hardware',
        filterCategory: ['hardware', 'research'],
        years: [2026],
        period: 'college',
        date: 'May 2026 — Present',
        active: true,
        featured: false,
        displayOrder: 2,
        excerpt: 'Nanosecond pulse-generator PCB for BiFeO3 spin-transport and ferroelectric characterization, with GaN switching, grounded coax/BNC I/O, source-measure biasing, and RP2040/Python triggering.',
        description: `
          <strong>Overview</strong><br><br>
          I am designing a nanosecond pulse-generator board in Ramesh Lab for electrical characterization of BiFeO<sub>3</sub> and related complex-oxide thin-film devices. The board is meant to support spin-transport and ferroelectric testing where the sample needs a clean voltage pulse while the rest of the bench setup handles biasing, synchronization, and measurement.<br><br>
          Current BFO testing is generally around a 30 V pulse range, with the next goal being controlled sweeps down to smaller voltages. The board is therefore not just a generic fast pulser; it is an experiment interface for applying known voltage stress to oxide devices while preserving timing, bias state, and measurement visibility.<br><br>
          <strong>Experiment Target</strong><br><br>
          The useful voltage is the voltage that actually lands across the BFO device, not the nominal setting at the connector. I am treating the pulse as a bounded experiment waveform:<br><br>
          $$V_{\\text{BFO}}(t) = V_{\\text{bias}} + A_{\\text{pulse}}p(t), \\qquad A_{\\text{pulse}} \\leq 30\\,\\text{V initially}$$<br>
          where \\(p(t)\\) is the measured pulse shape at the fixture or device-side test point. The engineering problem is making \\(p(t)\\) repeatable enough that voltage sweeps mean something physically, especially as the amplitude moves below the current 30 V test range.<br><br>
          <strong>What The Current Means</strong><br><br>
          For ferroelectric characterization, the measured current is a mixture of the signal I care about and the things the fixture/device adds. Written as current density:<br><br>
          $$J_{\\text{meas}}(t)=\\frac{I_{\\text{meas}}(t)}{A}=\\frac{dP_{\\text{BFO}}}{dt}+\\sigma_{\\text{leak}}E_{\\text{BFO}}(t)+\\epsilon_0\\epsilon_r\\frac{dE_{\\text{BFO}}}{dt}+J_{\\text{transport}}(t)$$<br>
          The board layout and measurement flow are built around separating those pieces: switching current, leakage, capacitive displacement current, and the transport response. That is why the design emphasizes grounded coax/BNC interfaces, oscilloscope sync, known dummy loads, and source-measure compatibility instead of only making a pulse appear somewhere on a schematic.<br><br>
          <strong>Extracting A Useful Measurement</strong><br><br>
          One target measurement is switched polarization after subtracting a non-switching baseline. In practice, that means comparing pulse captures rather than trusting a single transient:<br><br>
          $$\\Delta P_{\\text{sw}} \\approx \\frac{1}{A}\\int_{t_1}^{t_2}\\left(I_{\\text{switch}}(t)-I_{\\text{baseline}}(t)\\right)dt$$<br>
          This is the reason for Python/JupyterLab analysis hooks and repeatable triggering. The board needs to make the pulse sequence, trigger timing, and captured waveform stable enough that later analysis can tell BFO switching apart from leakage and fixture capacitance.<br><br>
          <strong>Circuit Direction</strong><br><br>

        excerpt: 'Custom toolbox assembly taken from CAD to production-style drawings, GD&T callouts, laser/FDM fabrication planning, inspection, and prototype fit-up.',
        description: `<strong>Overview</strong><br><br>Designed and fabricated a custom toolbox prototype from production-style CAD drawings, applying ASME Y14.5-2018-style GD&T, datum selection, tolerance stackup thinking, and DFM principles to control lid, hinge, latch, handle, Gridfinity base, and fastener alignment through fabrication and assembly.<br><br>The goal was not just to make a box. I treated it as a compact mechanical manufacturing exercise: define design intent in CAD, break the assembly into fabricated parts, communicate the build through drawings, choose tolerances based on function, fabricate with available shop processes, then inspect and fit the prototype.<br><br><strong>Design Goals</strong><br><br>• Durable toolbox body with clean prototype fit-up.<br>• Lid, hinge, latch, handle, and side-wall alignment that survives fabrication error.<br>• Manufacturable geometry using accessible processes: CO2 laser-cut plywood panels, FDM printed inserts, drilled/fastened joints, and off-the-shelf hardware.<br>• Toleranced hole patterns and fastener interfaces for repeatable assembly.<br>• Drawings clear enough that someone else could understand the build sequence and critical interfaces.<br>• Minimize hand-fitting by thinking through datum strategy, hole positions, and tolerances before cutting parts.<br><br><strong>CAD + Drawing Package</strong><br><br>I modeled the toolbox as a full assembly, then split it into individual fabricated components: top walls, bottom walls, side panels, lid, hardware interfaces, and a Gridfinity-style base insert. The drawing package included assembly views, section views, part drawings, hole callouts, datum references, and notes for the intended manufacturing processes.<br><br><img src="/assets/toolbox-assembly-drawing.png" alt="Toolbox assembly drawing showing isometric, front, side, top, section, and bill of materials views" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Assembly drawing defining the lid, latch, hinge, handle, body, and Gridfinity insert interfaces before fabrication.</em><br><br>I applied GD&T principles based on ASME Y14.5-2018 rather than treating the drawing as a dimension dump. Functional datums were chosen around how the toolbox body would be assembled and inspected, with critical dimensions called out for lid fit, hinge alignment, latch engagement, handle placement, and repeated fastener patterns.<br><br><strong>GD&T / Tolerancing</strong><br><br>I treated the toolbox like a small mechanical assembly rather than a one-off shop part. The body established the primary datums, and the hinge/latch interfaces were dimensioned from those references so the lid would close repeatably after fabrication. Hole patterns were controlled with positional tolerances where alignment mattered, while non-critical dimensions were left with looser general tolerances to keep the design manufacturable.<br><br><img src="/assets/toolbox-bottom-walls-drawing.png" alt="Bottom wall drawing with datum references and positional tolerance callouts for fastener holes" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Bottom wall drawing with datum references, critical dimensions, and positional tolerance callouts for functional hole patterns.</em><br><br>The main tolerance stackup ran through the body panels, lid panels, hinge locations, latch engagement, and fastener clearances. I used position tolerance where hole alignment mattered, and kept flatness, perpendicularity, and parallelism tied to actual assembly function instead of over-tolerancing every edge.<br><br><strong>Manufacturing / DFM</strong><br><br>The prototype was designed around available shop processes rather than idealized manufacturing. The drawing package called out CO2 laser cutting for plywood panels and FDM 3D printing for the Gridfinity base, with sanding/deburring and mechanical fasteners used during assembly. That meant the CAD had to account for edge clearances, kerf/fit-up behavior, fastener access, hardware spacing, and how the parts would be held and aligned during assembly.<br><br><img src="/assets/toolbox-gridfinity-base-drawing.png" alt="Gridfinity base drawing with hole patterns, datum references, and flatness/perpendicularity callouts" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Gridfinity base drawing: an FDM-printed insert controlled with hole patterns, datum references, and fit-related tolerances.</em><br><br>Design decisions were driven by manufacturability: avoid impossible internal corners, leave realistic clearances around fasteners and moving hardware, plan the assembly sequence before cutting, and choose tolerances that matched the actual process capability of laser-cut plywood and printed parts.<br><br><strong>Inspection + Assembly</strong><br><br>After fabrication, I checked fit-up using calipers, fastener fit checks, squares, and physical assembly validation. The key inspections were hole alignment, lid closure, latch engagement, hinge alignment, and whether the Gridfinity base fit inside the body without forcing the assembly out of square.<br><br><img src="/assets/toolbox-prototype-closed.png" alt="Closed prototype toolbox fabricated from laser-cut plywood panels with hinges, latch, handle, and fasteners" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Prototype fit-up after fabrication with the lid, latches, hinges, handle, and fastener interfaces assembled.</em><br><br><img src="/assets/toolbox-prototype-open.png" alt="Open prototype toolbox showing interior storage and fit-up of the fabricated body and lid" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Open prototype showing the internal fit-up and hardware alignment. I do not have photos of the final version, so these prototype photos show the fabrication/assembly validation stage.</em><br><br>The prototype revealed the normal gap between drawing intent and shop reality: fasteners need access, laser-cut edges need finishing, hole patterns need enough clearance to tolerate small shifts, and datums only help if they match how the part is actually assembled and inspected.<br><br><strong>What I Learned</strong><br><br>Drawings are design tools, not paperwork. GD&T only matters when tied to function, and over-tolerancing makes a part harder to build without improving the assembly. Datum selection should match how the part is actually assembled and checked. Even a small toolbox exposes real tolerance stackup problems quickly, especially when hinges, latches, handles, printed inserts, and repeated fastener patterns all have to line up at once.<br><br><strong>Technical Work</strong><br><br>• Modeled the full toolbox assembly and generated part/assembly drawings for fabrication.<br>• Applied GD&T principles using ASME Y14.5-2018-style conventions for datums, hole patterns, and critical interfaces.<br>• Designed for manufacturability with realistic shop tolerances, fastener clearances, hardware spacing, and laser/FDM process constraints.<br>• Planned fabrication and assembly sequence to reduce hand-fitting and improve alignment.<br>• Inspected prototype parts with calipers, fastener fit checks, squareness checks, and physical assembly validation.`,

        excerpt: 'Experiment tracking and data-management system for PLD thin-film workflows, linking growth parameters, wafer position, characterization data, and lab documentation.',
        description: `<strong>Overview</strong><br><br>PLDTracker is a custom experiment tracking and data-management system I built for the lab's pulsed laser deposition setup. The goal was to replace scattered notes, slide decks, screenshots, and spreadsheets with a searchable dataset that connects how a film was grown with how it later characterized.<br><br><strong>What It Tracks</strong><br><br>The system logs each deposition run's substrate, target material, temperature, oxygen pressure, laser fluence, deposition time, and wafer disk position. It stores and links characterization data such as XRD scans and AFM/PFM domain images to specific runs, so researchers can correlate growth parameters with resulting film structure and properties.<br><br><strong>Data Explorer</strong><br><br>I built a dashboard-style data explorer for filtering deposition records and visualizing parameter trends with line-of-best-fit and connected datapoint plots. The point was not just storing data, but making it easier to see whether a change in growth conditions might explain changes in characterization results.<br><br><strong>Image and Document Pipeline</strong><br><br>A camera integration module monitors substrate positioning during deposition, with image capture tied to each run. I also built a PDF slide-deck parser that extracts and indexes analysis images from lab presentations, including AFM, PFM, and XRD figures, then helps associate them with the correct deposition records.<br><br><strong>Why It Matters</strong><br><br>Thin-film growth is sensitive to small process changes. Oxygen vacancy concentration, substrate temperature, plume shape, and interface quality can all reshape domain structures, mobility, leakage, or coercive fields. PLDTracker was built to make those relationships easier to document and revisit across experiments.<br><br><strong>Skills Used</strong><br><br>Python, Pandas, data modeling, dashboard development, computer vision, image processing, PDF parsing, experiment tracking, thin-film research workflows, and SolidWorks CAD for a PLD chamber camera mount.`,

        excerpt: 'Interactive tool for evaluating nuclear reactor site feasibility + research paper.',
        description: `<strong>The Research</strong><br><br>My AP Research capstone, turned interactive tool. Rural America pays ~25% more for electricity than urban areas and relies on aging infrastructure. I investigated whether hybrid Small Modular Reactor + solar systems could address this inequity. Solar costs dropped 89% since 2010 but cannot generate at night; SMRs provide 24/7 low-carbon baseload. Together they balance each other out. Almost all existing SMR research focuses on urban implementation, which left a clear gap for rural applications.<br><br><strong>The Tool</strong><br><br>Atlas SMR is an interactive web platform pulling data from the NRC, EIA, and USGS seismic databases. It displays 89 operating reactors, 13 shutdown facilities, and 119 candidate sites scored by a weighted algorithm. Users scrub a timeline from 2010 to 2050 to see reactor status shift with license expirations. Each candidate site's viability score:<br><br>$$S = w_1\\!\\left(1 - \\frac{P}{P_{\\max}}\\right) + w_2\\!\\left(1 - \\frac{D_s}{D_{\\max}}\\right) + w_3\\!\\left(\\frac{W}{W_{\\max}}\\right) + w_4\\!\\left(\\frac{G}{G_{\\max}}\\right)$$<br>where P is population in the 10-mile NRC emergency zone, Dₛ is distance to nearest seismic fault, W is cooling water proximity, and G is grid interconnection capacity. Default weights (0.30/0.25/0.25/0.20) are calibrated against historical NRC approvals, but users can adjust them and watch candidate rankings shift.<br><br><strong>Scenario Builder</strong><br><br>Users configure 50-300 MWe per module, 1-12 modules per site, and deployment year. For hybrid systems, annual energy:<br><br>$$E_{\\text{annual}} = C_{\\text{smr}} \\cdot 8760 \\cdot CF_{\\text{smr}} + C_{\\text{solar}} \\cdot 8760 \\cdot CF_{\\text{solar}} \\cdot (1 - \\text{curtailment})$$<br>In solar-rich regions like Navajo Nation, larger solar arrays reduce SMR daytime load. In cloudier areas like Nome, Alaska, the system leans on SMR output. My analysis showed a properly configured hybrid could meet ~24% of rural energy needs, with clear scalability beyond that.<br><br><strong>Limitations</strong><br><br>SMR cost estimates still lack large-scale U.S. operational data. Nuclear stigma is real. This tool is a prototype visualization, not a policy instrument -- actual site selection requires Environmental Impact Statements and full NRC licensing far beyond what a scoring algorithm captures.`,

        excerpt: 'YC x DeepMind hackathon winner. Real-time generative music for the visually impaired.',
        description: `<strong>YC x DeepMind Hackathon Winner</strong><br><br>Built at the YC x Google DeepMind hackathon in San Francisco. Leitmotif generates adaptive, real-time background music for visually impaired users. A webcam watches the scene, and every person who enters gets assigned a unique musical motif -- a short melodic signature that weaves into an evolving soundtrack reflecting the room's mood. When someone leaves, their motif plays back inverted as a farewell cue. The whole system is designed to give spatial awareness through sound alone, no screen needed.<br><br><strong>The Pipeline</strong><br><br>Everything runs in a continuous loop. A webcam frame gets captured and base64-encoded, then sent to Gemini 2.5 Flash for vision analysis (who is visible, what the scene feels like). That scene data goes to the Music Engine, which pulls each person's stored motif from Supabase (PostgreSQL). A prompt builder constructs a Lyria-compatible music prompt, Gemini refines it with tempo, key, and instrumentation decisions, and the Google Lyria RealTime API generates PCM audio streamed directly to speakers. The cycle repeats on every new frame.<br><br>Crossfading between emotional states uses a 4-6 second blend window. Without smooth transitions, mood shifts sounded jarring -- like someone changing the radio station mid-song. The crossfade duration is a tradeoff: too short and the transitions feel abrupt, too long and the system feels unresponsive to actual scene changes.<br><br><strong>The Motif System</strong><br><br>Each person's musical signature is a structured JSON object: note count, interval patterns, rhythm sequences, melodic contours, and character descriptors. On entry, the motif plays once as a bright solo phrase over a ducked background. On exit, the motif plays descending and inverted. This gives users a learnable, consistent association between people and sounds.<br><br>Motif management enforces musical rules to prevent overlaps. If two people enter within a short window, the system queues motifs rather than layering them, since simultaneous melodic lines become indistinguishable -- which defeats the purpose. The prompt builder also handles key compatibility so motifs do not clash harmonically with the background:<br><br>$$\\text{consonance}(f_1, f_2) = \\frac{\\gcd(f_1, f_2)}{\\min(f_1, f_2)}$$<br>where simple frequency ratios (octave 2:1, fifth 3:2, fourth 4:3) produce the most consonant intervals. The system biases motif assignments toward intervals that sit well against common background keys.<br><br><strong>Architecture</strong><br><br>Two servers. The Music Engine (port 3001) handles real-time scene orchestration, adaptive prompt generation, entry/exit transitions, and crossfading. The Camera Server (port 3002) runs Gemini vision analysis on webcam frames and auto-forwards results. We split them because vision analysis and music generation have very different latency profiles, and decoupling lets each run at its own pace without blocking the other.<br><br>Backend is Node.js with TypeScript, native HTTP server, Gemini 2.5 Flash for vision + orchestration, Lyria RealTime for generative music, Supabase for persistence. The React Native companion app (iOS/Android) has four screens (Monitor, Contacts, Visualizer, Settings) for real-time entity tracking and motif management. Web mockup built with React, Vite, and Tailwind.`,

        excerpt: 'Hardware Lead for FTC #13216. Designed robot with 500+ custom parts.',
        description: `<strong>The Robot</strong><br><br>INTO THE DEEP (2024-25 FTC game): collect samples from a submersible, score them in baskets and specimen chambers, and hang from a bar for endgame points. As Hardware Lead for Team Deja Vu #13216, I owned the mechanical design, CAD management, and manufacturing coordination. The robot CAD model has over 500 unique parts across mecanum drivetrain, active intake, transfer pathway, arm/lift, end effector, and hang mechanism.<br><br><strong>The Intake</strong><br><br>Our most iterated subsystem, four revisions total. V1 (passive funnel with compliant wheels) was too slow. V2 (active roller with surgical tubing) had inconsistent grip. V3 (dual-stage roller with speed differential) jammed at odd angles. V4 landed on a single high-speed roller with optimized geometry, and that became our competition design. Each version taught us something about the trade-offs between speed, reliability, and complexity with these specific game pieces.<br><br><strong>Manufacturing and FEA</strong><br><br>We used Markforged printers for structural nylon, Prusa for prototypes, laser-cut polycarbonate and Delrin plates, CNC-machined aluminum for high-stress parts, and standard manual tools for modifications. For the arm pivot and hang brackets, I ran FEA in SolidWorks, checking stress vs. yield (safety factor > 2.0) and deflection under load to ensure nothing interfered with mechanism travel.<br><br><strong>Software</strong><br><br>I also wrote the TeleOp code in Java: mecanum drive with field-centric control using IMU heading, arm and lift position control with encoder-based PID loops, intake/transfer sequencing, and driver feedback through gamepad rumble. Writing both the hardware and driver code let me optimize how the mechanisms actually feel to operate, which fed directly back into design decisions.<br><br>The reliability-focused approach paid off: minimal mechanical failures during matches, and we advanced through qualifications into elimination rounds.<br><br><em style="opacity: 0.7; font-size: 0.9em;">Note: Team Deja Vu #13216 has since become a legacy team, with a new group of students carrying the name forward.</em>`,

        excerpt: 'Hardware Lead for FTC #13216. Designed pixel-scoring mechanisms.',
        description: `<strong>The Game</strong><br><br>CENTERSTAGE (2023-24 FTC): robots collected hexagonal "pixels" and placed them on a vertical backdrop to create mosaic patterns, with bonus points for specific arrangements and launching paper airplane drones during endgame. I joined Deja Vu #13216 as Hardware Lead after Zenith dissolved when its founder graduated.<br><br><strong>The Claw</strong><br><br>The hardest mechanism to get right. Hexagonal pixels interlock in weird ways, and the claw had to grip them reliably without blocking the vision system. The final design used compliant TPU fingers that conform to pixel geometry, spring-loaded hinges for passive grip, and servo-actuated release. Dual-pixel capacity was critical -- grabbing two per trip to the backdrop doubled our scoring potential.<br><br><strong>Vision and Software</strong><br><br>The robot used AprilTags on the backdrop for autonomous alignment and a camera for detecting pixel positions. I wrote the TeleOp code in Java: mecanum drive with configurable speed curves, arm position presets for different backdrop heights, claw control with pixel detection feedback, drone launcher arming sequence, and intake/transfer coordination. Writing both hardware and driver code meant I could tune the controls specifically for our drivers' preferences.<br><br><strong>Results</strong><br><br>We qualified for the NorCal regional championship with minimal mechanical failures during matches. The reliability-first philosophy I brought from Zenith paid off here.<br><br><em style="opacity: 0.7; font-size: 0.9em;">Note: Team Deja Vu #13216 has since become a legacy team, with a new group of students carrying the name forward.</em>`,

        description: `<strong>The Lift</strong><br><br>POWERPLAY (2022-23 FTC): stack cones on junctions of varying heights. My second year in FTC, first as Team Lead for Zenith #20424. The core mechanism was a linear lift needing 30+ inches of travel, full extension under 1.5 seconds, carrying ~200g. We used continuous rigging with dyneema string and a high-RPM motor. Lift speed depends on spool geometry:<br><br>$$v_{\\text{lift}} = \\frac{\\omega_{\\text{motor}} \\cdot d_{\\text{spool}} \\cdot \\pi}{2G}$$<br>But the motor also needs enough torque to accelerate the carriage without stalling:<br><br>$$\\tau_{\\text{motor}} = \\frac{(m_{\\text{carriage}} \\cdot g + m_{\\text{carriage}} \\cdot a_{\\text{desired}}) \\cdot d_{\\text{spool}}}{2 \\cdot G \\cdot \\eta}$$<br>where $\\eta$ is drivetrain efficiency (~0.85 for string-on-spool). Getting the gear ratio right meant balancing these two equations: too aggressive and the motor stalls under load, too conservative and you lose cycle time.<br><br><strong>Cone Manipulation</strong><br><br>The claw went through three versions. V1 (simple pinch) dropped cones during fast lift moves because acceleration pulled them loose. V2 added spring-loaded compliance but was inconsistent with cone orientation. The breakthrough was V3: internal centering guides that funnel the cone into position before gripping. The claw needed to actively center the cone, not just grab it.<br><br><strong>Software</strong><br><br>I wrote both TeleOp and autonomous in Java. TeleOp had mecanum kinematics, lift PID control, and speed scaling modes. Autonomous used OpenCV color thresholding for signal sleeve detection, dead wheel odometry, and IMU heading correction to fight encoder drift over the 30-second period.<br><br><strong>ZenLender</strong><br><br>I noticed teams scrambling for parts before competitions with $50+ overnight shipping on $15 parts. I built ZenLender, a basic spreadsheet system for lending parts between teams. Primitive, but the concept eventually evolved into Inventry. During one match, our lift string snapped mid-cycle because we had not inspected it for wear. Preventive maintenance matters as much as good design.<br><br><em style="opacity: 0.7; font-size: 0.9em;">Note: Team Zenith #20424 has since dissolved.</em>`,

        excerpt: 'AI-powered robotics parts inventory and marketplace.',
        description: `<strong>The Problem</strong><br><br>If you have been on an FTC team, you know the panic: a motor burns out two nights before competition, and overnight shipping on a $15 part is $150+. My team scrambled through group chats and outdated spreadsheets to find nearby teams with spares. I first built ZenLender on Zenith -- a basic spreadsheet lending system -- but manual data entry killed adoption. Inventry is the real version.<br><br><strong>What It Does</strong><br><br>Three components: inventory management (track parts, quantities, conditions), a part lending network (find nearby teams with what you need), and a marketplace (in development). The stack is React/TypeScript with Tailwind on the frontend, Node.js/Express/PostgreSQL on the backend, OAuth 2.0 with team verification through FIRST's public data, hosted on Vercel and Railway.<br><br><strong>AI Invoice Parsing</strong><br><br>The biggest friction with inventory tools is data entry. Nobody wants to type in 200 parts from a GoBilda order. Users upload invoice PDFs or photos and the system extracts part numbers, quantities, prices, and dates using Tesseract OCR + GPT-4 for structured parsing. Accuracy is ~94% on clean invoices, ~85% on photographed receipts. I also built weekly scrapers for GoBilda, REV, ServoCity, and AndyMark -- 3,000+ unique SKUs feeding the search system with current pricing and availability.<br><br><strong>The Lending System</strong><br><br>The hard part: getting teams to lend parts to strangers. The solution is a reputation system where lender points unlock priority borrowing access, distance matching prioritizes teams within driving range (default 30 miles), and requests get flagged as urgent if a competition is within 7 days. Privacy was non-negotiable -- exact addresses are never shown, communication stays on-platform, and all data is encrypted and GDPR-deletable.<br><br>FTC teams already spend too much money. If this saves one team from paying $200 in emergency shipping, it is worth more than whatever I could charge.`,

        description: `<strong>The Problem</strong><br><br>Finding volunteer opportunities as a high school student was frustrating -- word of mouth, missed deadlines, full events. Organizers coordinating through email chains and Google Forms had no way to verify students or track participation. Pear connected both sides: 2000+ registered student volunteers, 20+ event organizers (nonprofits, school clubs, community orgs), and school administrators who needed verified hour logs.<br><br><strong>How It Works</strong><br><br>Three user types: students browse and sign up for events, organizers create listings and manage volunteers, administrators verify hours for school records. Built on Wix with custom Velo code for business logic and webhook integrations. When a student signs up, the system validates their student ID, checks for schedule conflicts, notifies the organizer, and updates capacity. For high-volume events (some filled 50+ spots in under an hour), I built an async webhook queue:<br><br><code>Event Signup → Wix Backend → Webhook Queue → Email Service → Database Update</code><br><br>This prevents timeouts during traffic spikes and handles ~10 requests per second.<br><br><strong>Hour Tracking</strong><br><br>The biggest pain point for students was proving volunteer hours for college applications. Organizers check in volunteers via QR code scan, hours auto-log with event details, and students can request official verification letters auto-generated as PDFs with school letterhead. This saved counselors significant paperwork. All communication flows through Pear -- student contact info is never shown to organizers, data is encrypted, and parents can request deletion at any time.<br><br>I handed off Pear when I left for college in 2025.`,
