  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ::selection { background: rgba(200, 180, 155, 0.4); color: #fff; }
    [data-theme="light"] ::selection { background: rgba(170, 150, 120, 0.35); color: #1a202c; }

    :root {
      --bg: #0a0a0a;
      --text: #fff;
      --text-dim: #888;
      --text-muted: #555;
      --border: rgba(255,255,255,0.08);
      --border-light: rgba(255,255,255,0.15);
      --nav-bg: rgba(10, 10, 10, 0.95);
      --nav-link: rgba(255, 255, 255, 0.7);
      --nav-link-hover: #FFFFFF;
      --nav-border-hover: rgba(255, 255, 255, 0.5);
      --glow-center: rgba(255, 255, 255, 0.04);
      --glow-mid: rgba(255, 255, 255, 0.015);
      --card-bg: rgba(10,10,10,0.92);
    }

    [data-theme="light"] {
      --bg: #f5f2ee;
      --text: #0f172a;
      --text-dim: #4a5568;
      --text-muted: #64748b;
      --border: rgba(0,0,0,0.1);
      --border-light: rgba(0,0,0,0.22);
      --nav-bg: rgba(245, 242, 238, 0.95);
      --nav-link: rgba(0, 0, 0, 0.65);
      --nav-link-hover: #0f172a;
      --nav-border-hover: rgba(0, 0, 0, 0.4);
      --glow-center: rgba(0, 0, 0, 0.06);
      --glow-mid: rgba(0, 0, 0, 0.025);
      --card-bg: rgba(245,242,238,0.92);
    }

    /* Smooth theme transition */
    html.theme-transition,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, fill 0.35s ease, box-shadow 0.35s ease !important;
    }

    html {
      scroll-behavior: smooth;
      overflow-y: scroll;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar { display: none; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.6;
      overflow-y: scroll;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    body::-webkit-scrollbar { display: none; }

    /* Theme Toggle */
    .theme-toggle {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1002;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.25s ease;
    }

    .theme-toggle:hover { color: var(--text); }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }

    [data-theme="light"] .theme-toggle .icon-sun { display: block; }
    [data-theme="light"] .theme-toggle .icon-moon { display: none; }

    /* Cursor Glow */
    .cursor-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      background: radial-gradient(circle, var(--glow-center) 0%, var(--glow-mid) 40%, transparent 70%);
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease;
      opacity: 0;
    }
    .cursor-glow.visible { opacity: 1; }

    @media (max-width: 768px) {
      .cursor-glow { display: none; }
      body { background-attachment: scroll; }
    }

    /* Nav */
    .nav-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1001;
      padding: 24px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      background: transparent;
      height: 80px;
      box-sizing: border-box;
    }

    .nav-link {
      color: var(--nav-link);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      border-bottom: 1px solid transparent;
      padding: 8px 0;
      transition: all 0.3s ease;
      line-height: 1;
    }

    .nav-link:hover {
      color: var(--nav-link-hover);
      border-bottom-color: var(--nav-border-hover);
    }
    .nav-link.active { color: var(--nav-link-hover); border-bottom-color: var(--nav-link-hover); }

    /* Main content */
    main {
      max-width: 1520px;
      margin: 0 auto;
      padding: 140px clamp(40px, 5vw, 76px) 100px;
      position: relative;
    }

    .page-header {
      margin-bottom: 32px;
      position: relative;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .filter-row {
      display: flex;
      justify-content: flex-start;
      gap: 32px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .filter-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-right: 8px;
    }

    .filter-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--border-light);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--card-bg);
      border-color: var(--border-light);
      color: var(--text);
    }

    .filter-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 8px;
    }

    @media (max-width: 768px) {
      /* Mobile font: Inter instead of monospace (except nav) */
      body, .filter-btn, .project-title, .project-subtitle,
      .project-description, .project-meta, .detail-title, .detail-body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      }

      .filter-bar {
        display: none;
      }
      .filter-divider {
        display: none;
      }
      .filter-btn {
        padding: 6px 12px;
        font-size: 10px;
      }
    }

    .page-title {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(42px, 7vw, 56px);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0;
      transition: opacity 0.3s;
    }

    /* Project grid - always 3 columns */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Smooth view transitions */
    .projects-grid.view-transitioning .project-card {
      opacity: 0;
      transform: scale(0.95);
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 1;
      transform: scale(1);
      grid-column: span 1;
    }

    .project-card:hover {
      border-color: var(--border-light);
      background: rgba(10,10,10,0.95);
      box-shadow: 0 4px 24px rgba(255,255,255,0.06);
    }

    [data-theme="light"] .project-card:hover {
      background: rgba(245,242,238,0.95);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .project-image {
      width: 100%;
      aspect-ratio: 16/10;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .project-image picture,
    .gallery-main picture,
    .gallery-thumb picture {
      display: block;
      width: 100%;
      height: 100%;
    }

    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      transition: transform 0.3s ease;
    }

    .project-card:hover .project-image img {
      transform: scale(1.03);
    }

    .project-card[data-id="ramesh-lab"] .project-image img {
      object-fit: cover;
    }

    .project-card[data-id="ramesh-lab"]:hover .project-image img {
      transform: scale(1.05);
    }

    /* Deja Vu INTO THE DEEP - match purple background */

    .project-card[data-id="zenith-2022-23"] .project-image img {

    }

    .project-card[data-id="zenith-2022-23"]:hover .project-image img {

    /* Zenith FREIGHT FRENZY - light grey background */
    .project-card[data-id="zenith-2021-22"] .project-image {

    .project-card[data-id="dejavu-2023-24"] .project-image img {

    .project-card[data-id="wolfrom-actuator"] .project-image img {

    .project-card[data-id="pear-volunteering"] .project-image img {

    .project-card[data-id="inventry"]:hover .project-image img {

    .project-card[data-id="ns-us-pulse-generator"] .project-image,

    .project-card[data-id="ns-us-pulse-generator"] .project-image img {

    }

    .detail-content[data-project-id="ns-us-pulse-generator"] .gallery-main {

    }

    .detail-content[data-project-id="ns-us-pulse-generator"] .gallery-main img,
    .detail-content[data-project-id="ns-us-pulse-generator"] .gallery-main picture,
    .detail-content[data-project-id="ns-us-pulse-generator"] #galleryMediaContainer img,
    .detail-content[data-project-id="ns-us-pulse-generator"] #galleryMediaContainer picture {
      background: #b8b7cf;
    }

    .project-card[data-id="pldtracker"] .project-image img {
      object-fit: cover;
      object-position: center center;
    }

    .project-card[data-id="pldtracker"]:hover .project-image img {
      transform: scale(1.05);
    }

    .detail-content[data-project-id="pldtracker"] .gallery-main img {
      object-fit: cover;
      object-position: center center;
    }

    .project-card[data-id="friendly-fires"] .project-image img,
    .detail-content[data-project-id="friendly-fires"] .gallery-main img {
      object-fit: cover;
      object-position: center center;
    }

    .project-card[data-id="field-station-toolbox"] .project-image,
    .project-card[data-id="field-station-toolbox"] .project-image img {
      background: #f6f4ef;
    }

    .project-card[data-id="field-station-toolbox"] .project-image img {
      object-fit: cover;
      object-position: center center;
    }

    .project-preview-link {
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .project-preview-link:hover {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    .project-hover-preview {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      width: 220px;
      height: 140px;
      border-radius: 8px;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      background: #000;
    }

    .project-hover-preview.visible {
      opacity: 1;
      transform: scale(1);
    }

    .project-hover-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    [data-theme="light"] .project-hover-preview {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .project-image-placeholder {
      color: var(--text-muted);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .project-content {
      padding: 24px;
    }

    .project-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .project-category {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .project-date {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .project-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .project-excerpt {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Featured styling (but not full width anymore) */
    .project-card.featured .project-title {
      font-size: 20px;
    }

    /* Status dot */
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ========== DETAIL VIEW ========== */
    
    /* When detail view is active */
    body.detail-active {
      overflow: hidden;
    }

    body.detail-active,
    body.detail-active html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    body.detail-active::-webkit-scrollbar,
    body.detail-active html::-webkit-scrollbar {
      display: none;
    }

    body.detail-active .projects-grid {
      pointer-events: none;
    }

    /* Hide other cards when detail view is active */
    body.detail-active .project-card:not(.active-card) {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    /* The active card transforms */
    .project-card.active-card {
      position: relative;
      z-index: 100;
      border-color: var(--border-light);
    }

    /* Detail content - same layout as main page */
    .detail-content {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      color: var(--text);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .detail-content::-webkit-scrollbar {
      display: none;
    }

    .detail-content.visible {
      opacity: 1;
      visibility: visible;
    }

    .detail-inner {
      max-width: 1520px;
      margin: 0 auto;
      padding: 140px clamp(40px, 5vw, 76px) 100px;
      min-width: 0;
    }

    .detail-header {
      margin-bottom: 48px;
    }

    .detail-category {
      display: none;
    }

    /* Match the project index heading so title transitions happen in place */
    .detail-title {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(42px, 7vw, 56px);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0 0 12px 0;
    }

    .detail-date {
      font-size: 14px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease 0.15s;
    }

    .detail-content.visible .detail-date {
      opacity: 1;
      transform: translateY(0);
    }

    .detail-content[data-project-id="ns-us-pulse-generator"] .detail-title {
      font-size: clamp(34px, 5.4vw, 46px);
      max-width: 980px;
    }

    /* Top row: gallery + sidebar side by side */
    .detail-top-row {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
      gap: clamp(36px, 4vw, 64px);
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    }

    .detail-content.visible .detail-top-row {
      opacity: 1;
      transform: translateY(0);
    }

    /* Gallery */
    .detail-gallery {
      width: 100%;
      min-width: 0;
    }

    .gallery-main {
      width: 100%;
      aspect-ratio: 4/3;
      background: #000;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
    }

    #galleryMediaContainer {
      width: 100%;
      height: 100%;
      min-width: 0;
    }

    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
      opacity: 0;
    }

    .gallery-main:hover .gallery-nav {
      opacity: 1;
    }

    .gallery-nav:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.5);
    }

    .gallery-nav-prev { left: 12px; }
    .gallery-nav-next { right: 12px; }

    .gallery-nav svg {
      width: 18px;
      height: 18px;
      stroke: rgba(255,255,255,0.8);
      stroke-width: 2;
      fill: none;
    }

    .gallery-nav:hover svg { stroke: #fff; }

    .gallery-main img,
    .gallery-main picture,
    #galleryMediaContainer img,
    #galleryMediaContainer picture,
    #galleryMediaContainer video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #000;
    }

    .gallery-main-placeholder {
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .gallery-thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
    }

    .gallery-thumb {
      width: 70px;
      height: 44px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.03);
      border: 2px solid transparent;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s;
      opacity: 0.5;
    }

    .gallery-thumb:hover {
      opacity: 0.8;
    }
    .gallery-thumb.active { border-color: #fff; opacity: 1; }

    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Detail body - full width description below */
    .detail-body {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
    }

    .detail-content.visible .detail-body {
      opacity: 1;
      transform: translateY(0);
    }

    /* Interactive 3D viewer */
    .detail-model {
      margin-top: 8px;
      margin-bottom: 28px;
    }

    .detail-model-heading {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0 0 14px;
    }

    /* Click-to-load poster */
    .model-poster {
      display: block;
      width: 100%;
      height: 520px;
      padding: 0;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background-color: #0d0d0f;
      background-size: cover;
      background-position: center;
    }

    [data-theme="light"] .model-poster {
      border-color: rgba(0,0,0,0.1);
      background-color: #f0f0f2;
    }

    .model-poster::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.15), rgba(0,0,0,0.55));
      transition: background 0.3s ease;
    }

    .model-poster:hover::after {
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.05), rgba(0,0,0,0.4));
    }

    .model-poster-cta {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(20,20,22,0.72);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      backdrop-filter: blur(6px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .model-poster:hover .model-poster-cta {
      transform: translate(-50%, -50%) scale(1.04);
      background: rgba(20,20,22,0.88);
    }

    .model-poster-cta svg { fill: currentColor; }

    .model-progress {
      background: rgba(255,255,255,0.85);
      height: 3px;
      border-radius: 2px;
    }

    @media (max-width: 768px) {
      .model-poster { height: 340px; }
    }

    .detail-model model-viewer {
      width: 100%;
      height: 520px;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,0.06), rgba(0,0,0,0) 70%), #0d0d0f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      --poster-color: transparent;
    }

    [data-theme="light"] .detail-model model-viewer {
      background: radial-gradient(circle at 50% 35%, rgba(0,0,0,0.04), rgba(0,0,0,0) 70%), #f0f0f2;
      border-color: rgba(0,0,0,0.1);
    }

    .detail-model-frame {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 62%;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
      background: #0d0d0f;
    }

    [data-theme="light"] .detail-model-frame {
      border-color: rgba(0,0,0,0.1);
      background: #f0f0f2;
    }

    .detail-model-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .detail-model-hint {
      display: block;
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-dim);
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .detail-model model-viewer { height: 340px; }
      .detail-model-frame { padding-bottom: 75%; }
    }

    .detail-description {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
      margin-bottom: 32px;
      columns: 2;
      column-gap: 40px;
      opacity: 0.85;
    }

    .detail-description code {
      display: block;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px;
      margin: 12px 0;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 14px;
      color: #7dd3fc;
      border-radius: 4px;
      overflow-x: auto;
    }

    [data-theme="light"] .detail-description code {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.1);
      color: #0369a1;
    }

    /* KaTeX display math blocks */
    .detail-description .katex-display {
      margin: 12px 0;
      padding: 14px 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .detail-description .katex {
      font-size: 1.05em;
    }

    [data-theme="light"] .detail-description .katex {
      color: #1a202c;
    }

    .detail-description strong {
      color: var(--text);
      font-weight: 600;
      display: block;
      margin-top: 14px;
      margin-bottom: 2px;
      break-after: avoid;
      -webkit-column-break-after: avoid;
    }

    .detail-description strong:first-child {
      margin-top: 0;
    }

    .project-disclosure {
      margin: 14px 0;
      padding: 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
    }

    .project-disclosure + .project-disclosure {
      margin-top: -15px;
      border-top: 0;
    }

    .project-disclosure summary {
      padding: 12px 0;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      list-style-position: outside;
    }

    .project-disclosure[open] {
      break-inside: auto;
      -webkit-column-break-inside: auto;
    }

    .project-disclosure[open] summary {
      margin-bottom: 4px;
    }

    .project-disclosure-content {
      padding: 0 0 14px;
    }

    .project-inline-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
    }

    .project-inline-grid figure {
      min-width: 0;
      margin: 0;
    }

    .project-inline-grid img,
    .project-disclosure img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: #fff;
      border-radius: 4px;
    }

    .project-inline-grid figcaption,
    .project-disclosure figcaption {
      margin-top: 7px;
      color: var(--text-muted);
      font-size: 0.82em;
      font-style: italic;
      line-height: 1.5;
    }

    .project-result-list {
      margin: 10px 0 14px;
      padding-left: 18px;
    }

    .project-result-list li {
      margin: 5px 0;
    }

    @media (max-width: 768px) {
      .project-inline-grid {
        grid-template-columns: 1fr;
      }

      .project-disclosure,
      .project-disclosure-content {
        max-width: 100%;
      }
    }

    .board-layer-viewer {
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      width: 100%;
      margin: 16px 0 22px;
      padding: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.025);
    }

    [data-theme="light"] .board-layer-viewer {
      background: rgba(0,0,0,0.025);
    }

    .board-layer-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .board-layer-viewer input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .board-layer-controls label {
      padding: 6px 8px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .board-layer-controls label:hover {
      border-color: var(--border-light);
      color: var(--text);
    }

    .board-layer-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 11;
      max-height: 280px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #101116;
    }

    .board-layer-stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100% !important;
      max-width: none !important;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .board-layer-expand {
      position: absolute;
      right: 8px;
      bottom: 8px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 7px;
      border: 1px solid rgba(255,255,255,0.24);
      background: rgba(12,13,18,0.78);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .board-layer-expand:hover {
      border-color: rgba(255,255,255,0.55);
      background: rgba(12,13,18,0.95);
    }

    .board-layer-expand svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
    }

    .board-layer-caption {
      display: block;
      margin-top: 10px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }

    #ns-layer-render:checked ~ .board-layer-controls label[for="ns-layer-render"],
    #ns-layer-layout:checked ~ .board-layer-controls label[for="ns-layer-layout"],
    #ns-layer-top:checked ~ .board-layer-controls label[for="ns-layer-top"],
    #ns-layer-copper:checked ~ .board-layer-controls label[for="ns-layer-copper"],
    #ns-layer-in1:checked ~ .board-layer-controls label[for="ns-layer-in1"],
    #ns-layer-in2:checked ~ .board-layer-controls label[for="ns-layer-in2"],
    #ns-layer-silk:checked ~ .board-layer-controls label[for="ns-layer-silk"],
    #ns-layer-bottom:checked ~ .board-layer-controls label[for="ns-layer-bottom"] {
      border-color: var(--border-light);
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }

    .board-layer-lightbox .board-layer-controls label.is-active {
      border-color: var(--border-light);
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }

    #ns-layer-render:checked ~ .board-layer-stage .layer-render,
    #ns-layer-layout:checked ~ .board-layer-stage .layer-layout,
    #ns-layer-top:checked ~ .board-layer-stage .layer-top,
    #ns-layer-copper:checked ~ .board-layer-stage .layer-copper,
    #ns-layer-in1:checked ~ .board-layer-stage .layer-in1,
    #ns-layer-in2:checked ~ .board-layer-stage .layer-in2,
    #ns-layer-silk:checked ~ .board-layer-stage .layer-silk,
    #ns-layer-bottom:checked ~ .board-layer-stage .layer-bottom {
      opacity: 1;
    }

    .board-layer-lightbox {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: rgba(4,5,8,0.82);
      backdrop-filter: blur(14px);
    }

    .board-layer-lightbox.active {
      display: flex;
    }

    .board-layer-lightbox-panel {
      position: relative;
      width: min(94vw, 1320px);
      max-height: 92vh;
      padding: 18px;
      overflow: auto;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(14,15,20,0.96);
      box-shadow: 0 28px 80px rgba(0,0,0,0.38);
    }

    .board-layer-lightbox-close {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 4;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.4);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .board-layer-lightbox .board-layer-viewer {
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .board-layer-lightbox .board-layer-controls {
      padding-right: 48px;
      margin-bottom: 14px;
    }

    .board-layer-lightbox .board-layer-stage {
      max-height: none;
      height: min(72vh, 820px);
      aspect-ratio: auto;
    }

    .board-layer-lightbox .board-layer-caption {
      max-width: 980px;
      font-size: 11px;
    }

    .board-layer-lightbox .board-layer-expand {
      display: none;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .detail-tag {
      padding: 8px 16px;
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
    }

    .detail-tag:hover {
      border-color: var(--border-light);
      color: #fff;
    }

    .detail-sidebar h3 {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 16px;
    }

    .detail-sidebar {
      min-width: 0;
    }

    .detail-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 40px;
    }

    .detail-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .detail-link:hover {
      border-color: var(--border-light);
      color: #fff;
      background: rgba(255,255,255,0.02);
    }

    .detail-link svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex: 0 0 16px;
    }

    .detail-link.unavailable-link {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .detail-link.unavailable-link:hover {
      border-color: #ff4444;
      color: #ff4444;
      background: rgba(255, 68, 68, 0.1);
    }

    .detail-link.unavailable-link:hover svg {
      fill: #ff4444;
    }

    /* Navigation - removed left/right buttons */
    .detail-nav {
      display: none;
    }

    /* Close button */
    .detail-close {
      position: fixed;
      top: 120px;
      right: 40px;
      width: 50px;
      height: 50px;
      background: rgba(0,0,0,0.8);
      border: 1px solid var(--border);
      cursor: pointer;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0;
      transform: scale(0.8);
    }

    [data-theme="light"] .detail-close {
      background: rgba(255,255,255,0.9);
      border-color: rgba(0,0,0,0.15);
    }

    [data-theme="light"] .detail-close::before,
    [data-theme="light"] .detail-close::after {
      background: #111;
    }

    [data-theme="light"] .detail-close:hover {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.25);
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    [data-theme="light"] .gallery-nav {
      background: rgba(255,255,255,0.8);
      border-color: rgba(0,0,0,0.15);
    }

    [data-theme="light"] .gallery-nav svg {
      stroke: rgba(0,0,0,0.7);
    }

    [data-theme="light"] .gallery-nav:hover {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.3);
    }

    [data-theme="light"] .gallery-nav:hover svg {
      stroke: #111;
    }

    [data-theme="light"] .detail-link:hover {
      border-color: rgba(0,0,0,0.25);
      color: #111;
      background: rgba(0,0,0,0.03);
    }

    [data-theme="light"] .detail-tag:hover {
      border-color: rgba(0,0,0,0.25);
      color: #111;
    }

    [data-theme="light"] .detail-fab {
      background: rgba(255,255,255,0.9);
      border-color: rgba(0,0,0,0.15);
      color: #111;
    }

    [data-theme="light"] .detail-fab svg {
      fill: #111;
    }

    [data-theme="light"] .detail-fab:hover {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.25);
    }

    [data-theme="light"] .esc-hint {
      color: rgba(0,0,0,0.4);
    }

    [data-theme="light"] .gallery-main {
      background: #f0ede9;
    }

    [data-theme="light"] .gallery-main img {
      background: #f0ede9;
    }

    .detail-content[data-project-id="wolfrom-actuator"] .gallery-main,
    .detail-content[data-project-id="wolfrom-actuator"] #galleryMediaContainer,
    .detail-content[data-project-id="wolfrom-actuator"] #galleryMediaContainer picture,
    .detail-content[data-project-id="wolfrom-actuator"] #galleryMediaContainer img {
      background: #fff;
    }

    .detail-content[data-project-id="wolfrom-actuator"] #galleryMediaContainer img {
      object-position: center center;
    }

    .detail-content.visible .detail-close {
      opacity: 1;
      transform: scale(1);
    }

    .detail-close:hover {
      background: rgba(255,255,255,0.1);
      border-color: var(--border-light);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,255,255,0.2), 0 0 40px rgba(255,255,255,0.1);
    }

    .detail-close::before,
    .detail-close::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 2px;
      background: #fff;
      transition: all 0.2s;
    }
    .detail-close::before { transform: rotate(45deg); }
    .detail-close::after { transform: rotate(-45deg); }

    /* ESC hint animation */
    .esc-hint {
      position: fixed;
      top: 132px;
      right: 100px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      font-family: var(--font-mono);

  <strong>Overview</strong><br><br>
  I am designing a compact Wolfrom compound planetary actuator for humanoid-scale joints. The current geartrain uses a driven sun, three compound planets at 120°, a fixed Ra ring integrated into the housing, and an Rb output ring. Tooth counts S=33, Ps=57, Pa=27, Pb=25, Ra=72, and Rb=75 give <b>555/11 = 50.45:1</b> reduction.<br><br>

  The design target is <b>50 N·m peak</b> and <b>30 N·m continuous</b> output torque. I pushed more reduction into the sun stage to reduce circulating power in the Wolfrom differential, then packaged the gearbox, output bearing, motor, electronics, and cable exit as one joint module. Efficiency, backlash, and backdrive performance are still targets for the metal revision and dyno, not measured final claims.<br><br>

  <picture>
    <source srcset="/assets/wolfrom-integrated-section.webp" type="image/webp">

  </picture>
  <br><em style="opacity:0.7; font-size:0.9em;">Current integrated package: Wolfrom reduction and output support above the motor, with control electronics inside the lower housing.</em><br><br>

  <strong>Prototype Iteration</strong><br><br>
  I built FDM versions before committing the housing and ring interfaces to metal. The printed hardware exposed gear-mesh clearance, stack-height, bearing-placement, gear-timing, fastener-access, and split-ring assembly problems while those changes were still cheap. The prototypes are geometry and assembly checks, not load-rated actuator validation.<br><br>

  <div class="project-inline-grid">

      <img src="/assets/wolfrom-render-side.jpg" alt="Side CAD view of the earlier plate-stack Wolfrom prototype" loading="lazy" decoding="async">

  For the integrated Structural Steel Ra ring and housing, I checked a combined peak case with <b>50 N·m</b> torque reaction, <b>500 N</b> radial bearing load, and <b>50 N·m</b> overturning moment. The refined solution returned <b>5.34 MPa</b> peak von Mises stress and <b>1.069 µm</b> maximum deformation. Topology optimization then showed that the thick outer wall contributed little compared with the circumferential gear, bearing, and mounting structure.<br><br>

  <br><em style="opacity:0.7; font-size:0.9em;">Manufacturable redesign: thin shell, preserved structural rings, simple ribs, and unchanged gear, bearing, bolt, and mating interfaces.</em><br><br>

  <details class="project-disclosure">

      Gravity and acceleration produced a <b>28.1 N·m</b> calculated continuous case, rounded to the 30 N·m design target. A 50 N hard-stop event at the load arm produced about <b>50.3 N·m</b>, setting the 50 N·m peak case.
      <div class="project-inline-grid">
        <figure><img src="/assets/wolfrom-hand-calcs.png" alt="Actuator hand calculations for continuous and peak output torque" width="892" height="838" loading="lazy" decoding="async"><figcaption>Arm load model and final design basis.</figcaption></figure>

    <div class="project-disclosure-content">

      <div class="project-inline-grid">

        excerpt: 'High-voltage battery system for Berkeley\'s Formula Electric racing team.',
        description: `<strong>The Accumulator</strong><br><br>I work on the Accumulator subteam at Formula Electric at Berkeley, designing and manufacturing the attic casing for our 588V lithium-ion battery pack. At 588V, packaging is not just packaging. It decides whether the system can be inspected, serviced, sealed, cooled, and handled without turning every maintenance step into a high-voltage risk.<br><br>I once accidentally shorted two segment busbars together and watched the cells heat up alarmingly fast. Nobody was hurt, but it changed how I approach every decision on this system: assume stored energy is real, make inspection easy, and do not hide risky interfaces behind pretty CAD.<br><br><strong>My Role: The Attic</strong><br><br>The casing has to survive FSAE crash loading, maintain dielectric isolation, pass water-ingress checks, and stay serviceable around the busbars, sensing, and HV electronics. I used SolidWorks and SolidWorks PDM for the packaging work, then ran FEA to check stress and deflection under the required 40g lateral, 40g longitudinal, and 20g vertical load cases with the team safety factors baked into the design review.<br><br>The attic mass came down by 18% while keeping the structural and dielectric requirements intact. Material choice was part of that trade: 6061-T6 aluminum gave us a workable balance between weight, weldability, heat treatment, and shop reality. 7075 was stronger on paper but not a good welded structure, steel was heavy, and carbon fiber introduced conductivity concerns near HV components.<br><br><strong>Electrical Packaging</strong><br><br>The attic geometry has to follow the real HV hardware. I use the physical contactor, current-sensor, busbar, connector, and low-voltage harness layout to check copper clearances, wire bend space, inspection access, and whether the casing can be opened without disturbing every electrical interface.<br><br><picture><source srcset="/assets/formula-e-hv-hardware.webp" type="image/webp"><img src="/assets/formula-e-hv-hardware.jpg" alt="Formula Electric high-voltage hardware with copper busbars, contactors, current sensing, connectors, and low-voltage harnessing" loading="lazy" decoding="async" style="display:block; max-width: 72%; margin: 20px auto; border-radius: 8px;"></picture><br><em style="opacity: 0.7; font-size: 0.9em;">HV hardware used to check busbar paths, sensor placement, connector access, and harness routing against the casing package.</em><br><br><strong>Floor and Sealing</strong><br><br>The floor uses 6 mm polycarbonate because it gives electrical isolation, impact resistance, and visual inspection access without disassembling the pack; at roughly 15 kV/mm dielectric strength, the material choice has huge margin over the 588V pack voltage. Waterproofing uses a 3 mm neoprene gasket at controlled compression, with aluminum standoffs preventing over-compression around the perimeter. I chose neoprene over silicone because petroleum resistance matters near the powertrain and paddock environment.<br><br><img src="/assets/accumimg.png" alt="Formula Electric accumulator attic CAD and casing packaging context" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Accumulator attic packaging: casing geometry, service access, busbar clearance, and gasket path all have to work together.</em><br><br><strong>Insulation and Thermal</strong><br><br>All internal surfaces near HV components are lined with Nomex 410 for dielectric and flame resistance. The thermal work is less about pretending the aluminum wall is the bottleneck and more about making sure the casing does not trap heat or block airflow where the pack actually needs it. The serviceability constraint is always there too: if the design makes inspection miserable, it will fail in the shop even if the simulation is clean.<br><br><strong>Manufacturing</strong><br><br>Panels are laser-cut on a FabLight fiber laser, TIG welded, then heat-treated. The polycarbonate floor and neoprene gasket are waterjet cut.<br><br><picture><source srcset="/assets/formula-e-attic-fabrication.webp" type="image/webp"><img src="/assets/formula-e-attic-fabrication.jpg" alt="Formula Electric accumulator attic panel clamped on a fabrication table during fit-up and hardware clearance work" loading="lazy" decoding="async" style="display:block; max-width: 66%; margin: 20px auto; border-radius: 8px;"></picture><br><em style="opacity: 0.7; font-size: 0.9em;">Panel fit-up and hardware-clearance work on the clamped attic assembly before final integration.</em><br><br>Before approval, the casing goes through dielectric testing, water-ingress checks, structural simulation review, and gasket compression inspection. The work is a mix of CAD, FEA, GD&T, HV packaging, material choice, and manufacturing planning, all pointed at one goal: a pack that can survive competition and still be worked on by humans.`,

        excerpt: 'Researching complex-oxide thin films for faster, lower-power memory and logic beyond DRAM and CMOS, with supervised PLD growth work and linked instrumentation/software projects.',
        description: `<strong>Research Context</strong><br><br>I work in Ramesh Lab researching complex-oxide thin films for faster, lower-power memory and logic beyond DRAM and CMOS. These materials store and switch state through polarization rather than charge, enabling non-volatile memory and ferroelectric logic far more efficient than today's silicon-based hardware. The core question is how atomic-level fabrication choices -- stacking order, strain, interface chemistry, oxygen vacancy concentration -- reshape the electronic behavior of the final device.<br><br><strong>Physics and Materials Learning</strong><br><br>A major part of this work is building the physics foundation behind the experiments. I am reading <em>Principles and Applications of Ferroelectric and Related Materials</em> by Lines and Glass while learning how polarization, domains, coercive fields, hysteresis, dielectric response, strain, and defects show up in real oxide films. The goal is to understand not just how to run a tool, but what the measurements mean physically.<br><br><strong>Growth and Deposition Work</strong><br><br>I am learning the full thin-film workflow through supervised growth and characterization work: substrate prep, solvent cleaning, annealing, step-terrace control for atomically flat surfaces, PLD growth, laser fluence tuning, oxygen partial pressure control, substrate temperature stabilization, RHEED monitoring, and post-growth characterization with AFM, XRD, PFM, and electrical measurements.<br><br>I am also practicing thin-film deposition workflows with Donald's guidance. That means learning how small process choices -- oxygen pressure, plume shape, target/substrate geometry, temperature drift, and interface preparation -- can change domain structures, mobility, coercive fields, leakage behavior, or whether the film is useful at all.<br><br><strong>Connected Technical Projects</strong><br><br>This Ramesh Lab page is the hub for two technical projects I built around that workflow. <a href="#pldtracker" class="project-preview-link" data-preview="/assets/Screenshot 2026-03-13 000052.png">PLDTracker (Ramesh Lab)</a> supports growth documentation and deposition-data organization. <a href="#ns-us-pulse-generator" class="project-preview-link" data-preview="/assets/ns-pulse-schematic-thumbnail.png">Nanosecond Spin Transport Pulse Generator Board</a> supports fast electrical characterization after films and devices are fabricated.<br><br>Together, the projects cover both sides of the lab process: making and tracking the thin films, then building the instrumentation needed to measure how they switch.<br><br><strong>Why It Matters</strong><br><br>Strain, interfaces, and atomic stacking order create emergent behaviors you cannot get in any single material alone: switchable polarization for ultra-low-energy memory, interfacial conduction for novel logic, and coupled ferroic states that can enable electrical control of magnetism. My long-term goal is to take more ownership of growth and characterization experiments while building tools that make the research workflow more repeatable, measurable, and technically grounded.`,

        excerpt: 'Nanosecond pulse-generator PCB for BiFeO3 spin-transport and ferroelectric characterization, with GaN switching, grounded coax/BNC I/O, source-measure biasing, and RP2040/Python triggering.',
        description: `
          <strong>Overview</strong><br><br>
          I am designing a nanosecond pulse-generator board in Ramesh Lab for electrical characterization of BiFeO<sub>3</sub> and related complex-oxide thin-film devices. The board is meant to support spin-transport and ferroelectric testing where the sample needs a clean voltage pulse while the rest of the bench setup handles biasing, synchronization, and measurement.<br><br>
          Current BFO testing is generally around a 30 V pulse range, with the next goal being controlled sweeps down to smaller voltages. The board is therefore not just a generic fast pulser; it is an experiment interface for applying known voltage stress to oxide devices while preserving timing, bias state, and measurement visibility.<br><br>
          <strong>Experiment Target</strong><br><br>
          The useful voltage is the voltage that actually lands across the BFO device, not the nominal setting at the connector. Current testing is generally around 30 V, and the next goal is controlled sweeps down to smaller voltages where fixture pickup, leakage, timing jitter, and ringing start to matter more. That is why I am treating the board as an experiment interface, not just a fast-switching demo circuit.<br><br>
          <strong>Measurement Problem</strong><br><br>
          For ferroelectric and spin-transport characterization, the captured current is a pileup of useful signal plus leakage, displacement current, fixture capacitance, and whatever the test setup adds. The board layout and measurement flow are built around separating those pieces as much as possible: grounded coax/BNC interfaces, a sync output for the scope, known dummy loads, relay-selected bias paths, and source-measure compatibility instead of loose wires into a mystery pulse node.<br><br>
          <strong>Design Loop</strong><br><br>
          I use KiCad for the schematic and four-layer PCB layout, with the top edge organized around BNC/coax test interfaces and the sensitive switching/control sections kept readable for bring-up. LTspice is in the loop before hardware bring-up to sanity-check switching timing, driver behavior, and load assumptions. The RP2040 handles trigger control, while Python, JupyterLab, and LabVIEW are the bench-control and analysis layer I want around the board once scope captures and source-measure data start coming in.<br><br>
          The current nanosecond board uses trigger conditioning into a GaN switching stage, with local driver power, range/control relays, shared external trigger, sync output, and Keithley/source-measure paths separated enough to bring up independently. The point is repeatability: if the pulse sequence and captured waveform are stable, then later analysis can actually distinguish BFO switching behavior from leakage and fixture effects.<br><br>

              <button class="board-layer-expand" type="button" data-board-lightbox-open aria-label="Expand board layer viewer"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5"/><path d="M3 3l7 7M21 3l-7 7M3 21l7-7M21 21l-7-7"/></svg><span>expand</span></button>
            </div>
            <span class="board-layer-caption">Layer viewer for the current four-layer ns/µs pulse board: BNC/coax test interfaces across the top edge, relay-switched bias/dut paths, local driver power, RP2040 trigger control, inner copper layers, and routed high-speed pulse/sync sections.</span>
          </div>
          <strong>V1 Microsecond Prototype</strong><br><br>
          Before the nanosecond board, I built a first-pass microsecond pulse-generator prototype to test the basic source-measure pulse workflow. V1 used a one-shot timing stage, gate driver, MOSFET output stage, manual/external trigger path, and Keithley/source-measure interface.<br><br>
          <img src="/assets/pulse-v1-physical.jpg" alt="First microsecond pulse-generator board under oscilloscope probe during bench testing" style="display:block; max-width: 70%; margin: 18px auto; border-radius: 8px;"><br>
          <em style="opacity: 0.7; font-size: 0.9em;">V1 microsecond board during bench testing. It made the measurement workflow concrete, but also showed why the nanosecond version needed tighter layout and grounded coax/BNC interfaces.</em><br><br>
          The V1 board was useful design history, not validation for the current nanosecond board. It showed the limits of terminal-block-style connections, loose wiring, and microsecond-oriented timing when the actual research need moves toward faster pulse edges, cleaner synchronization, and smaller-voltage sweeps.<br><br>
          <img src="/assets/pulse-v1-ltspice.png" alt="LTspice transient simulation for the first microsecond pulse-generator prototype" style="display:block; max-width: 100%; margin: 18px auto; border-radius: 8px;"><br>
          <em style="opacity: 0.7; font-size: 0.9em;">LTspice transient work from V1. It helped sanity-check the switching timing and output behavior before bench testing, but the nanosecond board is being documented through the current KiCad layout and upcoming scope captures.</em><br><br>
          <strong>Bring-Up Plan</strong><br><br>
          I am bringing the board up in stages: verify rails and microcontroller trigger logic, simulate and scope the driver path, validate the GaN output into known dummy loads, then move toward device fixtures. The oscilloscope work is focused on what matters for BFO testing: delivered amplitude near the 30 V regime, timing jitter between trigger and sync, overshoot/ringing at the fixture, and whether lower-amplitude pulses remain distinguishable from noise and pickup.<br><br>
          <strong>Status</strong><br><br>
          The nanosecond board is currently in schematic/layout and validation planning. I am not claiming final measured rise time, amplitude stability, timing jitter, or device results here; the next real milestone is bench characterization with oscilloscope captures and known loads before fragile thin-film devices are connected.<br><br>
          <strong>Tools In The Workflow</strong><br><br>
          KiCad is where I am doing the schematic/layout work, LTspice is being used to check switching and timing assumptions before the board is powered, and oscilloscope bring-up will validate the GaN output into known loads before any fragile thin-film device is connected. Python/JupyterLab/LabVIEW sit on the other side of that: trigger repeatability, capture organization, and later analysis of BFO pulse-response data.`,

        excerpt: 'Custom toolbox assembly taken from CAD to production-style drawings, GD&T callouts, laser/FDM fabrication planning, inspection, and prototype fit-up.',
        description: `<strong>Overview</strong><br><br>Designed and fabricated a custom toolbox prototype from production-style CAD drawings, applying ASME Y14.5-2018-style GD&T, datum selection, tolerance stackup thinking, and DFM principles to control lid, hinge, latch, handle, Gridfinity base, and fastener alignment through fabrication and assembly.<br><br>The goal was not just to make a box. I treated it as a compact mechanical manufacturing exercise: define design intent in CAD, break the assembly into fabricated parts, communicate the build through drawings, choose tolerances based on function, fabricate with available shop processes, then inspect and fit the prototype.<br><br><strong>Design Goals</strong><br><br>• Durable toolbox body with clean prototype fit-up.<br>• Lid, hinge, latch, handle, and side-wall alignment that survives fabrication error.<br>• Manufacturable geometry using accessible processes: CO2 laser-cut plywood panels, FDM printed inserts, drilled/fastened joints, and off-the-shelf hardware.<br>• Toleranced hole patterns and fastener interfaces for repeatable assembly.<br>• Drawings clear enough that someone else could understand the build sequence and critical interfaces.<br>• Minimize hand-fitting by thinking through datum strategy, hole positions, and tolerances before cutting parts.<br><br><strong>CAD + Drawing Package</strong><br><br>I modeled the toolbox as a full assembly, then split it into individual fabricated components: top walls, bottom walls, side panels, lid, hardware interfaces, and a Gridfinity-style base insert. The drawing package included assembly views, section views, part drawings, hole callouts, datum references, and notes for the intended manufacturing processes.<br><br><img src="/assets/toolbox-assembly-drawing.png" alt="Toolbox assembly drawing showing isometric, front, side, top, section, and bill of materials views" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Assembly drawing defining the lid, latch, hinge, handle, body, and Gridfinity insert interfaces before fabrication.</em><br><br>I applied GD&T principles based on ASME Y14.5-2018 rather than treating the drawing as a dimension dump. Functional datums were chosen around how the toolbox body would be assembled and inspected, with critical dimensions called out for lid fit, hinge alignment, latch engagement, handle placement, and repeated fastener patterns.<br><br><strong>GD&T / Tolerancing</strong><br><br>I treated the toolbox like a small mechanical assembly rather than a one-off shop part. The body established the primary datums, and the hinge/latch interfaces were dimensioned from those references so the lid would close repeatably after fabrication. Hole patterns were controlled with positional tolerances where alignment mattered, while non-critical dimensions were left with looser general tolerances to keep the design manufacturable.<br><br><img src="/assets/toolbox-bottom-walls-drawing.png" alt="Bottom wall drawing with datum references and positional tolerance callouts for fastener holes" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Bottom wall drawing with datum references, critical dimensions, and positional tolerance callouts for functional hole patterns.</em><br><br>The main tolerance stackup ran through the body panels, lid panels, hinge locations, latch engagement, and fastener clearances. I used position tolerance where hole alignment mattered, and kept flatness, perpendicularity, and parallelism tied to actual assembly function instead of over-tolerancing every edge.<br><br><strong>Manufacturing / DFM</strong><br><br>The prototype was designed around available shop processes rather than idealized manufacturing. The drawing package called out CO2 laser cutting for plywood panels and FDM 3D printing for the Gridfinity base, with sanding/deburring and mechanical fasteners used during assembly. That meant the CAD had to account for edge clearances, kerf/fit-up behavior, fastener access, hardware spacing, and how the parts would be held and aligned during assembly.<br><br><img src="/assets/toolbox-gridfinity-base-drawing.png" alt="Gridfinity base drawing with hole patterns, datum references, and flatness/perpendicularity callouts" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Gridfinity base drawing: an FDM-printed insert controlled with hole patterns, datum references, and fit-related tolerances.</em><br><br>Design decisions were driven by manufacturability: avoid impossible internal corners, leave realistic clearances around fasteners and moving hardware, plan the assembly sequence before cutting, and choose tolerances that matched the actual process capability of laser-cut plywood and printed parts.<br><br><strong>Inspection + Assembly</strong><br><br>After fabrication, I checked fit-up using calipers, fastener fit checks, squares, and physical assembly validation. The key inspections were hole alignment, lid closure, latch engagement, hinge alignment, and whether the Gridfinity base fit inside the body without forcing the assembly out of square.<br><br><img src="/assets/toolbox-prototype-closed.png" alt="Closed prototype toolbox fabricated from laser-cut plywood panels with hinges, latch, handle, and fasteners" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Prototype fit-up after fabrication with the lid, latches, hinges, handle, and fastener interfaces assembled.</em><br><br><img src="/assets/toolbox-prototype-open.png" alt="Open prototype toolbox showing interior storage and fit-up of the fabricated body and lid" style="max-width: 100%; margin: 20px 0; border-radius: 8px;"><br><em style="opacity: 0.7; font-size: 0.9em;">Open prototype showing the internal fit-up and hardware alignment. I do not have photos of the final version, so these prototype photos show the fabrication/assembly validation stage.</em><br><br>The prototype revealed the normal gap between drawing intent and shop reality: fasteners need access, laser-cut edges need finishing, hole patterns need enough clearance to tolerate small shifts, and datums only help if they match how the part is actually assembled and inspected.<br><br><strong>What I Learned</strong><br><br>Drawings are design tools, not paperwork. GD&T only matters when tied to function, and over-tolerancing makes a part harder to build without improving the assembly. Datum selection should match how the part is actually assembled and checked. Even a small toolbox exposes real tolerance stackup problems quickly, especially when hinges, latches, handles, printed inserts, and repeated fastener patterns all have to line up at once.<br><br><strong>Technical Work</strong><br><br>• Modeled the full toolbox assembly and generated part/assembly drawings for fabrication.<br>• Applied GD&T principles using ASME Y14.5-2018-style conventions for datums, hole patterns, and critical interfaces.<br>• Designed for manufacturability with realistic shop tolerances, fastener clearances, hardware spacing, and laser/FDM process constraints.<br>• Planned fabrication and assembly sequence to reduce hand-fitting and improve alignment.<br>• Inspected prototype parts with calipers, fastener fit checks, squareness checks, and physical assembly validation.`,

        excerpt: 'Experiment tracking and data-management system for PLD thin-film workflows, linking growth parameters, wafer position, characterization data, and lab documentation.',
        description: `<strong>Overview</strong><br><br>PLDTracker is a custom experiment tracking and data-management system I built for the lab's pulsed laser deposition setup. The goal was to replace scattered notes, slide decks, screenshots, and spreadsheets with a searchable dataset that connects how a film was grown with how it later characterized.<br><br><strong>What It Tracks</strong><br><br>The system logs each deposition run's substrate, target material, temperature, oxygen pressure, laser fluence, deposition time, and wafer disk position. It stores and links characterization data such as XRD scans and AFM/PFM domain images to specific runs, so researchers can correlate growth parameters with resulting film structure and properties.<br><br><strong>Data Explorer</strong><br><br>I used Python and Pandas to clean deposition records into a structure that could actually be filtered and compared. The dashboard lets researchers move through runs, filter by growth parameters, and plot connected datapoints or trend lines when they want to check whether a process change is showing up in characterization results.<br><br><strong>Image and Document Pipeline</strong><br><br>The camera module was built to tie substrate-position images to the deposition run instead of leaving them as loose screenshots. I also wrote a PDF slide-deck parser that pulls AFM, PFM, and XRD figures out of lab presentations and helps associate them with the correct deposition records. OpenCV/image-processing work came in where the system needed to organize camera captures and make image data easier to search later.<br><br><strong>Why It Matters</strong><br><br>Thin-film growth is sensitive to small process changes. Oxygen vacancy concentration, substrate temperature, plume shape, and interface quality can all reshape domain structures, mobility, leakage, or coercive fields. PLDTracker was built to make those relationships easier to document and revisit across experiments instead of relying on memory and scattered files.<br><br><strong>Hardware Tie-In</strong><br><br>I also CAD-modeled a SolidWorks camera mount for the PLD chamber so the tracking workflow was not purely software. That part of the project was a good reminder that lab software gets much more useful when it matches how the hardware is actually used during growth.`,

        description: `<strong>The Research</strong><br><br>My AP Research capstone, turned interactive tool. Rural America pays ~25% more for electricity than urban areas and relies on aging infrastructure. I investigated whether hybrid Small Modular Reactor + solar systems could address this inequity. Solar costs dropped 89% since 2010 but cannot generate at night; SMRs provide 24/7 low-carbon baseload. Together they balance each other out. Almost all existing SMR research focuses on urban implementation, which left a clear gap for rural applications.<br><br><strong>The Tool</strong><br><br>Atlas SMR is an interactive web platform pulling data from the NRC, EIA, and USGS seismic databases. It displays 89 operating reactors, 13 shutdown facilities, and 119 candidate sites scored by a weighted algorithm. The scoring model weighs population inside the NRC emergency planning zone, seismic-fault proximity, cooling-water access, and grid interconnection capacity. Users can change the weights and immediately see candidate rankings shift instead of treating the map as a fixed answer.<br><br><strong>Scenario Builder</strong><br><br>Users configure 50-300 MWe per module, 1-12 modules per site, and deployment year. For hybrid systems, the tool compares SMR baseload against solar capacity factor and curtailment assumptions. In solar-rich regions like Navajo Nation, larger solar arrays reduce SMR daytime load. In cloudier areas like Nome, Alaska, the system leans on SMR output. My analysis showed a properly configured hybrid could meet ~24% of rural energy needs, with clear scalability beyond that.<br><br><strong>Limitations</strong><br><br>SMR cost estimates still lack large-scale U.S. operational data. Nuclear stigma is real. This tool is a prototype visualization, not a policy instrument -- actual site selection requires Environmental Impact Statements and full NRC licensing far beyond what a scoring algorithm captures.`,

        excerpt: 'YC x DeepMind hackathon winner. Real-time generative music for the visually impaired.',
        description: `<strong>YC x DeepMind Hackathon Winner</strong><br><br>Built at the YC x Google DeepMind hackathon in San Francisco. Leitmotif generates adaptive, real-time background music for visually impaired users. A webcam watches the scene, and every person who enters gets assigned a unique musical motif -- a short melodic signature that weaves into an evolving soundtrack reflecting the room's mood. When someone leaves, their motif plays back inverted as a farewell cue. The whole system is designed to give spatial awareness through sound alone, no screen needed.<br><br><strong>The Pipeline</strong><br><br>Everything runs in a continuous loop. A webcam frame gets captured and base64-encoded, then sent to Gemini 2.5 Flash for vision analysis: who is visible, what the room feels like, and what changed since the last frame. That scene data goes to the Music Engine, which pulls each person's stored motif from Supabase/PostgreSQL. A prompt builder turns the scene state into a Lyria-compatible music prompt, Gemini refines the tempo/key/instrumentation choices, and the Google Lyria RealTime API streams PCM audio directly to speakers.<br><br>Crossfading between emotional states uses a 4-6 second blend window. Without smooth transitions, mood shifts sounded jarring -- like someone changing the radio station mid-song. The crossfade duration is a tradeoff: too short and the transitions feel abrupt, too long and the system feels unresponsive to actual scene changes.<br><br><strong>The Motif System</strong><br><br>Each person's musical signature is stored as structured JSON: note count, interval patterns, rhythm sequences, melodic contours, and character descriptors. On entry, the motif plays once as a bright solo phrase over a ducked background. On exit, the motif plays descending and inverted. That gives users a learnable association between people and sounds instead of a generic notification beep.<br><br>Motif management enforces musical rules in code. If two people enter within a short window, the system queues motifs rather than layering them, because simultaneous melodic lines become indistinguishable. The prompt builder also keeps motifs compatible with the current background key and mood so the accessibility cue stays clear instead of turning into noise.<br><br><strong>Architecture</strong><br><br>Two servers. The Music Engine (port 3001) handles real-time scene orchestration, adaptive prompt generation, entry/exit transitions, and crossfading. The Camera Server (port 3002) runs Gemini vision analysis on webcam frames and auto-forwards results. We split them because vision analysis and music generation have very different latency profiles, and decoupling lets each run at its own pace without blocking the other.<br><br>Backend is Node.js with TypeScript, native HTTP server, Gemini 2.5 Flash for vision + orchestration, Lyria RealTime for generative music, Supabase for persistence. The React Native companion app has Monitor, Contacts, Visualizer, and Settings screens for real-time entity tracking and motif management. The web mockup was built with React, Vite, and Tailwind so we could demo the interaction quickly during the hackathon.`,

        excerpt: 'Hardware Lead for FTC #13216. Designed robot with 500+ custom parts.',
        description: `<strong>The Robot</strong><br><br>INTO THE DEEP (2024-25 FTC game): collect samples from a submersible, score them in baskets and specimen chambers, and hang from a bar for endgame points. As Hardware Lead for Team Deja Vu #13216, I owned the mechanical design, CAD management, and manufacturing coordination. The robot CAD model has over 500 unique parts across mecanum drivetrain, active intake, transfer pathway, arm/lift, end effector, and hang mechanism.<br><br><strong>The Intake</strong><br><br>Our most iterated subsystem, four revisions total. V1 (passive funnel with compliant wheels) was too slow. V2 (active roller with surgical tubing) had inconsistent grip. V3 (dual-stage roller with speed differential) jammed at odd angles. V4 landed on a single high-speed roller with optimized geometry, and that became our competition design. Each version taught us something about the trade-offs between speed, reliability, and complexity with these specific game pieces.<br><br><strong>Manufacturing and FEA</strong><br><br>We used Markforged printers for structural nylon, Prusa for prototypes, laser-cut polycarbonate and Delrin plates, CNC-machined aluminum for high-stress parts, and standard manual tools for modifications. For the arm pivot and hang brackets, I ran FEA in SolidWorks, checking stress vs. yield (safety factor > 2.0) and deflection under load to ensure nothing interfered with mechanism travel.<br><br><strong>Software</strong><br><br>I also wrote the TeleOp code in Java: mecanum drive with field-centric control using IMU heading, arm and lift position control with encoder-based PID loops, intake/transfer sequencing, and driver feedback through gamepad rumble. Writing both the hardware and driver code let me optimize how the mechanisms actually feel to operate, which fed directly back into design decisions.<br><br>The reliability-focused approach paid off: minimal mechanical failures during matches, and we advanced through qualifications into elimination rounds.<br><br><em style="opacity: 0.7; font-size: 0.9em;">Note: Team Deja Vu #13216 has since become a legacy team, with a new group of students carrying the name forward.</em>`,

        excerpt: 'Hardware Lead for FTC #13216. Designed pixel-scoring mechanisms.',
        description: `<strong>The Game</strong><br><br>CENTERSTAGE (2023-24 FTC): robots collected hexagonal "pixels" and placed them on a vertical backdrop to create mosaic patterns, with bonus points for specific arrangements and launching paper airplane drones during endgame. I joined Deja Vu #13216 as Hardware Lead after Zenith dissolved when its founder graduated.<br><br><strong>The Claw</strong><br><br>The hardest mechanism to get right. Hexagonal pixels interlock in weird ways, and the claw had to grip them reliably without blocking the vision system. The final design used compliant TPU fingers that conform to pixel geometry, spring-loaded hinges for passive grip, and servo-actuated release. Dual-pixel capacity was critical -- grabbing two per trip to the backdrop doubled our scoring potential.<br><br><strong>Vision and Software</strong><br><br>The robot used AprilTags on the backdrop for autonomous alignment and a camera for detecting pixel positions. I wrote the TeleOp code in Java: mecanum drive with configurable speed curves, arm position presets for different backdrop heights, claw control with pixel detection feedback, drone launcher arming sequence, and intake/transfer coordination. Writing both hardware and driver code meant I could tune the controls specifically for our drivers' preferences.<br><br><strong>Results</strong><br><br>We qualified for the NorCal regional championship with minimal mechanical failures during matches. The reliability-first philosophy I brought from Zenith paid off here.<br><br><em style="opacity: 0.7; font-size: 0.9em;">Note: Team Deja Vu #13216 has since become a legacy team, with a new group of students carrying the name forward.</em>`,

        excerpt: 'Team Lead for FTC #20424. Built cone-stacking robot with custom lift.',
        description: `<strong>The Lift</strong><br><br>POWERPLAY (2022-23 FTC): stack cones on junctions of varying heights. My second year in FTC, first as Team Lead for Zenith #20424. The core mechanism was a linear lift needing 30+ inches of travel, full extension under 1.5 seconds, and enough stiffness to place cones without the whole robot feeling delayed.<br><br>We used continuous rigging with dyneema string and a high-RPM motor. The design work was less about writing a lift equation on a page and more about iterating the actual spool diameter, gear ratio, string path, carriage weight, and acceleration until the lift was fast without stalling. Onshape was where I worked through the packaging and travel, then the robot itself became the test: if the lift could not hit junction height repeatably under driver timing, the ratio was wrong no matter how good it sounded.<br><br><strong>Cone Manipulation</strong><br><br>The claw went through three versions. V1 was a simple pinch claw and dropped cones during fast lift moves. V2 added spring-loaded compliance but still cared too much about cone orientation. The breakthrough was V3: internal centering guides that funnel the cone into position before gripping. The claw needed to actively center the cone, not just grab it.<br><br><strong>Software</strong><br><br>I wrote both TeleOp and autonomous in Java using the FTC SDK. TeleOp had mecanum kinematics, lift PID control, and speed scaling modes. Autonomous used OpenCV color thresholding for signal sleeve detection, dead-wheel odometry, and IMU heading correction to fight encoder drift over the 30-second period.<br><br><strong>ZenLender</strong><br><br>I noticed teams scrambling for parts before competitions with $50+ overnight shipping on $15 parts. I built ZenLender, a basic spreadsheet system for lending parts between teams. Primitive, but the concept eventually evolved into Inventry. During one match, our lift string snapped mid-cycle because we had not inspected it for wear. Preventive maintenance matters as much as good design.<br><br><em style="opacity: 0.7; font-size: 0.9em;">Note: Team Zenith #20424 has since dissolved.</em>`,

        featured: false,
        excerpt: 'AI-powered robotics parts inventory and marketplace.',
        description: `<strong>The Problem</strong><br><br>If you have been on an FTC team, you know the panic: a motor burns out two nights before competition, and overnight shipping on a $15 part is $150+. My team scrambled through group chats and outdated spreadsheets to find nearby teams with spares. I first built ZenLender on Zenith -- a basic spreadsheet lending system -- but manual data entry killed adoption. Inventry is the real version.<br><br><strong>What It Does</strong><br><br>Three components: inventory management (track parts, quantities, conditions), a part lending network (find nearby teams with what you need), and a marketplace (in development). The stack is React/TypeScript with Tailwind on the frontend, Node.js/Express/PostgreSQL on the backend, OAuth 2.0 with team verification through FIRST's public data, hosted on Vercel and Railway.<br><br><strong>AI Invoice Parsing</strong><br><br>The biggest friction with inventory tools is data entry. Nobody wants to type in 200 parts from a GoBilda order. Users upload invoice PDFs or photos and the system extracts part numbers, quantities, prices, and dates using Tesseract OCR + GPT-4 for structured parsing. Accuracy is ~94% on clean invoices, ~85% on photographed receipts. I also built weekly scrapers for GoBilda, REV, ServoCity, and AndyMark -- 3,000+ unique SKUs feeding the search system with current pricing and availability.<br><br><strong>The Lending System</strong><br><br>The hard part: getting teams to lend parts to strangers. The solution is a reputation system where lender points unlock priority borrowing access, distance matching prioritizes teams within driving range (default 30 miles), and requests get flagged as urgent if a competition is within 7 days. Privacy was non-negotiable -- exact addresses are never shown, communication stays on-platform, and all data is encrypted and GDPR-deletable.<br><br>FTC teams already spend too much money. If this saves one team from paying $200 in emergency shipping, it is worth more than whatever I could charge.`,
