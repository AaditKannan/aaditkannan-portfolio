        active: false,
        featured: false,
        excerpt: 'Drone-based beach cleanup coordination system.',
        description: `<strong>The Concept</strong><br><br>Built in 24 hours at a hackathon (March 2023). Beach cleanups are reactive -- by the time humans show up with trash bags, damage is done. BeachSweep pairs autonomous drone surveillance with a volunteer coordination platform. Drones detect and map trash continuously; the platform directs humans to where cleanup is needed most.<br><br><strong>Drone and CV Pipeline</strong><br><br>We designed a custom quadcopter for coastal environments: solar panel on top for extended flight, stabilized downward-facing camera, corrosion-resistant frame, GPS/RTK for precise trash mapping. Drones patrol autonomously and return to solar-powered charging docks. The detection pipeline uses YOLO trained on beach debris:<br><br><code>Drone captures image → Onboard preprocessing → Object detection inference →<br>Trash objects classified → GPS coordinates tagged → Data uploaded to server</code><br><br>Trained to recognize plastic bottles, bags, fishing nets, cigarette butts, and general litter. Initial accuracy ~78% on our test dataset.<br><br><strong>The Volunteer Platform</strong><br><br>The website (beachsweep.github.io) shows an interactive map with pollution levels from drone surveys, scheduled cleanup events, and volunteer sign-up. After a drone patrol identifies trash concentrations, the system generates cleanup requests, notifies nearby volunteers, and re-surveys after cleanup to confirm improvement. Volunteers earn documented community service hours.<br><br>This is a concept, not a deployed system. Real deployment would need FAA Part 107 waivers for autonomous BVLOS operations, local government partnerships, and more robust CV models. But the core loop -- drones see what humans miss, platforms connect people who want to help with places that need it -- is compelling.`,

        description: `<strong>First Season</strong><br><br>FREIGHT FRENZY was my first season in FTC. I joined Zenith #20424 as a freshman knowing nothing -- no CAD, no drill press experience, barely knew what a motor controller was. The game: collect freight (balls and cubes) from a warehouse, deposit into a multi-level shipping hub, and spin a duck carousel for bonus points.<br><br><strong>Learning CAD and Manufacturing</strong><br><br>I started learning Onshape and my first models were rough. I did not understand constraints, so parts broke unpredictably during modification. I designed everything as separate parts and hoped they would fit together when manufactured. By mid-season I could design simple brackets with confidence; by the end I could model complete subassemblies that worked on the first try. On the shop side, I learned drill press technique, bandsaw operation, and 3D printing fundamentals -- snapping drill bits, warped prints, holes in the wrong place.<br><br><strong>Software</strong><br><br>I started learning Java and the FTC SDK, writing basic gamepad input handling, arm and intake motor control, encoder-based autonomous movements, and duck carousel timing. The code was hard-coded and full of magic numbers -- no PID, no state machines -- but it got us through matches and gave me the foundation for much more sophisticated code later.<br><br><strong>Competition</strong><br><br>My first competition was overwhelming in the best way. Our robot was nothing spectacular, but it scored freight, delivered ducks, and parked successfully. What stuck with me most was the pit atmosphere -- seeing other teams' approaches to the same problem up close and realizing FTC is a community as much as a competition. This season set the foundation for everything that followed.<br><br><em style="opacity: 0.7; font-size: 0.9em;">Note: Team Zenith #20424 has since dissolved.</em>`,

        description: `<strong>The Problem</strong><br><br>Coal-seam fires burn underground for years, sometimes centuries -- the Centralia mine fire in Pennsylvania has been burning since 1962. Carbon monoxide is odorless, and by the time you feel heat from a nearby fire, it may be too late. Miners in developing countries often work without detection equipment because it is too expensive.<br><br><strong>The Device</strong><br><br>Friendly Fires is a sensor array designed to retrofit onto tools miners already carry, keeping the warning system attached to familiar equipment. It monitors temperature (infrared), carbon monoxide (electrochemical), methane (catalytic bead), and oxygen depletion (galvanic cell). Key specs:<br><br><code>CO sensor: 0-1000 ppm range, ±5% accuracy, <2s response time<br>CH4 sensor: 0-5% LEL range, ±10% accuracy, continuous monitoring<br>Temp sensor: -20°C to 300°C range, ±1°C accuracy</code><br><br>Alerts come through haptic vibration on the tool handle, LEDs for low-light visibility, and an optional audio alarm. Powered by rechargeable lithium battery with solar surface charging and low-power sleep mode for 12+ hours of continuous operation.<br><br><strong>Prototype</strong><br><br>I built a functional prototype with Arduino-based electronics and off-the-shelf sensors, demonstrating CO detection from controlled sources, temperature gradient detection near heat, and multi-sensor integration in a compact package. This was a proof of concept -- sensor calibration in actual mining environments, long-term durability, false positive rates in dusty conditions, and regulatory approval were all unaddressed. Mining is not a lab; equipment gets dropped, covered in dust, and exposed to humidity swings.`,

    const scrambleRunIds = new WeakMap();
    let nextScrambleRunId = 0;

    // Scramble animation
    function scrambleText(element, targetText, duration = 500) {
      const runId = ++nextScrambleRunId;
      scrambleRunIds.set(element, runId);
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*';
      const startTime = Date.now();
      const originalText = element.textContent;
      
      function animate() {
        if (scrambleRunIds.get(element) !== runId) return;

        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        
        let result = '';
        for (let i = 0; i < targetText.length; i++) {
          if (targetText[i] === ' ' || targetText[i] === '-') {
            result += targetText[i];
          } else if (i < targetText.length * eased) {
            result += targetText[i];
          } else {
            result += chars[Math.floor(Math.random() * chars.length)];
          }
        }
        
        element.textContent = result;
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          element.textContent = targetText;
        }
      }
      
      requestAnimationFrame(animate);
    }

            .filter(([id, label]) => id && label)
        : [...descriptionEl.querySelectorAll(':scope > strong')]
            .map((heading, index) => {
              const label = heading.textContent.trim();
              const id = `project-${project.id}-section-${index + 1}`;
              heading.id = id;
              return [id, label];
            })
            .filter(([, label]) => label && label.toLowerCase() !== 'status');

      detailBody.classList.toggle('has-toc', tocItems.length > 1);
      if (tocItems.length > 1) {
        projectToc.classList.remove('is-menu-open');
        projectToc.innerHTML = `<span class="project-toc-label">Contents</span><button type="button" class="project-toc-toggle" aria-expanded="false" aria-controls="projectSectionLinks"><b>Contents</b><span class="project-toc-current"></span></button><ol id="projectSectionLinks">${tocItems.map(([id, label]) => `<li><a href="#${id}" data-project-section="${id}">${label}</a></li>`).join('')}</ol>`;
        projectToc.hidden = false;
      } else {
        projectToc.innerHTML = '';
        projectToc.hidden = true;
      }
      updateProjectTocActive();
      document.getElementById('detailTags').innerHTML = '';
      initializeProjectPreviews();
      initializeBoardLayerLightbox();

      // Render LaTeX math with KaTeX. Retry if the deferred auto-render script
      // hasn't loaded yet (happens when deep-linking straight to a project URL).
      (function renderMath(tries) {
        if (typeof renderMathInElement === 'function') {
          renderMathInElement(document.getElementById('detailDescription'), {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
          // Equation fonts change line heights, so measure only once they have loaded.
          if (project.id === 'formula-electric' || project.id === 'ns-us-pulse-generator') scheduleReadingBalance(document.getElementById('detailDescription'));
        } else if (tries < 40) {
          setTimeout(function () { renderMath(tries + 1); }, 100);
        }
      })(0);

      // Sidebar
      const sidebar = document.getElementById('detailSidebar');
      let sidebarHTML = '';
      
      if (project.links && project.links.length > 0) {
        sidebarHTML += `
          <h3>Links</h3>
          <div class="detail-links">
            ${project.links.map(l => l.unavailable ? `
              <a href="#" class="detail-link unavailable-link" data-original-text="${l.label}" onclick="return false;">
                <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                <span class="link-text">${l.label}</span>
              </a>
            ` : l.url && l.url.startsWith('#') ? `
              <a href="${l.url}" class="detail-link">
                <svg viewBox="0 0 24 24"><path d="M9 5v2h6.59l-9.83 9.83 1.41 1.41L17 8.41V15h2V5H9z"/></svg>
                <span class="link-text">${l.label}</span>
              </a>
            ` : `
              <a href="${l.url}" target="_blank" rel="noopener" class="detail-link">
                <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                <span class="link-text">${l.label}</span>
              </a>
            `).join('')}
          </div>
        `;
      }

      if (project.id !== 'wolfrom-actuator') sidebarHTML += `
        <h3>Project Info</h3>
        <p class="detail-project-info">
          <strong>Category:</strong> ${project.category}<br>
          <strong>Timeline:</strong> ${project.date}<br>
        </p>
      `;

      if (project.skillGroups) {
        sidebarHTML += `<dl class="project-skill-groups">${project.skillGroups.map(([group, skills]) => `<dt>${group}</dt><dd>${skills}</dd>`).join('')}</dl>`;
      } else if (project.tags && project.tags.length > 0) {
        sidebarHTML += `
          <div class="detail-skills">
            <span class="detail-skills-label">Skills</span>
            <div class="detail-skill-list">
              ${project.tags.map(t => `<span>${t}</span>`).join('')}
            </div>
          </div>
        `;
      }

      sidebar.innerHTML = sidebarHTML;
    }

    // Resume-style project preview links inside rich project descriptions
    function initializeProjectPreviews() {
      const preview = document.getElementById('projectHoverPreview');
      const previewImg = document.getElementById('projectHoverPreviewImg');
      if (!preview || !previewImg) return;

      preview.classList.remove('visible');
      previewImg.src = '';

      const links = document.querySelectorAll('.project-preview-link[data-preview]');
      links.forEach(link => {
        link.addEventListener('mouseenter', () => {
          if (window.innerWidth < 769) return;
          previewImg.src = link.dataset.preview;
          preview.classList.add('visible');
        });

        link.addEventListener('mouseleave', () => {
          preview.classList.remove('visible');
        });

        link.addEventListener('mousemove', (e) => {
          if (window.innerWidth < 769 || !preview.classList.contains('visible')) return;
          const pw = 220;
          const ph = 140;
          let left = e.clientX - pw / 2;
          let top = e.clientY + 20;
          if (left < 8) left = 8;
          if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
          if (top + ph > window.innerHeight - 8) top = e.clientY - ph - 16;
          preview.style.left = left + 'px';
          preview.style.top = top + 'px';
        });
      });
    }

    function initializeBoardLayerLightbox() {
      const viewer = document.querySelector('.board-layer-viewer');
      const trigger = document.querySelector('[data-board-lightbox-open]');
      if (!viewer || !trigger) return;

      const closeExisting = () => {
        const existing = document.querySelector('.board-layer-lightbox');
        if (existing) existing.remove();
        document.body.style.overflow = '';
      };

      trigger.addEventListener('click', () => {
        closeExisting();

        const selected = viewer.querySelector('input[name="ns-board-layer"]:checked');
        const clone = viewer.cloneNode(true);
        const cloneSuffix = 'expanded-' + Date.now();
        const controls = clone.querySelector('.board-layer-controls');
        const expandButton = clone.querySelector('[data-board-lightbox-open]');
        if (expandButton) expandButton.remove();

        clone.querySelectorAll('input[type="radio"]').forEach((input) => {
          const oldId = input.id;
          const newId = oldId + '-' + cloneSuffix;
          input.dataset.layerBase = oldId.replace('ns-layer-', '');
          input.name = 'ns-board-layer-' + cloneSuffix;
          input.id = newId;
          input.checked = selected && oldId === selected.id;
          const label = controls ? controls.querySelector(`label[for="${oldId}"]`) : null;
          if (label) label.setAttribute('for', newId);
        });

        const syncCloneLayer = () => {
          const activeInput = clone.querySelector(`input[name="ns-board-layer-${cloneSuffix}"]:checked`);
          const activeLayer = activeInput ? activeInput.dataset.layerBase : 'render';
          clone.querySelectorAll('.board-layer-stage img').forEach((img) => {
            img.style.opacity = img.classList.contains('layer-' + activeLayer) ? '1' : '0';
          });
          clone.querySelectorAll('.board-layer-controls label').forEach((label) => {
            label.classList.toggle('is-active', activeInput && label.getAttribute('for') === activeInput.id);
          });
        };

        clone.querySelectorAll('input[type="radio"]').forEach((input) => {
          input.addEventListener('change', syncCloneLayer);
        });
        syncCloneLayer();

        const overlay = document.createElement('div');
        overlay.className = 'board-layer-lightbox active';
        overlay.innerHTML = `
          <div class="board-layer-lightbox-panel" role="dialog" aria-modal="true" aria-label="Expanded nanosecond board layer viewer">
            <button class="board-layer-lightbox-close" type="button" aria-label="Close expanded board viewer">&times;</button>
          </div>
        `;
        overlay.querySelector('.board-layer-lightbox-panel').appendChild(clone);
        document.body.appendChild(overlay);
        document.body.style.overflow = 'hidden';

        let escapeHandler;
        const close = () => {
          document.removeEventListener('keydown', escapeHandler);
          closeExisting();
        };
        overlay.querySelector('.board-layer-lightbox-close').addEventListener('click', close);
        overlay.addEventListener('click', (event) => {
          if (event.target === overlay) close();
        });

        escapeHandler = (event) => {
          if (event.key === 'Escape') {
            close();
          }
        };
        document.addEventListener('keydown', escapeHandler);
      });
    }

    // Open detail view
    function openDetail(projectId, pushHistory = true) {
      const index = projects.findIndex(p => p.id === projectId);
      if (index === -1) return;

      currentProjectIndex = index;
      const project = projects[index];
      const titleStart = isDetailOpen ? detailTitle.textContent : 'Projects';

      // Set the lightweight header first so the transition can begin immediately.
      detailContent.dataset.projectId = project.id;
      document.getElementById('detailCategory').textContent = project.category;
      document.getElementById('detailDate').textContent = (project.active ? '● ' : '') + project.date;
      detailTitle.textContent = titleStart;
      // Do not reveal cached gallery pixels from the previous open while its new styles settle.
      document.getElementById('detailGallery').replaceChildren();

      document.querySelectorAll('.project-card.active-card').forEach(card => {
        card.classList.remove('active-card');
      });
      const activeCard = grid.querySelector(`.project-card[data-id="${projectId}"]`);
      if (activeCard) activeCard.classList.add('active-card');

      // Show detail view
      document.body.classList.add('detail-active');
      detailContent.classList.remove('closing');
      detailContent.classList.remove('visible');

      // Commit the opacity start state, then reveal before building heavy media/body content.
      getComputedStyle(detailContent).opacity;
      isDetailOpen = true;
      detailContent.classList.add('visible');
      scrambleText(detailTitle, project.title, 420);

      // Gallery, rich copy, and interactive viewers are populated after the
      // first transition frame; they enter later through the existing section delays.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (currentProjectIndex === index && isDetailOpen) {
          updateDetailView(project);
        }
      }));

      // Update URL hash
      if (pushHistory) history.pushState(null, '', '#' + projectId);

      // Scroll to top
      detailContent.scrollTop = 0;
    }

    // Close detail view
    function closeDetail(pushHistory = true) {
      if (!isDetailOpen) return;

      // Scramble title back
      pageTitle.textContent = 'Projects';
      scrambleText(detailTitle, 'Projects', 220);

      // Smooth detail close animation
      detailContent.classList.add('closing');

      // Clear URL hash
      if (pushHistory) history.pushState(null, '', window.location.pathname);

      setTimeout(() => {
        detailContent.classList.remove('visible', 'closing');
        delete detailContent.dataset.projectId;
        document.querySelectorAll('.project-card.active-card').forEach(card => {
          card.classList.remove('active-card');
        });
        document.body.classList.remove('detail-active');
        pageTitle.textContent = 'Projects';
        detailTitle.textContent = '';
        isDetailOpen = false;
        currentProjectIndex = -1;
        requestedProjectSectionId = null;
      }, 280);
    }

    // Event listeners
    grid.addEventListener('click', e => {
      const card = e.target.closest('.project-card');
      if (!card) return;
      const proj = projects.find(p => p.id === card.dataset.id);
      if (proj && proj.pageUrl) { window.location.href = proj.pageUrl; return; }
      openDetail(card.dataset.id);
    });

    detailClose.addEventListener('click', closeDetail);

    function scrollToProjectSection(event) {
      const toggle = event.target.closest('.project-toc-toggle');
      if (toggle) {
        const open = projectToc.classList.toggle('is-menu-open');
        toggle.setAttribute('aria-expanded', String(open));
        return;
      }
      const link = event.target.closest('a[data-project-section]');
      if (!link || !isDetailOpen) return;
      const target = document.getElementById(link.dataset.projectSection);
      if (!target) return;
      event.preventDefault();
      projectToc.classList.remove('is-menu-open');
      projectToc.querySelector('.project-toc-toggle')?.setAttribute('aria-expanded', 'false');
      target.tabIndex = -1;
      target.focus({ preventScroll: true });
      requestedProjectSectionId = link.dataset.projectSection;
      const targetTop = target.getBoundingClientRect().top - detailContent.getBoundingClientRect().top + detailContent.scrollTop;
      const mobileOffset = matchMedia('(max-width: 900px)').matches ? 46 : 0;
      const headerOffset = document.querySelector('.nav-bar').getBoundingClientRect().height + 24 + mobileOffset;
      detailContent.scrollTo({ top: Math.max(0, targetTop - headerOffset), behavior: 'smooth' });
      history.replaceState(null, '', `#${detailContent.dataset.projectId}`);
    }

    projectToc.addEventListener('click', scrollToProjectSection);
    document.getElementById('detailDescription').addEventListener('click', scrollToProjectSection);
    projectToc.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || !projectToc.classList.contains('is-menu-open')) return;
      event.stopPropagation();
      projectToc.classList.remove('is-menu-open');
      const toggle = projectToc.querySelector('.project-toc-toggle');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.focus();
    });

    // Back to top button
    const detailFabs = document.getElementById('detailFabs');
    const fabBackToTop = document.getElementById('fabBackToTop');

    detailContent.addEventListener('scroll', () => {
      detailFabs.classList.toggle('visible', detailContent.scrollTop > 300);
      scheduleProjectTocActive();
    }, { passive: true });

    fabBackToTop.addEventListener('click', () => {
      detailContent.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (!isDetailOpen) return;
      if (e.key === 'Escape') closeDetail();
    });

    // Handle browser back/forward
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.substring(1);
      if (hash && projects.some(p => p.id === hash)) {
        openDetail(hash, false);
      } else if ((hash.startsWith('sn6-') || hash.startsWith('project-')) && isDetailOpen) {
        return;
      } else if (isDetailOpen) {
        closeDetail(false);
      }
    });

    // Initialize
    renderGrid();
    
    // Check for URL hash to open specific project
    if (window.location.hash) {
      const projectId = window.location.hash.substring(1);
      const projectExists = projects.some(p => p.id === projectId);
      if (projectExists) {
        setTimeout(() => openDetail(projectId, false), 100);
      }
    }
    
    // Initial title scramble
    if (!window.location.hash) {
      scrambleText(pageTitle, 'Projects', 600);
    }


    // Unavailable link scramble effect
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
    const unavailableText = 'SITE NOT AVAILABLE';
    
    document.addEventListener('mouseover', (e) => {
      const link = e.target.closest('.unavailable-link');
      if (!link) return;
      
      const textEl = link.querySelector('.link-text');
      if (!textEl || textEl.dataset.animating === 'true') return;
      
      textEl.dataset.animating = 'true';
      const originalText = link.dataset.originalText;
      let iteration = 0;
      const maxIterations = unavailableText.length;
      
      const interval = setInterval(() => {
        textEl.textContent = unavailableText
          .split('')
          .map((char, i) => {
            if (i < iteration) return unavailableText[i];
            return chars[Math.floor(Math.random() * chars.length)];
          })
          .join('');
        
        iteration += 1/2;
        if (iteration >= maxIterations) {
          clearInterval(interval);
          textEl.textContent = unavailableText;
        }
      }, 30);
    });
    
    document.addEventListener('mouseout', (e) => {
      const link = e.target.closest('.unavailable-link');
      if (!link) return;
      
      const textEl = link.querySelector('.link-text');
      if (!textEl) return;
      
      textEl.dataset.animating = 'false';
      textEl.textContent = link.dataset.originalText;
    });
  </script>
  <script>
    // Cursor glow
    (function() {
      const glow = document.getElementById('cursorGlow');
      if (!glow || window.innerWidth < 769) return;
      let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        if (!glow.classList.contains('visible')) glow.classList.add('visible');
      });
      function animate() {
        glowX += (mouseX - glowX) * 0.3;
        glowY += (mouseY - glowY) * 0.3;
        glow.style.left = glowX + 'px';
        glow.style.top = glowY + 'px';
        requestAnimationFrame(animate);
      }
      animate();
    })();

  </script>
</body>
</html>
