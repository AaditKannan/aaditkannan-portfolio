      - generic [ref=e37]:
        - strong [ref=e38]: Overview
        - text: I designed a compact toolbox for Berkeley project teams working at the Richmond Field Station. The goal was to create a practical toolbox that could fit in a backpack and make it easier to carry essential tools between campus, project spaces, and the field station.
        - text: "This was not meant to be a highly complex mechanical system. The value of the project was in the design-to-manufacturing workflow: CAD modeling, 2D drawings, GD&T, tolerancing, material/process constraints, fabrication planning, and documentation."
        - strong [ref=e39]: What I Built
        - text: • Designed a compact backpack-sized toolbox for project team use at the Richmond Field Station
        - text: • Modeled the toolbox in CAD with portability and practical shop use in mind
        - text: • Created 2D engineering drawings with dimensions and GD&T callouts
        - text: • Practiced tolerancing and manufacturability decisions under a limited project timeline
        - text: • Prepared documentation for fabrication and assembly
        - text: • Used the project to improve drawing quality, manufacturing communication, and practical design habits
        - strong [ref=e40]: Technical Details
        - text: The toolbox was intentionally a relatively simple mechanical project, but it emphasized the manufacturing side of engineering. The design centered around making a portable, usable box for project team members who need to move tools between workspaces without carrying a full-size toolbox.
        - text: I focused on clear drawings, fabrication order, tolerances where they mattered, and documentation that could communicate the design to someone else. The project gave me practice turning a real user need into a manufacturable design package under a short timeline.
        - strong [ref=e41]: Skills Used
        - text: CAD, GD&T, 2D drawings, tolerancing, manufacturing documentation, fabrication planning, mechanical design, design for manufacturing, practical prototyping.