        - text: A compact high-ratio Wolfrom compound planetary actuator prototype for humanoid-scale robotic joints, focused on torque-dense gearbox packaging, mechanical integration, and rapid prototype validation.
        - strong [ref=e234]: Overview
        - text: I designed a compact Wolfrom compound planetary actuator for humanoid-scale robotic joints. The goal is to package high reduction, high torque density, and clean mechanical integration into a small actuator module that can be prototyped quickly and later transitioned toward more robust manufacturing.
        - text: The actuator uses a driven sun gear, compound planet stacks, a fixed internal ring, and an output internal ring to create a high-ratio reduction in a compact axial package. The current design targets approximately 50:1 reduction.
        - strong [ref=e235]: Gear Ratio
        - text: "The reduction is a split-Wolfrom: the motor drives the sun (S), and each compound planet carries two gears — one (Pa) meshing a fixed internal ring (Ra), the other (Pb) driving the output internal ring (Rb). The overall ratio is the product of a sun-to-carrier stage and a carrier-to-output-ring stage:"
