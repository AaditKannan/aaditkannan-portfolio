        - text: An LPR near 17.6 means roughly 0.1% of friction in a single ring mesh costs about 1.7 points of overall efficiency. That sensitivity drives almost every decision in the design.
        - strong [ref=e590]: Primary Problems to Solve
        - text: •
        - strong [ref=e591]: "Ring-mesh efficiency:"
        - text: the two internal meshes dominate losses, so their tooth geometry and surface finish matter far more than the lightly-loaded sun stage
        - text: •
        - strong [ref=e592]: "Planet-bearing drag:"
        - text: the compound planets spin at ~2.67× carrier speed, so the planet supports are a major loss path — the metal design moves from printed bushings toward needle bearings on hardened, ground pins
        - text: •
        - strong [ref=e593]: "Load sharing:"
        - text: three rigid planets are overconstrained, so I use a floating sun and a floating (zero-net-torque) carrier plus set-at-assembly planet timing to let the planets self-center and share load
        - text: •
        - strong [ref=e594]: "Backdrivability:"
        - text: printed, rough meshes make the joint feel dead; low-contact-ratio, profile-shifted teeth and low-friction bearings are what make it transparent
        - text: •
        - strong [ref=e595]: "Manufacturing:"
        - text: internal ring teeth can't be cleanly milled, so production rings are planned as wire-EDM hardened-steel inserts pressed into an aluminum housing
        - strong [ref=e596]: What I Built
        - text: • Designed a Wolfrom-style compound planetary gearbox targeting ~50:1 reduction
        - text: • Modeled the full actuator stackup — sun gear, compound planets, fixed ring, output ring, carrier, bearings, shafts, and output hub
        - text: • Iterated on output ring splitting, bolt access, bearing support, and axial spacing for cleaner assembly
        - text: • Designed around real manufacturing constraints — FDM/SLA prototypes, CNC/waterjet options, press-fit bearings, dowel alignment, and low-profile fasteners
        - text: • Built prototypes to evaluate gear meshing, packaging, assembly sequence, and mechanical fit
        - strong [ref=e597]: Technical Details
        - text: The gearbox uses a compact compound planetary layout where the motor drives the sun gear, one planet gear meshes with a fixed internal ring, and another planet gear drives the output ring. This Wolfrom-style architecture creates a high reduction ratio without stacking multiple conventional gearboxes. All three meshes share a single planet-axis center distance, which forces a fixed module ratio across the stages and makes the packaging tightly coupled.
        - text: Key design constraints included gear clearance, bearing support, shaft alignment, output ring stiffness, fastener access, printability, and the future transition from 3D-printed prototypes to a metal/SLA hybrid version.
        - strong [ref=e598]: Skills Used
        - text: CAD, gearbox design, actuator design, Wolfrom geartrains, tolerance stackups, bearing selection, fastener packaging, FDM/SLA prototyping, CNC/DFM planning, robotic hardware integration, mechanical testing.
        - strong [ref=e599]: Status
        - text: Currently iterating on printed prototypes for kinematics, packaging, and assembly sequence while optimizing the design for a metal build. That means running gear macro-geometry optimization in KISSsoft (profile shifts and tip relief on the high-load ring meshes), and moving toward wire-EDM hardened-steel ring inserts, needle bearings on hardened pins, and a floating sun/carrier package before committing to a more robust metal/SLA-hybrid version.
