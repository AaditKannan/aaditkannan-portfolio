      - generic [ref=e81]:
        - text: "A high-ratio Wolfrom gearbox for humanoid-scale joints. I'm building it around the three things gearboxes this small are usually bad at: backdrivability, low reflected inertia, and real efficiency at high reduction."
        - strong [ref=e82]: Overview
        - text: "Humanoid robots need joints that are small, put out a lot of torque, and can still feel what they touch. That last part is the hard one. Most small high-ratio gearboxes are basically one way: you can drive the output from the motor, but you can't easily push the motor backward from the output, so the joint feels dead and can't do force control. I'm designing a Wolfrom compound planetary actuator that hits a high reduction in a small package while staying efficient enough to actually backdrive."
        - text: "The layout: the motor drives a sun gear, and each compound planet carries two gears, one meshing a fixed inner ring and the other driving the output ring. The small difference between those two ring meshes is where the big reduction comes from. I'm targeting around 50:1, with a 125:1 version in the same family."
        - strong [ref=e83]: Gear Ratio
        - text: "The reduction is the product of a sun-to-carrier stage and a carrier-to-output-ring stage:"
