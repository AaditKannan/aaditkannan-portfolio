        - text: At 50:1 the joint feels about 2500 times the motor's rotor inertia. You can't design that away, it comes with the ratio. So the only way to keep the joint quick and backdrivable is to attack the part you can control, which is friction. Low friction is what stops all that reflected mass from turning into a joint that feels locked.
        - strong [ref=e369]: Efficiency, and Why It Matters Most
        - text: "Wolfrom gearboxes are famous for being small and famous for being inefficient. The reason is circulating power. The high ratio comes from the small difference between two almost equal ring meshes, so far more power spins around inside the gearbox than ever comes out the other side, and that extra power turns into friction. I track it with the latent power ratio:"
