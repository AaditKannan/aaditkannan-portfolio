        - text: An LPR around 17.6 means roughly 0.1% of friction in one ring mesh costs about 1.7 points of overall efficiency. A naive Wolfrom at this ratio sits closer to LPR 50 and lands in the 60s for efficiency or worse. My target is about 80%. For a single-stage 50:1 gearbox that puts it in the same range as much more expensive harmonic and cycloidal drives, while staying backdrivable, which those usually are not.
        - strong [ref=e439]: Why This One Is Different
        - text: The standout move is how I split the ratio. A textbook Wolfrom dumps almost all of its reduction into the high-loss ring differential, which is exactly why the circulating power blows up. I re-split it so more of the reduction happens in the first sun stage and less in the ring differential. That alone drops the latent power ratio from around 50 to about 17.6 on my current tooth counts, and the metal redesign pushes it lower still. Lower circulating power is the single biggest lever on both efficiency and backdrivability, so the whole design is built to chase it.
        - text: For a humanoid that combination is the entire point. You get a small, torque-dense joint that can hold a load without a brake, but can also go soft and compliant the moment a person bumps into it. Strong, light, and safe to be around, in something that fits inside a leg or an arm.
        - strong [ref=e440]: Primary Problems to Solve
        - text: "• Ring-mesh efficiency: the two internal ring meshes carry almost all the load and cause almost all the friction, so their tooth shape and surface finish matter far more than the sun gear."
        - text: "• Planet-bearing drag: the compound planets spin at about 2.67x carrier speed, so their bearings are a big loss path. The metal version moves from printed bushings to needle bearings on hardened, ground pins."
        - text: "• Load sharing: three planets are over-constrained, so I float the sun and the carrier and time the planets at assembly so all three actually share the load."
        - text: "• Backdrivability: rough printed teeth make the joint feel dead, so I use profile-shifted, low-friction gears and low-drag bearings to keep it transparent."
        - text: "• Manufacturing: internal ring teeth can't be cleanly milled, so the production rings are wire-EDM hardened steel pressed into an aluminum housing."
        - strong [ref=e441]: What I Built
        - text: • Designed the full Wolfrom compound planetary gearbox targeting about 50:1, with a 125:1 variant in the same envelope.
        - text: "• Modeled the whole actuator stack: sun, compound planets, fixed ring, output ring, carrier, bearings, shafts, and output hub."
        - text: • Iterated on splitting the output ring, bolt access, bearing support, and axial spacing so it actually goes together.
        - text: "• Designed around real manufacturing: FDM and SLA prototypes now, CNC and waterjet later, press-fit bearings, dowel alignment, low-profile fasteners."
        - text: • Built printed prototypes to check gear meshing, packaging, the assembly sequence, and fit.
        - strong [ref=e442]: Technical Details
        - text: "The motor drives the sun, one planet gear meshes the fixed inner ring, and the other planet gear drives the output ring, both on the same compound planet. All three meshes share one planet-axis center distance, which forces the module ratio across the stages into roughly 1 : 2 : 1.8, so every stage is sized to its own teeth on the same circle. The output-ring mesh is both the highest loaded and the finest pitch, so it gets the widest face and, in the metal build, the hardest steel."
        - img "CAD cutaway section of the Wolfrom actuator showing the sun gear, compound planet stacks, fixed inner ring, and output ring" [ref=e443]
        - emphasis [ref=e444]: "CAD cutaway: the sun drives the compound planets, which mesh the fixed inner ring with one gear and the output ring with the other, all in one axial package."
        - text: The current prototype runs on a goBILDA gearmotor for bench testing, with the whole gearbox built as a stack of plates (motor mount, carrier cheeks, fixed ring, output ring) tied together by standoffs and dowels so I can tear it down and re-time it by hand.
        - img "Side view of the Wolfrom actuator as a stack of plates mounted on the goBILDA motor" [ref=e445]
        - emphasis [ref=e446]: "The actuator as a stack of plates on the goBILDA motor: motor mount, carrier, and the fixed and output rings, set by standoffs and dowels."
        - strong [ref=e447]: Skills Used
        - text: CAD, gearbox design, actuator design, Wolfrom geartrains, KISSsoft gear optimization, tolerance stackups, bearing selection, fastener packaging, FDM and SLA prototyping, CNC and DFM planning, robotic hardware integration, mechanical testing.
        - strong [ref=e448]: Status
        - text: "Right now I'm iterating on printed prototypes for the kinematics, packaging, and assembly while optimizing the design for a metal build. That means running the gear macro-geometry in KISSsoft (profile shifts and tip relief on the high-load ring meshes), and moving toward wire-EDM hardened-steel rings, needle bearings on hardened pins, and a floating sun and carrier before I commit to the metal version. Bench testing follows a one-variable-at-a-time plan: contact patterns to confirm all three planets share load, breakaway and backdrive measurements to see how transparent the joint feels, and an efficiency sweep against that 80% target."
